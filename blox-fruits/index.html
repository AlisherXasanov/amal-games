<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Blox Fruits — черновик</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#0a2a4a;font-family:Segoe UI,system-ui,sans-serif;color:#fff}
    #hud{position:fixed;top:10px;left:10px;z-index:20;max-width:min(360px,78vw);text-shadow:0 1px 3px #000;font-size:13px;line-height:1.45}
    #hud h1{font-size:17px;margin-bottom:2px}
    #hud b{color:#fde68a}
    .bar{width:170px;height:9px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;margin:3px 0 6px}
    .bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#4ade80)}
    #draft{position:fixed;top:10px;right:10px;z-index:20;font-size:11px;opacity:.8;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px}
    #toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.85);padding:10px 16px;border-radius:12px;font:800 14px/1.3 system-ui;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
    #toast.show{opacity:1}
    #prompt{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:20;font:800 13px/1 system-ui;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;display:none;white-space:nowrap}
    #skills{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:96vw}
    #skills button{min-width:72px;padding:10px 12px;border:0;border-radius:12px;font:800 12px/1.15 system-ui;cursor:pointer;color:#0f172a;background:linear-gradient(135deg,#fde68a,#f59e0b)}
    #skills button.blu{background:linear-gradient(135deg,#93c5fd,#3b82f6);color:#fff}
    #skills button.pur{background:linear-gradient(135deg,#d8b4fe,#7c3aed);color:#fff}
    #skills button.grn{background:linear-gradient(135deg,#86efac,#16a34a);color:#052e16}
    #skills button:disabled{opacity:.4}
    #sheet{position:fixed;right:12px;bottom:78px;z-index:30;width:min(280px,92vw);display:none;padding:12px;border-radius:14px;background:rgba(8,18,32,.94);border:1px solid rgba(255,255,255,.12)}
    #sheet.open{display:block}
    #sheet h3{font-size:14px;margin-bottom:8px}
    #sheet button{display:block;width:100%;margin:0 0 6px;padding:10px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font:700 12px/1.2 system-ui;cursor:pointer;text-align:left}
    #sheet button:hover{background:rgba(56,189,248,.28)}
    #tut{position:fixed;inset:0;z-index:60;background:rgba(4,12,24,.72);display:flex;align-items:center;justify-content:center;padding:16px}
    #tut .box{width:min(420px,94vw);background:linear-gradient(160deg,#0f2744,#0b1626);border:1px solid rgba(125,211,252,.35);border-radius:16px;padding:18px 16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
    #tut h2{font-size:18px;margin-bottom:8px;color:#7dd3fc}
    #tut p{font-size:14px;line-height:1.5;margin-bottom:14px;opacity:.95}
    #tut .row{display:flex;gap:8px;justify-content:flex-end}
    #tut button{border:0;border-radius:10px;padding:10px 14px;font:800 13px/1 system-ui;cursor:pointer}
    #tut .next{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff}
    #tut .skip{background:rgba(255,255,255,.1);color:#cbd5e1}
    #stepDots{display:flex;gap:6px;margin-bottom:10px}
    #stepDots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
    #stepDots span.on{background:#38bdf8}
  </style>
</head>
<body>
  <div id="hud">
    <h1>Blox Fruits</h1>
    Ур. <b id="lvl">1</b> · Beli: <b id="beli">0</b><br/>
    Фрукт: <b id="fruit">нет</b> · Остров: <b id="isle">Стартовый</b><br/>
    Квест: <span id="quest">убей 3 пирата (0/3)</span>
    <div class="bar"><i id="hpFill"></i></div>
  </div>
  <div id="draft">черновик · не на сайте</div>
  <a id="btnMenu" href="../_private/" style="position:fixed;top:42px;right:10px;z-index:50;padding:8px 12px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font:800 12px/1 system-ui;text-decoration:none">Меню игр</a>
  <div id="toast"></div>
  <div id="prompt"></div>
  <div id="skills">
    <button type="button" id="btnEat" class="grn">Съесть фрукт</button>
    <button type="button" id="btnAtk">ЛКМ удар</button>
    <button type="button" id="btnQ" class="blu">Q навык</button>
    <button type="button" id="btnE" class="pur">E навык</button>
    <button type="button" id="btnIslands" class="grn">Острова</button>
  </div>
  <div id="sheet"><h3>Телепорт на остров</h3><div id="islandBtns"></div></div>
  <div id="tut">
    <div class="box">
      <div id="stepDots"></div>
      <h2 id="tutTitle">Привет!</h2>
      <p id="tutText"></p>
      <div class="row">
        <button type="button" class="skip" id="tutSkip">Пропустить</button>
        <button type="button" class="next" id="tutNext">Далее</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script src="../shared/amal-walk-player.js?v=3"></script>
  <script src="../shared/amal-draft-owner.js?v=2"></script>
  <script>
  (function () {
    if (!THREE.CapsuleGeometry) {
      THREE.CapsuleGeometry = function (r, len, c, seg) {
        return new THREE.CylinderGeometry(r, r, (len || 1) + r * 2, seg || 8);
      };
    }

    const FRUITS = [
      { id: "flame", name: "Пламя", color: 0xff5722, dmg: 22 },
      { id: "ice", name: "Лёд", color: 0x4fc3f7, dmg: 18 },
      { id: "quake", name: "Тряска", color: 0x8d6e63, dmg: 28 },
      { id: "abyss", name: "Сфера бездны", color: 0x7c3aed, dmg: 32, special: true }
    ];

    const ISLANDS = [
      { id: "start", name: "Стартовый", x: 0, z: 0, r: 22, color: 0xd7ccc8, accent: 0x81c784 },
      { id: "jungle", name: "Джунгли", x: 70, z: -20, r: 18, color: 0x33691e, accent: 0x1b5e20 },
      { id: "desert", name: "Пустыня", x: -65, z: 35, r: 17, color: 0xedc9a0, accent: 0xd4a017 },
      { id: "snow", name: "Снежный", x: 40, z: 75, r: 16, color: 0xe8eef5, accent: 0x90caf9 },
      { id: "abyss", name: "Тёмный", x: -50, z: -70, r: 19, color: 0x1a1030, accent: 0x7c3aed }
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x4fc3f7);
    scene.fog = new THREE.Fog(0x4fc3f7, 90, 220);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 14, pitch: 0.42, lookOffsetY: 1.35, minDist: 5, maxDist: 42,
      hintText: "Камера: ПКМ · колёсико · на телефоне палец"
    });
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xfff3d6, 1.05);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x81d4fa, 0x1b5e20, 0.35));

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(360, 360),
      new THREE.MeshLambertMaterial({ color: 0x0277bd })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = -0.6;
    scene.add(water);

    function mesh(geo, mat, x, y, z, parent) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      (parent || scene).add(m);
      return m;
    }
    function box(w, h, d, color, x, y, z, parent) {
      return mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }), x, y, z, parent);
    }

    function makeHumanoid(skin, shirt, pants) {
      const g = new THREE.Group();
      const hips = 0.55;
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshLambertMaterial({ color: shirt }));
      torso.position.y = hips + 0.42;
      torso.castShadow = true;
      g.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 10), new THREE.MeshLambertMaterial({ color: skin }));
      head.position.y = hips + 0.9;
      head.castShadow = true;
      g.add(head);
      [[-0.34, 1], [0.34, 1]].forEach(([x]) => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.32, 3, 6), new THREE.MeshLambertMaterial({ color: skin }));
        arm.position.set(x, hips + 0.45, 0);
        g.add(arm);
      });
      [[-0.14, -1], [0.14, 1]].forEach(([x]) => {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.36, 3, 6), new THREE.MeshLambertMaterial({ color: pants }));
        leg.position.set(x, hips - 0.12, 0);
        g.add(leg);
      });
      return g;
    }

    const pads = [];
    const fruitPickups = [];

    ISLANDS.forEach((isl, idx) => {
      const top = mesh(
        new THREE.CylinderGeometry(isl.r, isl.r + 2.5, 1.6, 28),
        new THREE.MeshLambertMaterial({ color: isl.color }),
        isl.x, 0.2, isl.z
      );
      top.receiveShadow = true;
      // shore ring
      mesh(
        new THREE.CylinderGeometry(isl.r + 1.2, isl.r + 3, 0.8, 24),
        new THREE.MeshLambertMaterial({ color: 0xc2b280 }),
        isl.x, -0.35, isl.z
      );

      if (isl.id === "jungle") {
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2;
          const tx = isl.x + Math.cos(a) * (isl.r * 0.55);
          const tz = isl.z + Math.sin(a) * (isl.r * 0.55);
          box(0.5, 3.2, 0.5, 0x5d4037, tx, 1.8, tz);
          mesh(new THREE.SphereGeometry(1.6, 8, 8), new THREE.MeshLambertMaterial({ color: 0x2e7d32 }), tx, 3.8, tz);
        }
      } else if (isl.id === "desert") {
        for (let i = 0; i < 5; i++) {
          const a = i * 1.3;
          box(0.35, 1.8, 0.35, 0x2e7d32, isl.x + Math.cos(a) * 8, 1, isl.z + Math.sin(a) * 8);
        }
        box(4, 1.2, 4, 0xd4a017, isl.x + 4, 0.8, isl.z - 3);
      } else if (isl.id === "snow") {
        for (let i = 0; i < 6; i++) {
          const a = i * 1.1;
          box(0.4, 2.4, 0.4, 0x6d4c41, isl.x + Math.cos(a) * 7, 1.4, isl.z + Math.sin(a) * 7);
          mesh(new THREE.ConeGeometry(1.3, 2.4, 8), new THREE.MeshLambertMaterial({ color: 0xe8f5e9 }), isl.x + Math.cos(a) * 7, 3.2, isl.z + Math.sin(a) * 7);
        }
      } else if (isl.id === "abyss") {
        const glow = new THREE.PointLight(0x7c3aed, 1.2, 40);
        glow.position.set(isl.x, 4, isl.z);
        scene.add(glow);
        box(3, 5, 3, 0x311b4d, isl.x, 2.6, isl.z);
        mesh(new THREE.OctahedronGeometry(1.4, 0), new THREE.MeshLambertMaterial({ color: 0xa78bfa, emissive: 0x5b21b6, emissiveIntensity: 0.4 }), isl.x, 6, isl.z);
      } else {
        box(6, 0.4, 6, 0xfbbf24, isl.x, 0.9, isl.z);
        box(1, 3.5, 1, 0xf59e0b, isl.x, 2.4, isl.z);
      }

      // teleport pad near shore toward origin-ish
      const ang = Math.atan2(-isl.z, -isl.x) || 0;
      const px = isl.x + Math.cos(ang) * (isl.r - 4);
      const pz = isl.z + Math.sin(ang) * (isl.r - 4);
      const pad = mesh(
        new THREE.CylinderGeometry(1.6, 1.6, 0.25, 16),
        new THREE.MeshLambertMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.35 }),
        px, 0.95, pz
      );
      pads.push({ mesh: pad, island: isl, x: px, z: pz });

      // small dock / boat hint
      box(2.2, 0.25, 5, 0x8d6e63, px + Math.cos(ang) * 4, 0.15, pz + Math.sin(ang) * 4);

      // fruit on island
      const fDef = isl.id === "abyss" ? FRUITS[3] : FRUITS[idx % 3];
      const orb = mesh(
        new THREE.SphereGeometry(0.55, 12, 12),
        new THREE.MeshLambertMaterial({ color: fDef.color, emissive: fDef.color, emissiveIntensity: 0.25 }),
        isl.x + 3, 1.4, isl.z + 2
      );
      fruitPickups.push({ mesh: orb, def: fDef, taken: false, home: isl });
    });

    const player = AmalWalkPlayer.create(scene, THREE, { humanoid: true, x: 0, z: 6, speed: 9, jump: 8 });
    AmalDraftOwner.attachPlayer(player);
    AmalDraftOwner.badge();

    let hp = 100, maxHp = 100, beli = 0, level = 1, xp = 0;
    let fruit = null;
    let heldFruit = null; // подобран, ещё не съеден
    let questKills = 0;
    let dead = false;
    let cdBasic = 0, cdQ = 0, cdE = 0;
    const projectiles = [];
    const aoes = [];
    const pirates = [];
    let toastT = 0;

    function toast(msg, t) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      toastT = t != null ? t : 2;
    }
    function refreshHud() {
      document.getElementById("lvl").textContent = level;
      document.getElementById("beli").textContent = beli;
      document.getElementById("fruit").textContent = fruit ? fruit.name : (heldFruit ? ("в руках: " + heldFruit.name + " — СЪЕШЬ") : "нет");
      const eatBtn = document.getElementById("btnEat");
      if (eatBtn) eatBtn.disabled = !(heldFruit && !fruit);
      document.getElementById("quest").textContent =
        questKills >= 3 ? "квест выполнен ✓ (+Beli)" : "убей 3 пирата (" + questKills + "/3)";
      document.getElementById("hpFill").style.width = Math.max(0, (hp / maxHp) * 100) + "%";
      const cur = nearestIsland(player.mesh.position.x, player.mesh.position.z);
      document.getElementById("isle").textContent = cur ? cur.name : "море";
    }
    function nearestIsland(x, z) {
      let best = null, bd = 1e9;
      ISLANDS.forEach((isl) => {
        const d = Math.hypot(x - isl.x, z - isl.z);
        if (d < isl.r + 2 && d < bd) { best = isl; bd = d; }
      });
      return best;
    }
    function addXp(n) {
      xp += n;
      while (xp >= level * 40) {
        xp -= level * 40;
        level++;
        maxHp += 10;
        hp = maxHp;
        toast("Уровень " + level + "!", 2);
      }
      refreshHud();
    }

    function spawnPirate(isl) {
      const a = Math.random() * Math.PI * 2;
      const rr = isl.r * (0.35 + Math.random() * 0.4);
      const g = makeHumanoid(0xe0ac69, 0xb91c1c, 0x1e293b);
      g.position.set(isl.x + Math.cos(a) * rr, 0, isl.z + Math.sin(a) * rr);
      scene.add(g);
      // bandana
      box(0.42, 0.08, 0.42, 0x111827, 0, 1.48, 0, g);
      pirates.push({
        mesh: g, hp: 55 + level * 5, maxHp: 55 + level * 5,
        island: isl, aggro: false, hurtT: 0, attackCd: 0, alive: true
      });
    }
    ISLANDS.forEach((isl) => {
      spawnPirate(isl);
      if (isl.id !== "start") spawnPirate(isl);
    });

    function tryPickupFruit() {
      let near = null;
      fruitPickups.forEach((f) => {
        if (f.taken) return;
        const d = Math.hypot(player.mesh.position.x - f.mesh.position.x, player.mesh.position.z - f.mesh.position.z);
        if (d < 2.2) near = f;
      });
      if (!near) return false;
      if (fruit) { toast("Сначала используй текущий фрукт / уже съеден", 1.5); return true; }
      near.taken = true;
      scene.remove(near.mesh);
      heldFruit = near.def;
      toast("Подобрал: " + heldFruit.name + " · нажми «Съесть фрукт»", 2.5);
      refreshHud();
      setTimeout(() => {
        near.taken = false;
        near.mesh.position.set(near.home.x + 3, 1.4, near.home.z + 2);
        scene.add(near.mesh);
      }, 20000);
      return true;
    }
    function eatFruit() {
      if (!heldFruit) { toast("Сначала подбери фрукт (E у сферы)", 1.8); return; }
      if (fruit) { toast("Фрукт уже съеден: " + fruit.name, 1.6); return; }
      fruit = heldFruit;
      heldFruit = null;
      toast("Съеден фрукт: " + fruit.name + "! Теперь ЛКМ / Q / E", 2.4);
      refreshHud();
    }
    function facingDir() {
      const yaw = orbit.state.yaw;
      return { x: -Math.sin(yaw), z: -Math.cos(yaw) };
    }

    function hurtPlayer(dmg, from) {
      if (AmalDraftOwner.isOwner() || !AmalDraftOwner.canDie()) {
        // bounce attacker slightly, never HP / stun
        if (from && from.mesh) {
          const dx = from.mesh.position.x - player.mesh.position.x;
          const dz = from.mesh.position.z - player.mesh.position.z;
          const L = Math.hypot(dx, dz) || 1;
          from.mesh.position.x += (dx / L) * 2.5;
          from.mesh.position.z += (dz / L) * 2.5;
        }
        return;
      }
      if (dead) return;
      hp = Math.max(0, hp - dmg);
      refreshHud();
      if (hp <= 0) {
        dead = true;
        toast("Ты погиб · возрождение на Стартовом", 2.5);
        setTimeout(() => {
          player.mesh.position.set(0, 0, 6);
          hp = maxHp;
          dead = false;
          refreshHud();
        }, 1800);
      }
    }

    function damagePirate(p, dmg) {
      if (!p.alive) return;
      p.hp -= dmg;
      p.hurtT = 0.25;
      p.aggro = true;
      if (p.hp <= 0) {
        p.alive = false;
        scene.remove(p.mesh);
        beli += 25 + level * 5;
        questKills = Math.min(3, questKills + 1);
        if (questKills === 3) {
          beli += 100;
          toast("Квест: 3 пирата! +100 Beli", 2.5);
        } else toast("+пират · +" + (25 + level * 5) + " Beli", 1.4);
        addXp(18);
        refreshHud();
        setTimeout(() => {
          const isl = p.island;
          const idx = pirates.indexOf(p);
          if (idx >= 0) pirates.splice(idx, 1);
          spawnPirate(isl);
        }, 5000);
      }
    }

    function fireBasic() {
      if (cdBasic > 0 || dead) return;
      cdBasic = 0.35;
      const dir = facingDir();
      const col = fruit ? fruit.color : 0xfbbf24;
      const dmg = fruit ? fruit.dmg * 0.55 : 12;
      const ball = mesh(
        new THREE.SphereGeometry(0.28, 8, 8),
        new THREE.MeshLambertMaterial({ color: col, emissive: col, emissiveIntensity: 0.4 }),
        player.mesh.position.x + dir.x * 1.2,
        player.mesh.position.y + 1.1,
        player.mesh.position.z + dir.z * 1.2
      );
      projectiles.push({ mesh: ball, vx: dir.x * 28, vz: dir.z * 28, life: 1.2, dmg: dmg, aoe: false });
    }

    function fireSkillQ() {
      if (cdQ > 0 || dead) return;
      if (!fruit) { toast("Собери фрукт на острове!", 1.6); return; }
      cdQ = 1.4;
      const dir = facingDir();
      if (fruit.id === "abyss") {
        // dark projectile that explodes
        const ball = mesh(
          new THREE.SphereGeometry(0.45, 10, 10),
          new THREE.MeshLambertMaterial({ color: 0x7c3aed, emissive: 0x5b21b6, emissiveIntensity: 0.6 }),
          player.mesh.position.x + dir.x * 1.4,
          player.mesh.position.y + 1.2,
          player.mesh.position.z + dir.z * 1.4
        );
        projectiles.push({ mesh: ball, vx: dir.x * 22, vz: dir.z * 22, life: 1.6, dmg: fruit.dmg, aoe: true, radius: 5 });
        toast("Бездна: теневой шар!", 1.1);
      } else if (fruit.id === "quake") {
        spawnAoe(player.mesh.position.x, player.mesh.position.z, 5.5, fruit.dmg, fruit.color, 0.45);
        toast("Тряска!", 1);
      } else {
        const ball = mesh(
          new THREE.SphereGeometry(0.38, 8, 8),
          new THREE.MeshLambertMaterial({ color: fruit.color, emissive: fruit.color, emissiveIntensity: 0.45 }),
          player.mesh.position.x + dir.x * 1.3,
          player.mesh.position.y + 1.15,
          player.mesh.position.z + dir.z * 1.3
        );
        projectiles.push({ mesh: ball, vx: dir.x * 26, vz: dir.z * 26, life: 1.4, dmg: fruit.dmg, aoe: fruit.id === "ice", radius: 3.5 });
      }
    }

    function fireSkillE() {
      if (cdE > 0 || dead) return;
      // pad takes priority when near
      const pad = nearPad();
      if (pad) { openIslands(); return; }
      if (!fruit) { toast("Нужен фрукт для E-навыка", 1.4); return; }
      cdE = 2.2;
      if (fruit.id === "abyss") {
        spawnAoe(player.mesh.position.x, player.mesh.position.z, 7, fruit.dmg * 1.15, 0x6d28d9, 0.55);
        toast("Бездна: вспышка пустоты!", 1.2);
      } else if (fruit.id === "flame") {
        const dir = facingDir();
        for (let i = 0; i < 3; i++) {
          const ang = Math.atan2(dir.x, dir.z) + (i - 1) * 0.28;
          const ball = mesh(
            new THREE.SphereGeometry(0.3, 8, 8),
            new THREE.MeshLambertMaterial({ color: 0xff5722, emissive: 0xff5722, emissiveIntensity: 0.5 }),
            player.mesh.position.x + Math.sin(ang) * 1.2,
            player.mesh.position.y + 1.1,
            player.mesh.position.z + Math.cos(ang) * 1.2
          );
          projectiles.push({ mesh: ball, vx: Math.sin(ang) * 24, vz: Math.cos(ang) * 24, life: 1.1, dmg: fruit.dmg * 0.7, aoe: false });
        }
      } else {
        spawnAoe(player.mesh.position.x + facingDir().x * 3, player.mesh.position.z + facingDir().z * 3, 4.2, fruit.dmg * 0.9, fruit.color, 0.4);
      }
    }

    function spawnAoe(x, z, r, dmg, color, life) {
      const ring = mesh(
        new THREE.CylinderGeometry(r, r, 0.2, 24),
        new THREE.MeshLambertMaterial({ color: color, transparent: true, opacity: 0.55, emissive: color, emissiveIntensity: 0.3 }),
        x, 0.5, z
      );
      aoes.push({ mesh: ring, life: life != null ? life : 0.4, dmg: dmg, x: x, z: z, r: r, hit: false });
      pirates.forEach((p) => {
        if (!p.alive) return;
        if (Math.hypot(p.mesh.position.x - x, p.mesh.position.z - z) <= r + 0.6) damagePirate(p, dmg);
      });
    }

    function nearPad() {
      const p = player.mesh.position;
      for (let i = 0; i < pads.length; i++) {
        if (Math.hypot(p.x - pads[i].x, p.z - pads[i].z) < 2.8) return pads[i];
      }
      return null;
    }

    function teleportTo(isl) {
      player.mesh.position.set(isl.x, 0, isl.z + 4);
      document.getElementById("sheet").classList.remove("open");
      toast("Остров: " + isl.name, 1.5);
      refreshHud();
    }

    function openIslands() {
      const sheet = document.getElementById("sheet");
      const box = document.getElementById("islandBtns");
      box.innerHTML = "";
      ISLANDS.forEach((isl) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = isl.name;
        b.onclick = () => teleportTo(isl);
        box.appendChild(b);
      });
      sheet.classList.toggle("open");
    }

    document.getElementById("btnEat").onclick = () => eatFruit();
    document.getElementById("btnAtk").onclick = () => fireBasic();
    document.getElementById("btnQ").onclick = () => fireSkillQ();
    document.getElementById("btnE").onclick = () => fireSkillE();
    document.getElementById("btnIslands").onclick = () => openIslands();

    addEventListener("keydown", (e) => {
      if (e.code === "KeyQ" && !e.repeat) { if (!fruit) toast("Сначала съешь фрукт", 1.5); else fireSkillQ(); }
      if (e.code === "KeyE" && !e.repeat) {
        if (typeof tryPickupFruit === "function" && tryPickupFruit()) return;
        const pad = nearPad();
        if (pad) openIslands();
        else if (fruit) fireSkillE();
        else toast("Подбери и съешь фрукт, чтобы использовать E", 1.8);
      }
    });
    addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest("#skills,#sheet,#tut,button,a")) return;
      fireBasic();
    });

    // Tutorial
    const TUT = [
      { t: "Как играть", p: "1) Подойди к светящейся сфере 2) E — подобрать 3) Кнопка Съесть фрукт 4) Потом ЛКМ / Q / E. Меню игр — справа сверху." },
      { t: "Фрукты и навыки", p: "Собери светящуюся сферу. ЛКМ — базовый удар, Q — навык 1, E — навык 2. «Сфера бездны» на Тёмном острове бьёт снарядом и AoE." },
      { t: "Путешествия", p: "Встань на голубой пад и нажми E — или кнопку «Острова». Квест: убей 3 пирата за Beli. Пираты — люди, их мало." },
      { t: "Готово!", p: "Хозяин бессмертен и летает (Пробел↑ / Shift↓). Обычный игрок теряет HP от пиратов. Удачи в море!" }
    ];
    let tutI = 0;
    const dots = document.getElementById("stepDots");
    function showTut() {
      TUT.forEach((_, i) => {
        let s = dots.children[i];
        if (!s) { s = document.createElement("span"); dots.appendChild(s); }
        s.className = i === tutI ? "on" : "";
      });
      document.getElementById("tutTitle").textContent = TUT[tutI].t;
      document.getElementById("tutText").textContent = TUT[tutI].p;
      document.getElementById("tutNext").textContent = tutI >= TUT.length - 1 ? "Играть" : "Далее";
    }
    function closeTut() { document.getElementById("tut").style.display = "none"; }
    document.getElementById("tutNext").onclick = () => {
      if (tutI >= TUT.length - 1) closeTut();
      else { tutI++; showTut(); }
    };
    document.getElementById("tutSkip").onclick = closeTut;
    showTut();

    refreshHud();
    let last = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (toastT > 0) {
        toastT -= dt;
        if (toastT <= 0) document.getElementById("toast").classList.remove("show");
      }
      cdBasic = Math.max(0, cdBasic - dt);
      cdQ = Math.max(0, cdQ - dt);
      cdE = Math.max(0, cdE - dt);

      if (!dead) player.update(dt, orbit.state.yaw, { minX: -160, maxX: 160, minZ: -160, maxZ: 160 });
      // drown soft: pull to nearest island if in deep water without fly
      const pos = player.mesh.position;
      if (!player.state.fly && !nearestIsland(pos.x, pos.z) && pos.y <= 0.05) {
        let best = ISLANDS[0], bd = 1e9;
        ISLANDS.forEach((isl) => {
          const d = Math.hypot(pos.x - isl.x, pos.z - isl.z);
          if (d < bd) { best = isl; bd = d; }
        });
        const dx = best.x - pos.x, dz = best.z - pos.z;
        const L = Math.hypot(dx, dz) || 1;
        pos.x += (dx / L) * 6 * dt;
        pos.z += (dz / L) * 6 * dt;
      }

      orbit.follow(pos);

      // fruits
      fruitPickups.forEach((f) => {
        if (f.taken) return;
        f.mesh.position.y = 1.4 + Math.sin(now * 0.004) * 0.2;
        f.mesh.rotation.y += dt * 1.5;
        f.mesh.userData.near = Math.hypot(pos.x - f.mesh.position.x, pos.z - f.mesh.position.z) < 2.2;
      });

      // projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const pr = projectiles[i];
        pr.life -= dt;
        pr.mesh.position.x += pr.vx * dt;
        pr.mesh.position.z += pr.vz * dt;
        let hit = false;
        pirates.forEach((p) => {
          if (!p.alive || hit) return;
          if (Math.hypot(p.mesh.position.x - pr.mesh.position.x, p.mesh.position.z - pr.mesh.position.z) < 1.2) {
            damagePirate(p, pr.dmg);
            if (pr.aoe) spawnAoe(pr.mesh.position.x, pr.mesh.position.z, pr.radius || 4, pr.dmg * 0.7, fruit ? fruit.color : 0xfbbf24, 0.35);
            hit = true;
          }
        });
        if (hit || pr.life <= 0) {
          if (!hit && pr.aoe) spawnAoe(pr.mesh.position.x, pr.mesh.position.z, pr.radius || 4, pr.dmg * 0.65, fruit ? fruit.color : 0x7c3aed, 0.35);
          scene.remove(pr.mesh);
          projectiles.splice(i, 1);
        }
      }
      for (let i = aoes.length - 1; i >= 0; i--) {
        aoes[i].life -= dt;
        aoes[i].mesh.material.opacity = Math.max(0, aoes[i].life * 1.2);
        if (aoes[i].life <= 0) {
          scene.remove(aoes[i].mesh);
          aoes.splice(i, 1);
        }
      }

      // pirates AI — max 1–2 aggressive near player
      let aggroCount = 0;
      pirates.forEach((p) => {
        if (!p.alive) return;
        const dx = pos.x - p.mesh.position.x;
        const dz = pos.z - p.mesh.position.z;
        const dist = Math.hypot(dx, dz);
        p.hurtT = Math.max(0, p.hurtT - dt);
        p.attackCd = Math.max(0, p.attackCd - dt);

        const near = dist < 18;
        if (near && aggroCount < 2) {
          p.aggro = true;
          aggroCount++;
        } else if (dist > 28) {
          p.aggro = false;
        }

        if (AmalDraftOwner.isOwner()) {
          // ignore damaging owner — wander / bounce if too close
          if (dist < 1.6) {
            const L = dist || 1;
            p.mesh.position.x -= (dx / L) * 4 * dt;
            p.mesh.position.z -= (dz / L) * 4 * dt;
          } else if (p.aggro && dist < 14) {
            // casually face but don't chase hard
            p.mesh.rotation.y = Math.atan2(dx, dz);
          }
          return;
        }

        if (p.aggro && dist > 1.4) {
          const L = dist || 1;
          p.mesh.position.x += (dx / L) * 3.2 * dt;
          p.mesh.position.z += (dz / L) * 3.2 * dt;
          p.mesh.rotation.y = Math.atan2(dx, dz);
        }
        if (p.aggro && dist < 1.7 && p.attackCd <= 0) {
          p.attackCd = 1.1;
          hurtPlayer(12, p);
        }

        // keep on island
        const isl = p.island;
        const od = Math.hypot(p.mesh.position.x - isl.x, p.mesh.position.z - isl.z);
        if (od > isl.r - 1.5) {
          p.mesh.position.x = isl.x + ((p.mesh.position.x - isl.x) / od) * (isl.r - 1.5);
          p.mesh.position.z = isl.z + ((p.mesh.position.z - isl.z) / od) * (isl.r - 1.5);
        }
      });

      const pad = nearPad();
      const prompt = document.getElementById("prompt");
      if (pad) {
        prompt.style.display = "block";
        if (!fruit && !heldFruit) { let nf=null; fruitPickups.forEach(f=>{ if(!f.taken && Math.hypot(pos.x-f.mesh.position.x,pos.z-f.mesh.position.z)<2.2) nf=f; }); if(nf){ prompt.style.display="block"; prompt.textContent="E — подобрать фрукт: "+nf.def.name; } else if (heldFruit){ prompt.style.display="block"; prompt.textContent="Нажми «Съесть фрукт» внизу"; } else prompt.textContent = "E — острова (сейчас: " + pad.island.name + ")";
      } else prompt.style.display = "none";

      if (Math.floor(now / 500) % 2 === 0) refreshHud();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  })();
  </script>
