<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Steal a Brainrot · 3D | Игры Амаля</title>
  <meta name="theme-color" content="#7c3aed" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #12081c; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
    canvas { display: block; touch-action: none; }
    #yenBig {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40;
      font: 900 clamp(20px, 4.5vw, 30px)/1 system-ui; letter-spacing: .02em;
      padding: 10px 22px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(120,53,15,.95), rgba(30,10,40,.96));
      border: 2px solid #fbbf24; box-shadow: 0 8px 28px rgba(251,191,36,.35); color: #fde68a;
    }
    #yenBig span { color: #fff; }
    #hud, #tutorial, #slots, #shop {
      position: fixed; z-index: 35; border-radius: 14px; padding: 12px 14px;
      background: rgba(20, 10, 36, .88); border: 1px solid rgba(192,132,252,.4);
      backdrop-filter: blur(10px); font-size: 13px; line-height: 1.45; font-weight: 700;
    }
    #hud { top: 64px; left: 12px; max-width: min(300px, 78vw); }
    #hud b { font-size: 15px; color: #e9d5ff; }
    #tutorial { top: 64px; right: 12px; width: min(240px, 40vw); }
    #tutorial h2 { font-size: 13px; color: #e9d5ff; margin-bottom: 6px; }
    #tutorial .step { margin: 4px 0; padding: 6px 8px; border-radius: 8px; background: rgba(168,85,247,.18); }
    #tutorial .step.done { opacity: .5; text-decoration: line-through; }
    #shop {
      bottom: 12px; left: 12px; width: min(340px, 94vw); max-height: 38vh; overflow: auto;
      border-color: rgba(251,191,36,.4);
    }
    #shop h3 { font-size: 13px; color: #fde68a; margin-bottom: 8px; }
    #shop .item {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      margin: 0 0 6px; padding: 9px 10px; border-radius: 10px; border: 0;
      background: rgba(255,255,255,.07); color: #fff; font: 700 12px system-ui; cursor: pointer; text-align: left;
    }
    #shop .item:hover { background: rgba(168,85,247,.3); }
    #shop .price { color: #fbbf24; white-space: nowrap; }
    #slots { bottom: 12px; right: 12px; width: min(190px, 38vw); border-color: #4ade80; background: rgba(10,30,18,.9); }
    #slots h3 { font-size: 12px; color: #86efac; margin-bottom: 6px; }
    .slot { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 11px; }
    .slot:last-child { border-bottom: 0; }
    #prompt {
      position: fixed; bottom: 46%; left: 50%; transform: translateX(-50%); z-index: 40;
      font: 900 15px system-ui; background: rgba(0,0,0,.78); padding: 10px 16px;
      border-radius: 12px; display: none; border: 1px solid #c084fc; white-space: nowrap;
    }
    #toast {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); z-index: 50;
      padding: 12px 20px; border-radius: 14px; background: rgba(30,10,40,.95);
      border: 2px solid #c084fc; font-weight: 900; font-size: 17px; display: none;
      text-align: center; pointer-events: none; max-width: 90vw;
    }
    #alarm {
      position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none;
      background: rgba(220,38,38,.16); box-shadow: inset 0 0 90px rgba(220,38,38,.4);
    }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 45; padding: 8px 12px;
      border-radius: 12px; background: rgba(0,0,0,.55); color: #fff; text-decoration: none;
      font: 800 12px system-ui;
    }
    #pad {
      position: fixed; bottom: 18px; left: 14px; z-index: 45; display: none;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.22); touch-action: none;
    }
    #pad-knob {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
      border-radius: 50%; background: rgba(192,132,252,.55); pointer-events: none;
    }
    #act-btns {
      position: fixed; bottom: 22px; right: 18px; z-index: 45; display: none; flex-direction: column; gap: 10px;
    }
    #act-btns button {
      width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: rgba(168,85,247,.55); color: #fff; font: 900 13px system-ui;
    }
    @media (pointer: coarse) {
      #pad, #act-btns { display: flex; }
      #tutorial { display: none; }
      #shop { max-height: 28vh; }
    }
  </style>
</head>
<body>
  <div id="yenBig">¥ <span id="yen">200</span></div>
  <a id="back" href="../friends.html?v=8&stay=1&code=amal-star-friends">← Эксклюзив</a>
  <div id="hud">
    <b>🧠 Steal a Brainrot</b><br />
    Доход: <span id="income">0</span> ¥/сек<br />
    В руках: <span id="carry">пусто</span><br />
    <span id="status" style="color:#e9d5ff">Купи брейнрота ↓ или укради чужой</span>
  </div>
  <div id="tutorial">
    <h2>Как играть</h2>
    <div class="step" id="t1">1) Купи брейнрота</div>
    <div class="step" id="t2">2) Поставь на зелёную базу (E)</div>
    <div class="step" id="t3">3) Воруй чужие и беги домой</div>
  </div>
  <div id="slots"><h3>Твоя база</h3><div id="slotList"></div></div>
  <div id="shop"><h3>Магазин</h3><div id="shopList"></div></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="alarm"></div>
  <div id="pad"><div id="pad-knob"></div></div>
  <div id="act-btns">
    <button type="button" id="btn-e">E</button>
    <button type="button" id="btn-jump">прыг</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js?v=4"></script>
</body>
</html>
