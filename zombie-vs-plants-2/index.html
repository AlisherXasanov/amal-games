<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Зомби против растений 2</title>
  <meta name="description" content="PVZ-2: альманах всех растений, огонь, лёд, электричество, тень и другие типы." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Rubik+Dirt&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body>
  <a class="portal-back" href="../">&larr; Все игры</a>

  <div id="app">
    <section class="screen menu" id="screenMenu">
      <div class="menu-panel">
        <p class="brand">Зомби против растений</p>
        <h1>Часть 2</h1>
        <p class="tagline">Миры · магазин · персонаж</p>
        <p class="desc">
          Альманах по Plants vs. Zombies 2: все растения и типы —
          огонь, лёд, электричество, тень и другие.
        </p>
        <p class="stat" id="plantCount">Растений: —</p>
        <button type="button" class="btn btn-primary" id="btnAlmanac">Альманах растений</button>
        <a class="btn btn-ghost" href="../zombie-vs-plants/">Играть в часть 1</a>
      </div>
    </section>

    <section class="screen almanac" id="screenAlmanac" hidden>
      <div class="almanac-wrap">
        <header class="almanac-head">
          <button type="button" class="btn-back" id="btnBackMenu">&larr; Меню</button>
          <div>
            <h2>Альманах</h2>
            <p class="sub" id="almanacSub">Все растения PvZ 2</p>
          </div>
        </header>
        <div class="type-filters" id="typeFilters"></div>
        <label class="search-wrap">
          <span>Поиск</span>
          <input type="search" id="plantSearch" placeholder="Горохострел, Fire, лёд…" autocomplete="off" />
        </label>
        <div class="plant-grid" id="plantGrid"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="./plants-data.js?v=2"></script>
  <script src="./game.js?v=2"></script>
</body>
</html>
