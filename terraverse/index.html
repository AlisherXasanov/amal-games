<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пиксель-Террариум — 2D песочница</title>
    <meta name="description" content="Копай блоки, строй дома и исследуй пещеры в 2D песочнице в стиле Terraria." />
    <style>
      html, body { margin: 0; min-height: 100%; background: #09090b; color: #a1a1aa; }
      .portal-back {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 9999;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, .65);
        color: #fff;
        font: 600 13px/1 system-ui, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(4px);
      }
      .portal-back:hover { background: rgba(0, 0, 0, .85); }
      #root { min-height: 100dvh; }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/static-index-DPwEJUCe.css">
  </head>
  <body>
    <a class="portal-back" href="../">&larr; Все игры</a>
    <div id="root"></div>
    <script type="module" crossorigin src="./assets/static-index-TreeFix2.js?v=fix2"></script>
    <script>
      // Amal-оверлеи после старта мира — иначе React-корень иногда сбрасывается
      function loadAmal() {
        if (window.__AMAL_TV_LOADED__) return;
        window.__AMAL_TV_LOADED__ = true;
        var files = [
          "../shared/amal-owner-powers.js?v=10",
          "./amal-bridge.js?v=2",
          "../shared/amal-hub.js?v=18",
        ];
        files.forEach(function (src) {
          var s = document.createElement("script");
          s.src = src;
          document.body.appendChild(s);
        });
      }
      function whenReady(fn) {
        var n = 0;
        var t = setInterval(function () {
          n += 1;
          if (document.querySelector("#root canvas") || n > 40) {
            clearInterval(t);
            fn();
          }
        }, 250);
      }
      whenReady(loadAmal);
      setTimeout(loadAmal, 8000);
    </script>
  </body>
</html>
