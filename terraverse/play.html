<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Пиксель-Террариум — 2D песочница</title>
    <meta name="description" content="Копай блоки, строй дома и исследуй пещеры в 2D песочнице в стиле Terraria." />
    <style>
      html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a2e; color: #a1a1aa; }
      .portal-back {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 20;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, .65);
        color: #fff;
        font: 600 13px/1 system-ui, sans-serif;
        text-decoration: none;
        backdrop-filter: blur(4px);
      }
      .portal-back:hover { background: rgba(0, 0, 0, .85); }
      #root, #root > div { height: 100dvh; width: 100%; }
      #root canvas {
        display: block !important;
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        z-index: 1;
        touch-action: none;
        background: #1a1a2e;
      }
      #amal-world-root, #amal-world-showpill, #amal-world-dock, #amal-world-canvas,
      #amal-powers-quick, #amal-powers-fab, #amal-powers-panel,
      #amal-us-eggs, #amal-us-toast, #amal-cube-btn, #amal-cube-dash,
      #amal-cube-pickup, #amal-chat-fab, #amal-chat-box, #amal-faq-fab,
      #amal-good-boss, #amal-hub-root, #amal-watch-panel {
        display: none !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/static-index-DPwEJUCe.css">
    <script type="module" crossorigin src="./assets/static-index-TreeFix16.js?v=16"></script>
  </head>
  <body>
    <a class="portal-back" href="../">&larr; Все игры</a>
    <div id="root"></div>
    <script>
      (function () {
        var ids = [
          "amal-world-root", "amal-world-showpill", "amal-world-dock",
          "amal-powers-quick", "amal-powers-fab", "amal-powers-panel",
          "amal-hub-root", "amal-chat-box", "amal-chat-fab", "amal-watch-panel"
        ];
        function wipe() {
          for (var i = 0; i < ids.length; i++) {
            var n = document.getElementById(ids[i]);
            if (n && n.parentNode) n.parentNode.removeChild(n);
          }
        }
        wipe();
        setInterval(wipe, 500);
        document.addEventListener("contextmenu", function (e) {
          if (e.target && e.target.tagName === "CANVAS") e.preventDefault();
        });
      })();
    </script>
    <script src="./amal-bridge.js?v=7"></script>
  </body>
</html>
