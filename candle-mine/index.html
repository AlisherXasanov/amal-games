<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Свеча в шахте — Amal Lab</title>
  <meta name="description" content="Спустись в тёмную шахту со свечой: воск тает, сквозняк гасит пламя — найди выход наверх." />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0a0806; font-family: "Segoe UI", system-ui, sans-serif; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 5; color: #f5e6c8;
      text-shadow: 0 2px 8px #000; max-width: min(340px, 72vw);
      padding: 10px 12px; border-radius: 14px; background: rgba(12,8,4,.62);
      border: 1px solid rgba(255,200,100,.18);
    }
    #hud h1 { font-size: 15px; margin-bottom: 4px; letter-spacing: .02em; }
    #hud p { font-size: 12px; line-height: 1.4; opacity: .92; font-weight: 600; }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 5;
      padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.55);
      color: #fff; text-decoration: none; font: 700 13px system-ui;
    }
    #bars {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      display: flex; gap: 10px; align-items: center;
    }
    .bar {
      width: 110px; height: 12px; border-radius: 999px; background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.15); overflow: hidden;
    }
    .bar > i { display: block; height: 100%; width: 100%; transform-origin: left center; }
    #waxFill { background: linear-gradient(90deg, #c47a2a, #f0c45a); }
    #flameFill { background: linear-gradient(90deg, #e25a3c, #fde68a); }
    #bars span { color: #fde68a; font: 700 11px system-ui; text-shadow: 0 1px 4px #000; }
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 6; color: #f5e6c8; font: 700 14px system-ui; text-shadow: 0 2px 8px #000;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #win {
      position: fixed; inset: 0; display: none; place-items: center; z-index: 20;
      background: rgba(0,0,0,.78); color: #fff; text-align: center; padding: 24px;
    }
    #win.show { display: grid; }
    #win h2 { font-size: 26px; color: #fde68a; margin-bottom: 8px; }
    #win button {
      margin: 8px 6px 0; padding: 10px 18px; border: 0; border-radius: 10px;
      background: #f0b429; color: #1a1400; font: 800 14px system-ui; cursor: pointer;
    }
    #amal-world-root,#amal-world-canvas,#amal-world-dock{display:none!important}
  </style>
</head>
<body>
  <div id="hud">
    <h1>🕯️ Свеча в шахте</h1>
    <p>WASD / стрелки — ходить. Воск тает. Сквозняк гасит пламя. Собери капли воска, дойди до лестницы.</p>
  </div>
  <div id="bars">
    <span>Воск</span><div class="bar"><i id="waxFill"></i></div>
    <span>Пламя</span><div class="bar"><i id="flameFill"></i></div>
  </div>
  <a id="back" href="../">← Каталог</a>
  <div id="toast"></div>
  <div id="win">
    <div>
      <h2 id="winTitle">Свет наверху</h2>
      <p id="winText">Ты выбрался из шахты.</p>
      <button type="button" id="next">Дальше</button>
      <button type="button" id="again">Сначала</button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script src="./main.js?v=2"></script>
  <script src="../shared/amal-owner-powers.js?v=23"></script>
  <script src="../shared/amal-throne.js?v=6"></script>
  <script src="../shared/amal-hub.js?v=68"></script>
</body>
</html>
