<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Милашки — пушистые питомцы | Amaya Games</title>
  <meta name="theme-color" content="#fce7f3" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=6" />
</head>
<body>
  <div class="shell">
    <header class="top compact">
      <a class="back" href="../">←</a>
      <div>
        <h1>🐣 Милашки</h1>
        <p class="sub">Свайп — другая комната</p>
      </div>
    </header>

    <div class="world-pick" id="world-pick"></div>

    <div class="stats">
      <div class="stat">🪙<b id="coins">0</b></div>
      <div class="stat">🐾<b id="pet-n">0</b></div>
      <div class="stat">❤️<b id="happy">100</b></div>
    </div>

    <div class="pet-bar">
      <span id="pet-label">🐰 Пушок</span>
      <span id="zone-label">🛋️ Гостиная</span>
    </div>

    <section class="panel on" id="panel-home">
      <div class="map-wrap big">
        <canvas id="map"></canvas>
      </div>
      <div class="zone-nav" id="zone-nav"></div>
      <nav class="tabs inline">
        <button type="button" class="tab on" data-tab="home">🏠</button>
        <button type="button" class="tab" data-tab="eggs">🥚</button>
        <button type="button" class="tab" data-tab="merge">✨</button>
        <button type="button" class="tab" data-tab="book">📖</button>
      </nav>
      <div class="actions compact">
        <button type="button" class="btn btn-green" id="act-walk" title="Погулять">🚶</button>
        <button type="button" class="btn btn-pink" id="act-feed" title="Кормить">🍎</button>
        <button type="button" class="btn btn-sky" id="act-wash" title="Мыть">🛁</button>
        <button type="button" class="btn btn-purple" id="act-play" title="Играть">🎾</button>
        <button type="button" class="btn btn-pink" id="act-pet" title="Гладить">💕</button>
      </div>
    </section>

    <section class="panel" id="panel-eggs">
      <p class="egg-hint">🥚 <b>Бесплатное яйцо</b> = второй питомец! Нажми «Обычное».</p>
      <div class="egg-grid" id="egg-grid"></div>
      <nav class="tabs inline"><button type="button" class="tab" data-tab="home">🏠 Дом</button></nav>
    </section>

    <section class="panel" id="panel-merge">
      <div class="merge-box">
        <p style="font-size:13px;font-weight:800">Магическая машина слияния</p>
        <p style="font-size:11px;color:var(--muted);margin:6px 0">2 одинаковых питомца → новый вид (не исчезнут!)</p>
        <div class="merge-slots">
          <div class="slot" id="slot-a">+</div>
          <div class="slot" id="slot-b">+</div>
        </div>
        <button type="button" class="btn btn-purple" id="btn-merge" style="width:100%">✨ Слить!</button>
      </div>
      <nav class="tabs inline"><button type="button" class="tab" data-tab="home">🏠 Дом</button></nav>
    </section>

    <section class="panel" id="panel-book">
      <div class="collection" id="collection"></div>
      <nav class="tabs inline"><button type="button" class="tab" data-tab="home">🏠 Дом</button></nav>
    </section>
  </div>

  <div class="hatch-pop" id="hatch-pop">
    <div class="hatch-card">
      <div class="pet" id="hatch-emoji">🐣</div>
      <h3 id="hatch-name">Новый милашка!</h3>
      <p id="hatch-rare"></p>
      <button type="button" class="btn btn-pink" id="hatch-ok" style="width:100%">Ура!</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="./pets-draw.js?v=6"></script>
  <script src="./app.js?v=7"></script>
</body>
</html>
