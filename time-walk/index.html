<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Время с шагом · 2.5D | Игры Амаля</title>
  <meta name="theme-color" content="#0f172a" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#020617;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1e293b,#020617 70%)}
    canvas{display:block;width:min(1100px,100%);height:auto;max-height:100%;image-rendering:pixelated;touch-action:none;background:#0b1220}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:10px 12px;border-radius:14px;background:rgba(8,15,30,.92);border:2px solid #38bdf8;font:800 13px/1.4 system-ui;max-width:min(320px,88vw);pointer-events:none}
    #hud .big{font-size:20px;color:#fde68a}
    #timeArrow{font-size:18px;color:#67e8f9}
    #toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(10,20,40,.96);border:2px solid #67e8f9;font:900 15px system-ui;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#334155;color:#fff;text-decoration:none;font:800 12px system-ui}
    #btn-restart{position:fixed;top:10px;right:10px;z-index:20;padding:8px 12px;border-radius:12px;border:2px solid #fda4af;background:rgba(127,29,29,.9);color:#fff;font:800 12px system-ui;cursor:pointer}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(56,189,248,.55);pointer-events:none}
    #btn-jump{position:fixed;bottom:28px;right:22px;z-index:25;display:none;width:74px;height:74px;border-radius:50%;border:0;background:rgba(14,165,233,.75);color:#fff;font:900 13px system-ui}
    @media(pointer:coarse){#pad,#btn-jump{display:block}.back{bottom:140px}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud">
    <b>⏳ Время с шагом</b> · ур. <span id="lvl">1</span><br />
    <span id="timeArrow">⏸ время стоит</span><br />
    <span style="opacity:.8;font-size:12px">→ вперёд = время вперёд · ← назад = время назад · ↑ прыжок</span>
  </div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <button type="button" id="btn-restart">↻ Заново</button>
  <div id="pad"><div id="pad-knob"></div></div>
  <button type="button" id="btn-jump">↑</button>
  <script src="./game.js?v=2"></script>
</body>
</html>
