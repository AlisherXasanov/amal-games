<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Время и место · 2.5D | Игры Амаля</title>
  <meta name="theme-color" content="#1a2744" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#0c1222;font-family:Georgia,"Times New Roman",serif;color:#f1e9d2;user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 20%,#2a3d66,#0c1222 70%)}
    canvas{display:block;width:min(1100px,100%);height:auto;max-height:100%;touch-action:none;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
    #hub{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#243656,#0c1222 75%);padding:20px}
    #hub.hide{display:none}
    #hub-card{width:min(420px,94vw);padding:22px 20px;border-radius:18px;background:rgba(18,28,48,.95);border:2px solid #c4a574;box-shadow:0 16px 50px rgba(0,0,0,.5)}
    #hub-card h1{font:italic 900 28px Georgia,serif;color:#f5e6c8;margin:0 0 6px}
    #hub-card p{font:16px/1.45 Georgia,serif;opacity:.85;margin:0 0 14px}
    #levels{display:flex;flex-direction:column;gap:8px}
    #levels button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(196,165,116,.45);background:rgba(255,255,255,.05);color:#f1e9d2;font:700 15px Georgia,serif;cursor:pointer;text-align:left}
    #levels button:hover{background:rgba(196,165,116,.18)}
    #levels button .n{width:28px;height:28px;border-radius:8px;background:#c4a574;color:#1a2030;display:flex;align-items:center;justify-content:center;font:900 14px system-ui}
    #levels button.locked{opacity:.4;cursor:not-allowed}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:10px 14px;border-radius:14px;background:rgba(12,18,34,.9);border:1px solid #c4a574;font:700 13px/1.4 Georgia,serif;max-width:min(340px,90vw);pointer-events:none}
    #hint{position:fixed;bottom:18%;left:50%;transform:translateX(-50%);z-index:25;padding:10px 16px;border-radius:12px;background:rgba(12,18,34,.92);border:1px solid #c4a574;font:700 15px Georgia,serif;display:none;white-space:nowrap}
    #toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:14px 18px;border-radius:14px;background:rgba(12,18,34,.96);border:2px solid #c4a574;font:italic 900 18px Georgia,serif;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#3d4f73;color:#fff;text-decoration:none;font:800 12px system-ui}
    #btn-hub{position:fixed;top:10px;right:10px;z-index:20;padding:8px 12px;border-radius:12px;border:1px solid #c4a574;background:rgba(12,18,34,.9);color:#f1e9d2;font:800 12px system-ui;cursor:pointer}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(196,165,116,.55);pointer-events:none}
    #btn-jump{position:fixed;bottom:28px;right:22px;z-index:25;display:none;width:74px;height:74px;border-radius:50%;border:0;background:rgba(196,165,116,.75);color:#1a2030;font:900 14px system-ui}
    @media(pointer:coarse){#pad,#btn-jump{display:block}.back{bottom:140px}}
  </style>
</head>
<body>
  <div id="hub">
    <div id="hub-card">
      <h1>Время и место</h1>
      <p>Идёшь <b>вправо</b> — мир идёт вперёд во времени.<br />Идёшь <b>влево</b> — мир откатывается назад.<br />Стоишь — время замирает.</p>
      <div id="levels"></div>
    </div>
  </div>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud"><b id="lvlName">—</b><br /><span id="timeLabel">время замерло</span></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <button type="button" id="btn-hub">Уровни</button>
  <div id="pad"><div id="pad-knob"></div></div>
  <button type="button" id="btn-jump">прыг</button>
  <script src="./game.js?v=3"></script>
</body>
</html>
