<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Небесный кристалл · 3D | Игры Амаля</title>
  <meta name="description" content="Нормальная 3D-игра: острова в небе, кристаллы, финиш. Камера от третьего лица." />
  <meta name="theme-color" content="#0ea5e9" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #06101f; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff;
      text-shadow: 0 2px 10px #000; font-size: 14px; line-height: 1.45;
      padding: 12px 14px; border-radius: 16px; max-width: min(92vw, 280px);
      background: rgba(8, 18, 36, .62); border: 1px solid rgba(125, 211, 252, .28);
      backdrop-filter: blur(10px);
    }
    #ui h1 { font-size: 17px; margin-bottom: 4px; color: #7dd3fc; }
    #ui .row { font-weight: 800; }
    #ui .hint { font-size: 11px; font-weight: 650; opacity: .82; margin-top: 6px; }
    #toast {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      z-index: 15; padding: 10px 18px; border-radius: 12px;
      background: rgba(0,0,0,.75); color: #a5f3fc; font-weight: 800;
      opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #win {
      position: fixed; inset: 0; display: none; z-index: 20;
      background: rgba(2, 8, 23, .86); align-items: center; justify-content: center;
      flex-direction: column; color: #fff; text-align: center; padding: 20px;
    }
    #win.show { display: flex; }
    #win h2 { font-size: 32px; color: #67e8f9; margin-bottom: 8px; }
    #win p { font-weight: 700; opacity: .9; margin-bottom: 16px; }
    #win button {
      padding: 12px 26px; font-size: 16px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, #22d3ee, #0ea5e9); color: #042f2e;
      cursor: pointer; font-weight: 900;
    }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 10; padding: 9px 14px;
      background: rgba(0,0,0,.55); color: #fff; text-decoration: none;
      border-radius: 12px; font-size: 13px; font-weight: 800;
    }
    #pad {
      position: fixed; bottom: 18px; left: 14px; z-index: 10; display: none;
      width: 132px; height: 132px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.2);
      touch-action: none;
    }
    #pad-knob {
      position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
      margin: -26px 0 0 -26px; border-radius: 50%;
      background: rgba(125, 211, 252, .55); pointer-events: none;
    }
    #jump-btn {
      position: fixed; bottom: 28px; right: 22px; z-index: 10; display: none;
      width: 72px; height: 72px; border-radius: 50%; border: 0;
      background: rgba(34, 211, 238, .45); color: #fff; font: 900 15px inherit;
    }
    @media (pointer: coarse) {
      #pad, #jump-btn { display: block; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>💎 Небесный кристалл</h1>
    <div class="row">Кристаллы: <span id="crystals">0</span> / <span id="crystals-max">0</span></div>
    <div class="row">Время: <span id="time">0.0</span>с</div>
    <div class="row">Чекпоинт: <span id="cp">1</span></div>
    <div class="hint">WASD / стрелки · Пробел — прыжок · ПКМ — камера</div>
  </div>
  <a id="back" href="../friends.html?v=8&stay=1&code=amal-star-friends">← Эксклюзив</a>
  <div id="toast"></div>
  <div id="win">
    <h2>Победа!</h2>
    <p id="win-text">Ты собрал кристаллы и добрался до портала</p>
    <button type="button" id="again">Ещё раз</button>
  </div>
  <div id="pad"><div id="pad-knob"></div></div>
  <button type="button" id="jump-btn">прыг</button>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js?v=1"></script>
</body>
</html>
