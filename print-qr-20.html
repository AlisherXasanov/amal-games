<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>20 QR · 4 адми + 16 друзей</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1e1030;
      color: #fff;
      padding: 4px 6px;
      overflow-x: hidden;
    }
    .no-print {
      text-align: center;
      font: 700 11px/1.3 system-ui;
      margin-bottom: 4px;
    }
    .no-print button, .no-print a {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 6px 12px;
      margin: 2px;
      font: 800 12px inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .no-print button { background: #fde047; color: #1a1400; }
    .no-print a {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,.25);
    }

    /* Весь лист в один экран + один A4 */
    .sheet {
      width: min(190mm, 100%);
      max-height: calc(100vh - 48px);
      margin: 0 auto;
      background: #fff;
      color: #111;
      border-radius: 6px;
      padding: 2mm 2.5mm 1.5mm;
      border: 2px solid #7c3aed;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sheet h1 {
      text-align: center;
      font-size: 9pt;
      color: #5b21b6;
      line-height: 1.1;
      flex: 0 0 auto;
    }
    .lead {
      text-align: center;
      font-size: 6.5pt;
      font-weight: 700;
      color: #64748b;
      margin: 0.2mm 0 0.6mm;
      flex: 0 0 auto;
    }
    .section {
      font-size: 6.5pt;
      font-weight: 900;
      margin: 0.5mm 0;
      padding: 0.4mm 1mm;
      border-radius: 3px;
      text-align: center;
      flex: 0 0 auto;
    }
    .section.admin {
      color: #9d174d;
      background: #fdf2f8;
      border: 1px dashed #db2777;
    }
    .section.friend {
      color: #5b21b6;
      background: #f5f3ff;
      border: 1px dashed #7c3aed;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1mm;
      flex: 1 1 auto;
      min-height: 0;
    }
    .grid.friends {
      grid-template-rows: repeat(4, 1fr);
    }
    .card {
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      padding: 0.4mm;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .card.admin { border-color: #db2777; background: #fff7fb; }
    .card.friend { border-color: #7c3aed; background: #faf8ff; }
    .badge {
      font-size: 5pt;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 0.3mm;
      white-space: nowrap;
    }
    .card.admin .badge { color: #be185d; }
    .card.friend .badge { color: #6d28d9; }
    .card img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100% - 12px);
      aspect-ratio: 1;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 2px;
      display: block;
    }
    .num {
      margin-top: 0.2mm;
      font-size: 6.5pt;
      font-weight: 900;
      line-height: 1;
      color: #0f172a;
    }
    .foot {
      margin-top: 0.5mm;
      font-size: 5.5pt;
      font-weight: 700;
      color: #64748b;
      text-align: center;
      flex: 0 0 auto;
    }

    @media print {
      html, body { height: auto; overflow: visible; }
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .sheet {
        max-height: none;
        height: auto;
        border: 0;
        border-radius: 0;
        width: 100%;
        overflow: visible;
        padding: 0;
      }
      .grid { flex: none; }
      .card img {
        width: 24mm;
        height: 24mm;
        max-height: none;
      }
    }
    @page { size: A4 portrait; margin: 6mm; }
  </style>
</head>
<body>
  <div class="no-print">
    <div>20 QR · 4 адми + 16 друзей · всё на одном экране</div>
    <button type="button" onclick="window.print()">🖨️ Печать</button>
    <a href="friends.html?v=9&stay=1&code=amal-star-friends">← Эксклюзив</a>
  </div>

  <div class="sheet">
    <h1>🎮 Игры Амаля · 20 QR</h1>
    <p class="lead">4 адми + 16 друзей</p>

    <div class="section admin">👑 АДМИ · ДЛЯ ВАС — 4</div>
    <div class="grid" id="grid-admin"></div>

    <div class="section friend">⭐ ДРУЗЬЯ — 16</div>
    <div class="grid friends" id="grid-friend"></div>

    <p class="foot">Всего 20 · А1–А4 адми · Д1–Д16 друзья · Амаль ♥</p>
  </div>

  <script>
    (function () {
      var BASE = "https://alisherxasanov.github.io/amal-games/";

      function qr(u) {
        return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=4&data=" + encodeURIComponent(u);
      }

      function addCard(grid, opts) {
        var card = document.createElement("div");
        card.className = "card " + opts.kind;
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = opts.label;
        var img = document.createElement("img");
        img.width = 220;
        img.height = 220;
        img.alt = opts.alt;
        img.src = qr(opts.url);
        var num = document.createElement("div");
        num.className = "num";
        num.textContent = opts.num;
        card.appendChild(badge);
        card.appendChild(img);
        card.appendChild(num);
        grid.appendChild(card);
      }

      var adminGrid = document.getElementById("grid-admin");
      for (var a = 1; a <= 4; a++) {
        addCard(adminGrid, {
          kind: "admin",
          label: "👑 АДМИ",
          alt: "Admin " + a,
          num: "А" + a,
          url: BASE + "go.html?v=3&exclusive=1&code=amal-star-admin-" + a + "&admin=1",
        });
      }

      var friendGrid = document.getElementById("grid-friend");
      for (var f = 1; f <= 16; f++) {
        addCard(friendGrid, {
          kind: "friend",
          label: "⭐ Друзья",
          alt: "Friend " + f,
          num: "Д" + f,
          url: BASE + "go.html?v=3&exclusive=1&code=amal-star-friends",
        });
      }
    })();
  </script>
</body>
</html>
