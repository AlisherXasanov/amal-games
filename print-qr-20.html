<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>20 QR · 4 адми + 16 друзей</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1e1030;
      color: #fff;
      padding: 8px;
    }
    .no-print {
      max-width: 640px;
      margin: 0 auto 8px;
      text-align: center;
      line-height: 1.35;
      font-weight: 700;
      font-size: 13px;
    }
    .no-print p { margin-bottom: 6px; }
    .no-print button, .no-print a {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      margin: 3px;
      font: 800 13px inherit;
      cursor: pointer;
      text-decoration: none;
    }
    .no-print button { background: #fde047; color: #1a1400; }
    .no-print a {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 2px solid rgba(255,255,255,.25);
    }

    .sheet {
      width: 190mm;
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      color: #111;
      border-radius: 8px;
      padding: 2.5mm 3mm 2mm;
      border: 2px solid #7c3aed;
    }
    .sheet h1 {
      text-align: center;
      font-size: 10pt;
      color: #5b21b6;
      line-height: 1.15;
    }
    .sheet .lead {
      text-align: center;
      font-size: 7pt;
      font-weight: 700;
      color: #64748b;
      margin: 0.3mm 0 1mm;
    }
    .section {
      font-size: 7pt;
      font-weight: 900;
      margin: 0.8mm 0 0.8mm;
      padding: 0.6mm 1mm;
      border-radius: 4px;
      text-align: center;
    }
    .section.admin {
      color: #9d174d;
      background: #fdf2f8;
      border: 1px dashed #db2777;
    }
    .section.friend {
      color: #5b21b6;
      background: #f5f3ff;
      border: 1px dashed #7c3aed;
      margin-top: 1.2mm;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.4mm;
    }
    .card {
      border: 1.5px solid #cbd5e1;
      border-radius: 4px;
      padding: 0.7mm;
      text-align: center;
    }
    .card.admin {
      border-color: #db2777;
      background: #fff7fb;
    }
    .card.friend {
      border-color: #7c3aed;
      background: #faf8ff;
    }
    .badge {
      display: block;
      font-size: 5.5pt;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 0.4mm;
      white-space: nowrap;
    }
    .card.admin .badge { color: #be185d; }
    .card.friend .badge { color: #6d28d9; }
    .card img {
      width: 26mm;
      height: 26mm;
      max-width: 100%;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 2px;
      display: block;
      margin: 0 auto;
    }
    .num {
      margin-top: 0.4mm;
      font-size: 7.5pt;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
    }
    .foot {
      margin-top: 1mm;
      font-size: 6pt;
      font-weight: 700;
      color: #64748b;
      text-align: center;
      line-height: 1.2;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none !important; }
      .sheet {
        border: 0;
        border-radius: 0;
        width: 100%;
        max-width: none;
        padding: 0;
      }
      .card img { width: 26mm; height: 26mm; }
    }
    @page { size: A4 portrait; margin: 7mm; }
  </style>
</head>
<body>
  <div class="no-print">
    <p><strong>20 QR на одном листе</strong><br>
      4 адми (розовые) + 16 друзей (фиолетовые).<br>
      Уплотнено: всё видно примерно за 1–2 скрина.</p>
    <button type="button" onclick="window.print()">🖨️ Печать</button>
    <a href="friends.html?v=9&stay=1&code=amal-star-friends">← Эксклюзив</a>
  </div>

  <div class="sheet">
    <h1>🎮 Игры Амаля · 20 QR</h1>
    <p class="lead">4 адми + 16 друзей · один лист</p>

    <div class="section admin">👑 АДМИ · ДЛЯ ВАС — 4 шт.</div>
    <div class="grid" id="grid-admin"></div>

    <div class="section friend">⭐ ДРУЗЬЯ — 16 шт.</div>
    <div class="grid" id="grid-friend"></div>

    <p class="foot">Всего 20 · А1–А4 адми · Д1–Д16 друзья · Амаль ♥</p>
  </div>

  <script>
    (function () {
      var BASE = "https://alisherxasanov.github.io/amal-games/";

      function qr(u) {
        return "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=6&data=" + encodeURIComponent(u);
      }

      function addCard(grid, opts) {
        var card = document.createElement("div");
        card.className = "card " + opts.kind;
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = opts.label;
        var img = document.createElement("img");
        img.width = 260;
        img.height = 260;
        img.alt = opts.alt;
        img.src = qr(opts.url);
        var num = document.createElement("div");
        num.className = "num";
        num.textContent = opts.num;
        card.appendChild(badge);
        card.appendChild(img);
        card.appendChild(num);
        grid.appendChild(card);
      }

      var adminGrid = document.getElementById("grid-admin");
      for (var a = 1; a <= 4; a++) {
        addCard(adminGrid, {
          kind: "admin",
          label: "👑 ДЛЯ ВАС · АДМИ",
          alt: "Admin " + a,
          num: "А" + a,
          url: BASE + "go.html?v=3&exclusive=1&code=amal-star-admin-" + a + "&admin=1",
        });
      }

      var friendGrid = document.getElementById("grid-friend");
      for (var f = 1; f <= 16; f++) {
        addCard(friendGrid, {
          kind: "friend",
          label: "⭐ Друзья",
          alt: "Friend " + f,
          num: "Д" + f,
          url: BASE + "go.html?v=3&exclusive=1&code=amal-star-friends",
        });
      }
    })();
  </script>
</body>
</html>
