<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Укради яйцо — 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; color: #fff; user-select: none; }
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 20;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(15, 23, 42, 0.9); border: 1px solid #fbbf24;
      font-size: 13px; line-height: 1.45; max-width: 280px;
    }
    #hud b { color: #fde68a; }
    .back {
      position: fixed; top: 10px; right: 10px; z-index: 20;
      padding: 8px 14px; border-radius: 10px;
      background: #22c55e; color: #fff; font-weight: 800; font-size: 12px; text-decoration: none;
    }
    #tip {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
      padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.7);
      font-size: 12px; font-weight: 700; border: 1px solid #c084fc;
    }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="../shared/amal-3d/legacy-boot.js?v=3"></script>
</head>
<body>
  <div id="hud"><b>🥚 Укради яйцо · 3D</b><br/>Зоны как в 2D — вольеры, боссы, дорожка<br/>WASD — ходьба · E — действие</div>
  <a class="back" href="./index.html?v=7">← 2D игра</a>
  <div id="tip">ПКМ — камера · колёсико — зум</div>

  <script>
  window.addEventListener("amal-3d-ready", function () {
    if (!THREE.CapsuleGeometry) {
      THREE.CapsuleGeometry = function (r, len) { return new THREE.CylinderGeometry(r, r, (len || 1) + r * 2, 8); };
    }

    const ZONES = [
      { name: "ТВОЯ", color: 0x22c55e, x: -28, eggs: 0x86efac },
      { name: "НУБ", color: 0x64748b, x: -18, eggs: 0xffffff },
      { name: "СОСЕД", color: 0xef4444, x: -8, eggs: 0xfbbf24 },
      { name: "КАТЯ", color: 0xf97316, x: 2, eggs: 0xa855f7 },
      { name: "РИК", color: 0x3b82f6, x: 12, eggs: 0x6366f1 },
      { name: "ЕРОКС", color: 0xa855f7, x: 22, eggs: 0xec4899 },
      { name: "ДРАКОН", color: 0xdc2626, x: 32, eggs: 0xef4444 },
      { name: "ЛЕГЕНДА", color: 0x0891b2, x: 42, eggs: 0x22d3ee },
      { name: "ФИНАЛ", color: 0xeab308, x: 52, eggs: 0xfde68a },
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dd3fc);
    scene.fog = new THREE.Fog(0x86efac, 50, 120);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xfff7ed, 1.1);
    sun.position.set(20, 40, 15);
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(140, 50),
      new THREE.MeshLambertMaterial({ color: 0x4ade80 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 6),
      new THREE.MeshLambertMaterial({ color: 0xd4a574 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(12, 0.03, 0);
    scene.add(road);

    function human(shirt, pants) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.28), new THREE.MeshLambertMaterial({ color: shirt }));
      body.position.y = 0.95;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), new THREE.MeshLambertMaterial({ color: 0xffcc99 }));
      head.position.y = 1.45;
      g.add(head);
      [[-0.32, 0.95], [0.32, 0.95]].forEach(function (p) {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.3, 3, 6), new THREE.MeshLambertMaterial({ color: 0xffcc99 }));
        arm.position.set(p[0], p[1], 0);
        g.add(arm);
      });
      [[-0.14, 0.45], [0.14, 0.45]].forEach(function (p) {
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.38, 3, 6), new THREE.MeshLambertMaterial({ color: pants }));
        leg.position.set(p[0], p[1], 0);
        g.add(leg);
      });
      return g;
    }

    ZONES.forEach(function (z, i) {
      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.4, 10),
        new THREE.MeshLambertMaterial({ color: z.color, emissive: z.color, emissiveIntensity: 0.15 })
      );
      pad.position.set(z.x, 0.2, 0);
      scene.add(pad);
      for (let p = 0; p < 3; p++) {
        const pen = new THREE.Mesh(
          new THREE.BoxGeometry(1.8, 0.8, 1.4),
          new THREE.MeshLambertMaterial({ color: i === 0 ? 0x166534 : 0x475569 })
        );
        pen.position.set(z.x - 2 + p * 2, 0.7, 2.5);
        scene.add(pen);
        if (i > 0) {
          const egg = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 10, 10),
            new THREE.MeshLambertMaterial({ color: z.eggs, emissive: z.eggs, emissiveIntensity: 0.25 })
          );
          egg.position.set(z.x - 2 + p * 2, 1.2, 2.5);
          scene.add(egg);
        }
      }
      if (i > 0 && i < 8) {
        const bot = human(z.color, 0x1e293b);
        bot.position.set(z.x, 0, -2);
        scene.add(bot);
      }
      if (i === 8) {
        const crown = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.6, 4), new THREE.MeshLambertMaterial({ color: 0xfde68a }));
        crown.position.set(z.x, 2.2, -2);
        scene.add(crown);
      }
    });

    const tread = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 2), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
    tread.position.set(-24, 0.35, 4);
    scene.add(tread);

    const player = human(0x38bdf8, 0x1e3a8a);
    player.position.set(-28, 0, 0);
    scene.add(player);

    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 16, pitch: 0.55, lookOffsetY: 1.2, minDist: 6, maxDist: 28,
      hintText: "ПКМ — камера · E — действие",
    });

    const keys = {};
    addEventListener("keydown", function (e) { keys[e.code] = true; });
    addEventListener("keyup", function (e) { keys[e.code] = false; });

    let px = -28, pz = 0;
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      let mx = 0, mz = 0;
      if (keys.KeyW || keys.ArrowUp) mz -= 1;
      if (keys.KeyS || keys.ArrowDown) mz += 1;
      if (keys.KeyA || keys.ArrowLeft) mx -= 1;
      if (keys.KeyD || keys.ArrowRight) mx += 1;
      const len = Math.hypot(mx, mz);
      if (len > 0.01) {
        const sp = 8 * dt;
        px += (mx / len) * sp;
        pz += (mz / len) * sp;
        player.rotation.y = Math.atan2(mx, mz);
      }
      px = Math.max(-32, Math.min(56, px));
      pz = Math.max(-8, Math.min(8, pz));
      player.position.set(px, 0, pz);
      orbit.setTarget(px, 1, pz);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    addEventListener("resize", function () {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  });
  </script>
</body>
</html>
