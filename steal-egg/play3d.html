<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Укради яйцо — 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0c4a6e; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; touch-action: none; }
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 30;
      padding: 12px 14px; border-radius: 14px; max-width: min(300px, 88vw);
      background: rgba(15, 23, 42, 0.92); border: 2px solid #fbbf24;
      font-size: 13px; line-height: 1.5; text-shadow: 0 1px 2px #000;
    }
    #hud b { color: #fde68a; font-size: 15px; }
    #hud .big { font-size: 22px; font-weight: 900; color: #fde68a; }
    #prompt {
      position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%); z-index: 30;
      padding: 10px 18px; border-radius: 12px; display: none;
      background: rgba(0,0,0,.78); border: 2px solid #c084fc;
      font-weight: 800; font-size: 14px; white-space: nowrap;
    }
    #toast {
      position: fixed; top: 42%; left: 50%; transform: translate(-50%,-50%); z-index: 40;
      padding: 14px 22px; border-radius: 14px; display: none;
      background: rgba(30,10,40,.94); border: 2px solid #c084fc;
      font-weight: 900; font-size: 17px; text-align: center; max-width: 90vw;
    }
    #alarm {
      position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none;
      background: rgba(220,38,38,.2); box-shadow: inset 0 0 80px rgba(220,38,38,.4);
    }
    .top-bar { position: fixed; top: 10px; right: 10px; z-index: 30; display: flex; gap: 8px; }
    .top-bar a, .top-bar button {
      padding: 8px 14px; border-radius: 10px; border: 0;
      font: 800 12px system-ui, sans-serif; cursor: pointer; text-decoration: none; color: #fff;
    }
    .back { background: linear-gradient(135deg,#22c55e,#16a34a); }
    .run-btn { background: linear-gradient(135deg,#f59e0b,#d97706); }
    #tip {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 25;
      padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,.65);
      font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,.2);
    }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="../shared/amal-3d/legacy-boot.js?v=4"></script>
</head>
<body>
  <div id="hud">
    <b>🥚 Укради яйцо · 3D</b><br/>
    🪙 <span class="big" id="coins">100</span><br/>
    +<span id="income">0</span>/сек · ⚡ <span id="speed">1</span><br/>
    В руках: <span id="carry">пусто</span>
  </div>
  <div class="top-bar">
    <a class="back" href="./index.html?v=9">← 2D</a>
    <button type="button" class="run-btn" id="btnRun">🏃 W бег</button>
  </div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="alarm"></div>
  <div id="tip">WASD · E действие · ПКМ камера · на дорожке W = ⚡</div>

  <script>
  window.addEventListener("amal-3d-ready", function () {
    if (!THREE.CapsuleGeometry) {
      THREE.CapsuleGeometry = function (r, len) {
        return new THREE.CylinderGeometry(r, r, (len || 1) + r * 2, 8);
      };
    }

    /** Каждое яйцо — своя 3D форма и цвет */
    const EGG_DEFS = [
      { id: "basic", name: "Обычное", rate: 1, color: 0xf8fafc, geo: "egg", emissive: 0, scale: 1 },
      { id: "gold", name: "Золотое", rate: 4, color: 0xfbbf24, geo: "egg", emissive: 0.35, scale: 1.08 },
      { id: "slime", name: "Слайм", rate: 8, color: 0x84cc16, geo: "blob", emissive: 0.2, scale: 1.1 },
      { id: "rare", name: "Редкое", rate: 12, color: 0xa855f7, geo: "crystal", emissive: 0.4, scale: 1 },
      { id: "crystal", name: "Кристалл", rate: 22, color: 0x38bdf8, geo: "diamond", emissive: 0.45, scale: 1.05 },
      { id: "epic", name: "Эпик", rate: 28, color: 0x6366f1, geo: "ring", emissive: 0.5, scale: 1 },
      { id: "ghost", name: "Призрак", rate: 45, color: 0xe2e8f0, geo: "ghost", emissive: 0.15, scale: 1 },
      { id: "lava", name: "Лава", rate: 58, color: 0xf97316, geo: "lava", emissive: 0.7, scale: 1.1 },
      { id: "dragon", name: "Дракон", rate: 70, color: 0xef4444, geo: "dragon", emissive: 0.55, scale: 1.15 },
      { id: "void", name: "Пустота", rate: 110, color: 0x312e81, geo: "void", emissive: 0.6, scale: 1.1 },
      { id: "star", name: "Звезда", rate: 160, color: 0xfde68a, geo: "star", emissive: 0.65, scale: 1.2 },
      { id: "final", name: "ФИНАЛ", rate: 200, color: 0xfde68a, geo: "crown", emissive: 0.8, scale: 1.25 },
    ];

    const ZONES = [
      { id: "mine", name: "ТВОЯ", x: -32, z: 0, r: 7, color: 0x22c55e, pool: [], slots: 4, boss: false },
      { id: "z1", name: "НУБ", x: -18, z: 0, r: 6, color: 0x64748b, pool: ["basic", "basic", "gold"], boss: true },
      { id: "z2", name: "СОСЕД", x: -4, z: 0, r: 6, color: 0xef4444, pool: ["basic", "gold", "slime", "rare"], boss: true },
      { id: "z3", name: "КАТЯ", x: 10, z: 0, r: 6, color: 0xf97316, pool: ["gold", "slime", "rare", "crystal"], boss: true },
      { id: "z4", name: "РИК", x: 24, z: 0, r: 6, color: 0x3b82f6, pool: ["rare", "crystal", "epic", "ghost"], boss: true },
      { id: "z5", name: "ЕРОКС", x: 38, z: 0, r: 6.5, color: 0xa855f7, pool: ["epic", "ghost", "lava", "dragon"], boss: true },
      { id: "z6", name: "ДРАКОН", x: 52, z: 0, r: 6.5, color: 0xdc2626, pool: ["lava", "dragon", "void", "star"], boss: true },
      { id: "z7", name: "ФИНАЛ", x: 66, z: 0, r: 7, color: 0xeab308, pool: ["dragon", "void", "star", "final"], boss: true },
    ];

    const SAVE_KEY = "amal-steal-egg-3d-v1";

    function eggDef(id) {
      return EGG_DEFS.find(function (e) { return e.id === id; }) || EGG_DEFS[0];
    }

    function pickEgg(pool) {
      const id = pool[Math.floor(Math.random() * pool.length)];
      return Object.assign({}, eggDef(id));
    }

    function makeMat(def, alpha) {
      return new THREE.MeshStandardMaterial({
        color: def.color,
        emissive: def.color,
        emissiveIntensity: def.emissive || 0,
        transparent: alpha != null,
        opacity: alpha != null ? alpha : 1,
        roughness: 0.45,
        metalness: def.id === "gold" || def.id === "final" ? 0.6 : 0.15,
      });
    }

    /** Уникальная 3D модель для каждого типа яйца */
    function makeEggMesh(def, scaleMul) {
      const g = new THREE.Group();
      const s = (def.scale || 1) * (scaleMul || 1);
      const mat = makeMat(def);
      let core;

      if (def.geo === "egg") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.38 * s, 18, 18), mat);
        core.scale.y = 1.28;
      } else if (def.geo === "blob") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.42 * s, 14, 12), mat);
        core.scale.set(1.15, 0.85, 1.15);
      } else if (def.geo === "crystal") {
        core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42 * s, 0), mat);
      } else if (def.geo === "diamond") {
        core = new THREE.Mesh(new THREE.OctahedronGeometry(0.45 * s, 0), mat);
      } else if (def.geo === "ring") {
        core = new THREE.Mesh(new THREE.TorusGeometry(0.32 * s, 0.12 * s, 10, 24), mat);
        core.rotation.x = Math.PI / 2;
      } else if (def.geo === "ghost") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.4 * s, 16, 16), makeMat(def, 0.72));
        const tail = new THREE.Mesh(new THREE.ConeGeometry(0.28 * s, 0.5 * s, 8), makeMat(def, 0.55));
        tail.position.y = -0.35 * s;
        g.add(tail);
      } else if (def.geo === "lava") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.36 * s, 14, 14), mat);
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.15 * s, 0.35 * s, 6), mat);
        spike.position.set(0, 0.42 * s, 0);
        g.add(spike);
      } else if (def.geo === "dragon") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.34 * s, 16, 16), mat);
        core.scale.set(1, 1.35, 0.9);
        [[-0.25, 0.2, 0], [0.25, 0.2, 0]].forEach(function (p) {
          const horn = new THREE.Mesh(new THREE.ConeGeometry(0.08 * s, 0.35 * s, 5), mat);
          horn.position.set(p[0] * s, 0.45 * s, p[2]);
          g.add(horn);
        });
      } else if (def.geo === "void") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.4 * s, 16, 16), mat);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55 * s, 0.04 * s, 8, 32), makeMat({ color: 0xa855f7, emissive: 0.8 }, 0.9));
        ring.rotation.x = Math.PI / 2;
        g.add(ring);
      } else if (def.geo === "star") {
        core = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4 * s, 0), mat);
      } else if (def.geo === "crown") {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.38 * s, 18, 18), mat);
        core.scale.y = 1.2;
        const crown = new THREE.Mesh(new THREE.ConeGeometry(0.12 * s, 0.35 * s, 4), makeMat({ color: 0xfde68a, emissive: 0.9 }));
        crown.position.set(0, 0.55 * s, 0);
        g.add(crown);
      } else {
        core = new THREE.Mesh(new THREE.SphereGeometry(0.38 * s, 14, 14), mat);
      }

      g.add(core);
      g.userData.spin = 0.8 + Math.random() * 0.6;
      return g;
    }

    function makeBoss(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.3), new THREE.MeshStandardMaterial({ color: color }));
      body.position.y = 0.95;
      g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
      head.position.y = 1.45;
      g.add(head);
      return g;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dd3fc);
    scene.fog = new THREE.Fog(0x86efac, 35, 130);

    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 220);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xfff7ed, 1.15);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xbae6fd, 0x4ade80, 0.35));

    const MAP_W = 160;
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP_W, 40),
      new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP_W - 10, 7),
      new THREE.MeshStandardMaterial({ color: 0xd4a574 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(17, 0.02, 0);
    scene.add(road);

    const myZone = ZONES[0];
    const mySlots = [];
    const worldEggs = [];
    const bosses = [];

    ZONES.forEach(function (z, zi) {
      const pad = new THREE.Mesh(
        new THREE.CylinderGeometry(z.r, z.r + 0.35, 0.35, 32),
        new THREE.MeshStandardMaterial({ color: z.color, emissive: z.color, emissiveIntensity: zi === 0 ? 0.35 : 0.12 })
      );
      pad.position.set(z.x, 0.18, z.z);
      pad.receiveShadow = true;
      scene.add(pad);

      const slotN = zi === 0 ? myZone.slots : 3;
      for (let s = 0; s < slotN; s++) {
        const ang = (s / slotN) * Math.PI * 2 - Math.PI / 2;
        const sx = z.x + Math.cos(ang) * (z.r * 0.55);
        const sz = z.z + Math.sin(ang) * (z.r * 0.55);
        const ped = new THREE.Mesh(
          new THREE.BoxGeometry(1.6, 0.5, 1.4),
          new THREE.MeshStandardMaterial({ color: zi === 0 ? 0x166534 : 0x475569 })
        );
        ped.position.set(sx, 0.45, sz);
        ped.castShadow = true;
        scene.add(ped);

        const slot = { x: sx, z: sz, ped: ped, egg: null, mesh: null, zone: z };
        if (zi === 0) {
          mySlots.push(slot);
        } else {
          const def = pickEgg(z.pool);
          const mesh = makeEggMesh(def);
          mesh.position.set(sx, 1.05, sz);
          scene.add(mesh);
          worldEggs.push({ def: def, mesh: mesh, x: sx, z: sz, zone: z, taken: false, respawn: 0, slot: slot });
          slot.egg = def;
          slot.mesh = mesh;
        }
      }

      if (z.boss) {
        const b = makeBoss(z.color);
        b.position.set(z.x, 0, z.z - 3.5);
        scene.add(b);
        bosses.push({ mesh: b, zone: z, homeX: z.x, homeZ: z.z - 3.5, angry: false });
      }
    });

    const treadmill = { x: myZone.x, z: myZone.z + 5.5, w: 6, d: 2.5 };
    const treadMesh = new THREE.Mesh(
      new THREE.BoxGeometry(treadmill.w, 0.25, treadmill.d),
      new THREE.MeshStandardMaterial({ color: 0x94a3b8, emissive: 0x64748b, emissiveIntensity: 0.2 })
    );
    treadMesh.position.set(treadmill.x, 0.28, treadmill.z);
    scene.add(treadMesh);

    const player = AmalWalkPlayer.create(scene, THREE, {
      humanoid: true,
      height: 1.75,
      speed: 9,
      x: myZone.x,
      z: myZone.z + 2,
      skinColor: 0xffcc99,
      shirtColor: 0x38bdf8,
      pantsColor: 0x1e3a8a,
    });

    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 14,
      pitch: 0.52,
      minDist: 5,
      maxDist: 28,
      hintText: "ПКМ — камера · E — взять / украсть / поставить",
    });

    const bounds = { minX: -38, maxX: 78, minZ: -16, maxZ: 16 };

    let coins = 100;
    let speedStat = 1;
    let carry = null;
    let carryMesh = null;
    let carryFrom = null;
    let toastT = 0;
    let alarmT = 0;
    let incomeAcc = 0;
    let onTreadmill = false;
    let treadmillRun = false;

    const coinsEl = document.getElementById("coins");
    const incomeEl = document.getElementById("income");
    const speedEl = document.getElementById("speed");
    const carryEl = document.getElementById("carry");
    const promptEl = document.getElementById("prompt");
    const toastEl = document.getElementById("toast");
    const alarmEl = document.getElementById("alarm");

    function formatNum(n) {
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1e4) return Math.round(n / 1000) + "K";
      return Math.floor(n).toString();
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      toastT = 2.2;
    }

    function incomeRate() {
      return mySlots.reduce(function (s, sl) { return s + (sl.egg ? sl.egg.rate : 0); }, 0);
    }

    function syncUI() {
      coinsEl.textContent = formatNum(coins);
      incomeEl.textContent = formatNum(incomeRate());
      speedEl.textContent = formatNum(speedStat);
      carryEl.textContent = carry ? carry.name + " " + (carry.geo || "") : "пусто";
    }

    function saveGame() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          coins: coins,
          speedStat: speedStat,
          mine: mySlots.map(function (s) { return s.egg ? s.egg.id : null; }),
        }));
      } catch (_) {}
    }

    function loadGame() {
      try {
        const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
        if (!d) return;
        if (d.coins != null) coins = d.coins;
        if (d.speedStat != null) speedStat = d.speedStat;
        if (Array.isArray(d.mine)) {
          d.mine.forEach(function (id, i) {
            if (!id || !mySlots[i]) return;
            const def = eggDef(id);
            mySlots[i].egg = Object.assign({}, def);
            mySlots[i].mesh = makeEggMesh(def);
            mySlots[i].mesh.position.set(mySlots[i].x, 1.05, mySlots[i].z);
            scene.add(mySlots[i].mesh);
          });
        }
      } catch (_) {}
    }

    function dist2(x1, z1, x2, z2) {
      return Math.hypot(x1 - x2, z1 - z2);
    }

    function nearestSteal() {
      const px = player.mesh.position.x;
      const pz = player.mesh.position.z;
      let best = null;
      let bestD = 2.2;
      worldEggs.forEach(function (w) {
        if (w.taken || w.respawn > 0) return;
        const d = dist2(px, pz, w.x, w.z);
        if (d < bestD) { bestD = d; best = w; }
      });
      return best;
    }

    function freeMySlot() {
      return mySlots.find(function (s) { return !s.egg; });
    }

    function onMyBase() {
      const px = player.mesh.position.x;
      const pz = player.mesh.position.z;
      return dist2(px, pz, myZone.x, myZone.z) < myZone.r + 0.5;
    }

    function updatePrompt() {
      let t = "";
      if (onTreadmill) t = treadmillRun ? "🏃 БЕЖИМ! +" + formatNum(8 + speedStat * 0.02) + " ⚡/с" : "👟 Жми W на дорожке!";
      else if (carry && onMyBase() && freeMySlot()) t = "E — в вольер";
      else if (!carry && nearestSteal()) t = "E — украсть «" + nearestSteal().def.name + "»";
      promptEl.style.display = t ? "block" : "none";
      promptEl.textContent = t;
    }

    function placeEgg() {
      const slot = freeMySlot();
      if (!slot || !carry) return false;
      slot.egg = Object.assign({}, carry);
      slot.mesh = makeEggMesh(carry);
      slot.mesh.position.set(slot.x, 1.05, slot.z);
      scene.add(slot.mesh);
      if (carryMesh) { scene.remove(carryMesh); carryMesh = null; }
      toast("🐣 " + carry.name + " в вольере! +" + carry.rate + "/с");
      carry = null;
      carryFrom = null;
      alarmT = 0;
      alarmEl.style.display = "none";
      bosses.forEach(function (b) { b.angry = false; });
      saveGame();
      syncUI();
      return true;
    }

    function stealEgg(w) {
      w.taken = true;
      w.mesh.visible = false;
      carry = Object.assign({}, w.def);
      carryFrom = w.zone.id;
      if (carryMesh) scene.remove(carryMesh);
      carryMesh = makeEggMesh(carry, 0.85);
      scene.add(carryMesh);
      bosses.forEach(function (b) {
        if (b.zone.id === w.zone.id) b.angry = true;
      });
      alarmT = 3;
      alarmEl.style.display = "block";
      toast("Украл 3D «" + carry.name + "»! Беги домой!");
      syncUI();
    }

    function doAction() {
      if (carry && onMyBase()) { placeEgg(); return; }
      if (!carry) {
        const w = nearestSteal();
        if (w) stealEgg(w);
      }
    }

    function dropCarry() {
      if (!carry) return;
      const w = worldEggs.find(function (x) { return x.taken && x.def.id === carry.id && x.zone.id === carryFrom; });
      if (w) { w.taken = false; w.mesh.visible = true; w.respawn = 0; }
      if (carryMesh) { scene.remove(carryMesh); carryMesh = null; }
      carry = null;
      carryFrom = null;
      alarmT = 0;
      alarmEl.style.display = "none";
      bosses.forEach(function (b) { b.angry = false; });
      syncUI();
    }

    addEventListener("keydown", function (e) {
      if (e.code === "KeyE" || e.code === "Space") { e.preventDefault(); doAction(); }
    });

    loadGame();
    syncUI();
    toast("3D яйца — все разные! E — украсть / поставить");

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      player.update(dt, orbit.state.yaw, bounds);
      const px = player.mesh.position.x;
      const pz = player.mesh.position.z;

      onTreadmill =
        px > treadmill.x - treadmill.w / 2 && px < treadmill.x + treadmill.w / 2 &&
        pz > treadmill.z - treadmill.d / 2 && pz < treadmill.z + treadmill.d / 2;

      const keys = player.keys || {};
      treadmillRun = onTreadmill && (keys.w || keys.arrowup);
      treadMesh.material.emissiveIntensity = treadmillRun ? 0.55 : 0.2;
      treadMesh.material.color.setHex(treadmillRun ? 0xfde68a : 0x94a3b8);
      if (treadmillRun) speedStat += (8 + Math.log10(Math.max(10, speedStat)) * 6) * dt;

      if (carryMesh) {
        carryMesh.position.set(px, 1.55, pz);
        carryMesh.rotation.y += dt * 2;
      }

      worldEggs.forEach(function (w) {
        if (!w.taken && w.mesh.visible) {
          w.mesh.rotation.y += dt * w.mesh.userData.spin;
          w.mesh.position.y = 1.05 + Math.sin(now * 0.003 + w.x) * 0.06;
        }
        if (w.taken) {
          w.respawn += dt;
          if (w.respawn > 12) {
            w.taken = false;
            w.respawn = 0;
            w.def = pickEgg(w.zone.pool);
            scene.remove(w.mesh);
            w.mesh = makeEggMesh(w.def);
            w.mesh.position.set(w.x, 1.05, w.z);
            scene.add(w.mesh);
          }
        }
      });

      mySlots.forEach(function (s) {
        if (s.mesh) s.mesh.rotation.y += dt * 0.5;
      });

      if (carry && carryFrom) {
        bosses.forEach(function (b) {
          if (!b.angry || b.zone.id !== carryFrom) return;
          const d = dist2(px, pz, b.mesh.position.x, b.mesh.position.z);
          if (d < 1.6) {
            toast("💥 " + b.zone.name + " вернул яйцо!");
            dropCarry();
          } else if (d < 20) {
            b.mesh.position.x += (px - b.mesh.position.x) * dt * 3.5;
            b.mesh.position.z += (pz - b.mesh.position.z) * dt * 3.5;
          }
        });
      }

      incomeAcc += dt;
      if (incomeAcc >= 1) {
        incomeAcc = 0;
        coins += incomeRate();
        saveGame();
      }

      if (toastT > 0) {
        toastT -= dt;
        if (toastT <= 0) toastEl.style.display = "none";
      }
      if (alarmT > 0) {
        alarmT -= dt;
        if (alarmT <= 0) alarmEl.style.display = "none";
      }

      orbit.follow(px, 1.3, pz);
      updatePrompt();
      syncUI();
      renderer.render(scene, camera);
    }

    animate(performance.now());

    addEventListener("resize", function () {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  });
  </script>
</body>
</html>
