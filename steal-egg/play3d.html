<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Укради яйцо · 3D | Игры Амаля</title>
  <meta name="theme-color" content="#0ea5e9" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #0c4a6e; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
    canvas { display: block; touch-action: none; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 40; max-width: min(300px, 78vw);
      padding: 12px 14px; border-radius: 16px;
      background: rgba(15, 23, 42, .9); border: 2px solid #fbbf24;
      backdrop-filter: blur(10px); font: 700 13px/1.45 system-ui;
    }
    #hud b { color: #fde68a; font-size: 15px; }
    #hud .big { font-size: 24px; font-weight: 900; color: #fde68a; }
    #prompt {
      position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%); z-index: 40;
      padding: 10px 16px; border-radius: 12px; display: none;
      background: rgba(0,0,0,.8); border: 2px solid #c084fc; font: 800 14px system-ui; white-space: nowrap;
    }
    #toast {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%); z-index: 50;
      padding: 12px 20px; border-radius: 14px; display: none; pointer-events: none;
      background: rgba(30,10,40,.95); border: 2px solid #c084fc; font: 900 16px system-ui; text-align: center; max-width: 90vw;
    }
    #alarm {
      position: fixed; inset: 0; z-index: 20; pointer-events: none; display: none;
      background: rgba(220,38,38,.18); box-shadow: inset 0 0 90px rgba(220,38,38,.4);
    }
    .top-bar { position: fixed; top: 12px; right: 12px; z-index: 45; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .top-bar a, .top-bar button {
      padding: 8px 12px; border-radius: 12px; border: 0; font: 800 12px system-ui;
      cursor: pointer; text-decoration: none; color: #fff;
    }
    .back { background: linear-gradient(135deg,#22c55e,#16a34a); }
    .run-btn { background: linear-gradient(135deg,#f59e0b,#d97706); }
    #shop {
      position: fixed; bottom: 12px; left: 12px; z-index: 40; width: min(320px, 94vw);
      max-height: 34vh; overflow: auto; padding: 12px; border-radius: 14px;
      background: rgba(15,23,42,.92); border: 1px solid rgba(251,191,36,.4);
    }
    #shop h3 { font-size: 13px; color: #fde68a; margin-bottom: 8px; }
    #shop .item {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      margin: 0 0 6px; padding: 8px 10px; border: 0; border-radius: 10px;
      background: rgba(255,255,255,.08); color: #fff; font: 700 12px system-ui; cursor: pointer; text-align: left;
    }
    #shop .item:hover { background: rgba(56,189,248,.25); }
    #shop .price { color: #fbbf24; white-space: nowrap; }
    #slots {
      position: fixed; bottom: 12px; right: 12px; z-index: 40; width: min(180px, 36vw);
      padding: 10px; border-radius: 14px; background: rgba(10,30,18,.9); border: 1px solid #4ade80;
      font: 700 11px/1.4 system-ui;
    }
    #slots h3 { color: #86efac; font-size: 12px; margin-bottom: 6px; }
    #tip {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
      padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,.65);
      font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,.2);
    }
    #pad {
      position: fixed; bottom: 18px; left: 14px; z-index: 45; display: none;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.22); touch-action: none;
    }
    #pad-knob {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
      border-radius: 50%; background: rgba(125,211,252,.55); pointer-events: none;
    }
    #act-btns {
      position: fixed; bottom: 22px; right: 18px; z-index: 45; display: none; flex-direction: column; gap: 10px;
    }
    #act-btns button {
      width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: rgba(14,165,233,.55); color: #fff; font: 900 13px system-ui;
    }
    @media (pointer: coarse) {
      #pad, #act-btns { display: flex; }
      #tip { display: none; }
      #shop { max-height: 26vh; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <b>🥚 Укради яйцо · 3D</b><br />
    🪙 <span class="big" id="coins">120</span><br />
    +<span id="income">0</span>/сек · ⚡ <span id="speed">1</span><br />
    В руках: <span id="carry">пусто</span>
  </div>
  <div class="top-bar">
    <a class="back" href="../friends.html?v=8&stay=1&code=amal-star-friends">← Эксклюзив</a>
    <a class="back" href="./classic.html?v=1" style="background:linear-gradient(135deg,#64748b,#334155)">2D</a>
    <button type="button" class="run-btn" id="btnRun">🏃 Бег</button>
  </div>
  <div id="shop"><h3>Магазин яиц</h3><div id="shopList"></div></div>
  <div id="slots"><h3>Твой вольер</h3><div id="slotList"></div></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="alarm"></div>
  <div id="tip">WASD · E взять/украсть/поставить · на дорожке W = ⚡ · ПКМ камера</div>
  <div id="pad"><div id="pad-knob"></div></div>
  <div id="act-btns">
    <button type="button" id="btn-e">E</button>
    <button type="button" id="btn-jump">прыг</button>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main3d.js?v=5"></script>
</body>
</html>
