<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Игры Амаля — выбери версию</title>
  <meta name="theme-color" content="#0d6e5f" />
  <link rel="stylesheet" href="./shared/amal-hub-ui.css?v=1" />
  <script src="./shared/amal-device.js?v=9"></script>
  <style>
    body { display: grid; place-items: center; padding: 20px; }
    .picker {
      max-width: 420px; width: 100%; background: #fff; border-radius: 24px;
      padding: 28px 22px; border: 3px solid #0d6e5f; text-align: center;
      box-shadow: 0 16px 40px rgba(13,110,95,.2);
    }
    .picker h1 { color: #0d6e5f; font-size: 1.5rem; margin-bottom: 6px; }
    .picker .guess {
      background: #e8f4ef; border-radius: 14px; padding: 12px; margin: 14px 0;
      font-weight: 800; font-size: 14px; color: #0d6e5f;
    }
    .pick-grid { display: grid; gap: 10px; margin-top: 12px; }
    .pick-btn {
      display: flex; align-items: center; gap: 14px; padding: 16px 18px;
      border-radius: 16px; border: 2px solid rgba(13,110,95,.15); background: #f8faf9;
      text-decoration: none; color: #102018; font-weight: 800; font-size: 15px;
      text-align: left;
    }
    .pick-btn .ico { font-size: 32px; }
    .pick-btn.suggest { border-color: #0d6e5f; background: #ecfdf5; }
    .pick-btn.main-site { border-color: #7c3aed; background: linear-gradient(135deg,#faf5ff,#ecfdf5); }
    .pick-btn small { display: block; font-weight: 600; font-size: 11px; color: #5a6a62; margin-top: 2px; }
    .pick-note { margin-top: 14px; font-size: 12px; color: #5a6a62; font-weight: 600; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="picker">
    <h1>🎮 Игры Амаля</h1>
    <p class="pick-note">Выбери версию сам — никуда не перекинет без нажатия.</p>
    <p class="guess" id="guess">🔍 Определяем…</p>
    <div class="pick-grid" id="grid"></div>
    <p class="pick-note">Потом можно переключать в меню сверху: 📱 📟 💻 ⭐</p>
    <p class="pick-note" style="margin-top:8px"><a href="qr-scanner.html" style="color:#0d6e5f;font-weight:800">📷 На компьютере — Сканер QR</a></p>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var exclusive = q.get("exclusive") === "1" || q.get("friends") === "1";
      var code = q.get("code") || "";
      if (window.AmalDevice && AmalDevice.admitFriendsCode) {
        AmalDevice.admitFriendsCode(code);
      } else if (exclusive && (code === "amal-star-friends" || /^amal-star-admin-[1-5]$/.test(code))) {
        try { localStorage.setItem("amal-friends-access-v1", "1"); } catch (_) {}
        if (/^amal-star-admin-[1-5]$/.test(code)) {
          try {
            localStorage.setItem("amal-friends-star-admin-v1", "1");
            localStorage.setItem("amal-friends-star-admin-id", code.replace("amal-star-admin-", ""));
            localStorage.setItem("amal-friends-power-v1", "5");
          } catch (_) {}
        }
      }
      var isStarAdmin = false;
      try { isStarAdmin = localStorage.getItem("amal-friends-star-admin-v1") === "1"; } catch (_) {}
      var friendsHref = "./friends.html?v=10&stay=1&code=" + encodeURIComponent(code || "amal-star-friends");
      if (isStarAdmin || /^amal-star-admin-/.test(code)) {
        friendsHref += "&admin=1";
      }
      var hubQ = exclusive || (function () {
        try { return localStorage.getItem("amal-friends-access-v1") === "1"; } catch (_) { return false; }
      })() ? "&hub=friends" : "";
      var mainHref = "./?stay=1" + (hubQ ? hubQ : "");
      var phoneHref = "./phone.html?v=3&stay=1" + hubQ;
      var tabletHref = "./tablet.html?v=2&stay=1" + hubQ;

      var dev = AmalDevice.detect();
      document.getElementById("guess").textContent = exclusive
        ? "⭐ Друзья: есть эксклюзив и полный основной сайт — выбирай сам!"
        : ("Подсказка: у тебя " + AmalDevice.label(dev) + " — но выбирай сам!");

      var items = [];
      if (exclusive) {
        items.push({
          id: "friends",
          ico: isStarAdmin ? "👑" : "⭐",
          name: isStarAdmin ? "👑 Эксклюзив · АДМИ" : "⭐ Эксклюзив",
          sub: isStarAdmin ? "для вас · адми · особые силы" : "Смотри · чат · особые игры",
          href: friendsHref,
          extra: "",
        });
        items.push({
          id: "desktop",
          ico: "💻",
          name: "Основной сайт · все игры",
          sub: "полный каталог · телефон и ПК · то же, что у Амаля",
          href: mainHref,
          extra: " main-site",
        });
        items.push({ id: "phone", ico: "📱", name: "Телефон (основной)", sub: "большие кнопки · полный каталог", href: phoneHref, extra: "" });
        items.push({ id: "tablet", ico: "📟", name: "Планшет / iPad", sub: "средний экран · полный каталог", href: tabletHref, extra: "" });
      } else {
        items = [
          { id: "phone", ico: "📱", name: "Телефон", sub: "большие кнопки · вертикально", href: phoneHref, extra: "" },
          { id: "tablet", ico: "📟", name: "Планшет / iPad", sub: "средний экран · можно 3D", href: tabletHref, extra: "" },
          { id: "desktop", ico: "💻", name: "Компьютер", sub: "все игры · Bed Wars · 3D", href: mainHref, extra: "" },
        ];
      }

      var suggest = exclusive
        ? (dev === "desktop" ? "desktop" : "friends")
        : (dev === "phone" || dev === "tablet" || dev === "desktop" ? dev : "desktop");

      var grid = document.getElementById("grid");
      items.forEach(function (it) {
        var a = document.createElement("a");
        var mark = it.id === suggest ? " suggest" : "";
        if (exclusive && it.id === "desktop") mark += " suggest";
        a.className = "pick-btn" + mark + (it.extra || "");
        a.href = it.href;
        a.innerHTML = '<span class="ico">' + it.ico + '</span><span>' + it.name + '<small>' + it.sub + '</small></span>';
        grid.appendChild(a);
      });
    })();
  </script>
</body>
</html>
