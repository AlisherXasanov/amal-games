<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flee the Facility 3D</title>
  <meta name="description" content="3D Flee the Facility — взломай компьютеры и убеги!" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 14px; line-height: 1.6; }
    #back { position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px; background: rgba(0,0,0,.5); color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
    #controls { position: fixed; bottom: 12px; left: 12px; color: #fff; text-shadow: 1px 1px 2px #000; font-size: 12px; z-index: 10; }
    #result { position: fixed; inset: 0; display: none; z-index: 20; background: rgba(0,0,0,.85); align-items: center; justify-content: center; flex-direction: column; color: #fff; }
    #result.show { display: flex; }
    #result h1 { font-size: 32px; }
    #result button { margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
    #hack-bar { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: 200px; height: 16px; background: #333; border-radius: 8px; overflow: hidden; z-index: 10; display: none; }
    #hack-fill { height: 100%; width: 0%; background: #4ade80; transition: width 0.1s; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Flee the Facility</b><br/>
    Компьютеры: <span id="hacked">0</span> / <span id="total">4</span><br/>
    <span id="status">Взломай все ПК и выберись!</span>
  </div>
  <a id="back" href="../">← Каталог</a>
  <div id="controls">WASD — ход · E — взлом · ПКМ — камера · Q/E поворот</div>
  <div id="hack-bar"><div id="hack-fill"></div></div>
  <div id="result"><h1 id="res-title"></h1><p id="res-text"></p><button id="again">Ещё раз</button></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script>
  (function() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111118);
    scene.fog = new THREE.Fog(0x111118, 8, 30);
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, { distance: 10, pitch: 0.4, lookOffsetY: 1.3 });
    window.addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    scene.add(new THREE.AmbientLight(0x202030, 0.3));
    const playerLight = new THREE.PointLight(0x60a5fa, 0.8, 10);
    scene.add(playerLight);

    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshLambertMaterial({ color: 0x1a1a1a }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);

    // Walls
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x333344 });
    [[-14, 0, 0.5, 28], [14, 0, 0.5, 28], [0, -14, 28, 0.5], [0, 14, 28, 0.5]].forEach(([x, z, w, d]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3, d), wallMat);
      m.position.set(x, 1.5, z); scene.add(m);
    });
    // Interior walls
    [[-5, -5, 0.3, 8], [5, 3, 8, 0.3], [-3, 7, 0.3, 6]].forEach(([x, z, w, d]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3, d), wallMat);
      m.position.set(x, 1.5, z); scene.add(m);
    });

    // Computers
    const PC_POSITIONS = [
      new THREE.Vector3(-8, 0.5, -8),
      new THREE.Vector3(8, 0.5, -6),
      new THREE.Vector3(-8, 0.5, 8),
      new THREE.Vector3(8, 0.5, 8),
    ];
    const pcs = [];
    PC_POSITIONS.forEach((pos) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.6), new THREE.MeshLambertMaterial({ color: 0x4ade80 }));
      m.position.copy(pos); scene.add(m);
      const light = new THREE.PointLight(0x4ade80, 0.3, 4);
      light.position.copy(pos); light.position.y = 1.5; scene.add(light);
      pcs.push({ mesh: m, light, hacked: false, progress: 0 });
    });

    // Exit door
    const exitPos = new THREE.Vector3(0, 1, -13.5);
    const exitMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.3), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
    exitMesh.position.copy(exitPos); scene.add(exitMesh);

    // Beast (hunter bot)
    const beast = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.2, 4, 8), new THREE.MeshLambertMaterial({ color: 0xe11d48 }));
    beast.position.set(0, 1, 0); scene.add(beast);
    const beastLight = new THREE.PointLight(0xe11d48, 0.5, 6);
    scene.add(beastLight);
    let beastTarget = new THREE.Vector3();
    let beastTimer = 0;

    // Player
    const player = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 1, 4, 8), new THREE.MeshLambertMaterial({ color: 0x60a5fa }));
    player.position.set(0, 0.8, 10); scene.add(player);

    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.code] = true);
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    let hacked = 0, gameOver = false, hacking = false, hackingPC = null;

    function startGame() {
      gameOver = false; hacked = 0; hacking = false; hackingPC = null;
      player.position.set(0, 0.8, 10);
      beast.position.set(0, 1, 0);
      pcs.forEach((pc) => { pc.hacked = false; pc.progress = 0; pc.mesh.material.color.setHex(0x4ade80); pc.light.color.setHex(0x4ade80); });
      exitMesh.material.color.setHex(0xef4444);
      document.getElementById("hacked").textContent = 0;
      document.getElementById("status").textContent = "Взломай все ПК и выберись!";
      document.getElementById("hack-bar").style.display = "none";
    }

    function endGame(win, msg) {
      gameOver = true;
      document.getElementById("res-title").textContent = win ? "Сбежал!" : "Пойман!";
      document.getElementById("res-title").style.color = win ? "#4ade80" : "#ef4444";
      document.getElementById("res-text").textContent = msg;
      document.getElementById("result").classList.add("show");
    }

    document.getElementById("again").addEventListener("click", () => {
      document.getElementById("result").classList.remove("show");
      startGame();
    });

    startGame();
    document.getElementById("total").textContent = pcs.length;

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      if (gameOver) { renderer.render(scene, camera); return; }
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Player move
      let mx = 0, mz = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) mz = -1;
      if (keys["KeyS"] || keys["ArrowDown"]) mz = 1;
      if (keys["KeyA"] || keys["ArrowLeft"]) mx = -1;
      if (keys["KeyD"] || keys["ArrowRight"]) mx = 1;
      const speed = hacking ? 0 : 6;
      player.position.x = Math.max(-13, Math.min(13, player.position.x + mx * speed * dt));
      player.position.z = Math.max(-13, Math.min(13, player.position.z + mz * speed * dt));

      // Hack
      if (keys["KeyE"] && !hacking) {
        for (const pc of pcs) {
          if (pc.hacked) continue;
          if (player.position.distanceTo(pc.mesh.position) < 2) {
            hacking = true; hackingPC = pc;
            document.getElementById("hack-bar").style.display = "block";
            break;
          }
        }
      }
      if (hacking && hackingPC) {
        if (!keys["KeyE"] || player.position.distanceTo(hackingPC.mesh.position) > 2.5) {
          hacking = false; hackingPC = null;
          document.getElementById("hack-bar").style.display = "none";
        } else {
          hackingPC.progress += dt * 25;
          document.getElementById("hack-fill").style.width = hackingPC.progress + "%";
          if (hackingPC.progress >= 100) {
            hackingPC.hacked = true;
            hackingPC.mesh.material.color.setHex(0x333333);
            hackingPC.light.color.setHex(0x333333);
            hacked++;
            document.getElementById("hacked").textContent = hacked;
            hacking = false; hackingPC = null;
            document.getElementById("hack-bar").style.display = "none";
            if (hacked >= pcs.length) {
              exitMesh.material.color.setHex(0x4ade80);
              document.getElementById("status").textContent = "Дверь открыта! Беги к выходу!";
            }
          }
        }
      }

      // Check exit
      if (hacked >= pcs.length && player.position.distanceTo(exitPos) < 2) {
        endGame(true, "Ты сбежал из комплекса!");
        return;
      }

      // Beast AI — chase player
      beastTimer -= dt;
      if (beastTimer <= 0) {
        beastTarget.copy(player.position);
        beastTimer = 0.5 + Math.random() * 0.5;
      }
      const bDir = new THREE.Vector3().subVectors(beastTarget, beast.position).normalize();
      const bSpeed = 3.5 + hacked * 0.5;
      beast.position.x += bDir.x * bSpeed * dt;
      beast.position.z += bDir.z * bSpeed * dt;
      beastLight.position.copy(beast.position); beastLight.position.y = 2;

      // Catch
      if (beast.position.distanceTo(player.position) < 1.2) {
        endGame(false, "Тебя поймал охотник!");
        return;
      }

      orbit.follow(player.position);
      playerLight.position.copy(player.position); playerLight.position.y = 3;

      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-hub.js" defer></script>
</body>
</html>
