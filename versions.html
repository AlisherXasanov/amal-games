<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Версии · Игры Амаля</title>
  <meta name="description" content="Переключение версий Игр Амаля: что было в каждой сборке, что лучше оставить." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://alisherxasanov.github.io/amal-games/versions.html" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; font-family: Nunito, system-ui, sans-serif; color: #1e1b4b;
      background: radial-gradient(800px 400px at 0% 0%, #c4b5fd88, transparent),
        linear-gradient(180deg, #ede9fe, #7c3aed55 50%, #312e81);
      padding: 20px 14px 40px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .sub { font-weight: 800; color: #4c1d95; margin: 0 0 14px; font-size: 13px; line-height: 1.4; }
    .active {
      background: #065f46; color: #ecfdf5; font-weight: 900; font-size: 13px;
      padding: 10px 12px; border-radius: 14px; margin-bottom: 14px;
    }
    .card {
      background: rgba(255,255,255,.95); border-radius: 18px; padding: 14px 14px 12px;
      border: 2px solid #c4b5fd; margin-bottom: 10px;
    }
    .card h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .card .when { font-size: 11px; font-weight: 800; color: #6b7280; margin-bottom: 6px; }
    .card ul { margin: 0 0 10px; padding-left: 1.15em; font-weight: 700; font-size: 13px; line-height: 1.4; }
    .verdict { font-size: 12px; font-weight: 900; color: #065f46; margin-bottom: 8px; }
    .verdict.warn { color: #9a3412; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button, a.btn {
      border: 0; border-radius: 12px; padding: 9px 12px; font: 900 12px Nunito, sans-serif;
      cursor: pointer; text-decoration: none; display: inline-block; color: #fff; background: #7c3aed;
    }
    button.on { background: #059669; }
    button.ghost, a.ghost { background: #e0e7ff; color: #312e81; }
    .nav { margin-top: 16px; }
    .nav a { color: #fef3c7; font-weight: 900; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📦 Версии сайта</h1>
    <p class="sub">Выбери сборку как «текущую» — запомнится на этом компьютере. Можно открыть старые ссылки с нужными фичами.</p>
    <div class="active" id="active">Загрузка…</div>
    <div id="list"></div>
    <p class="nav">
      <a href="iskra.html">← Искра</a> ·
      <a href="bugs.html">Баги</a> ·
      <a href="./">Каталог</a>
    </p>
  </div>
  <script>
    (function () {
      var KEY = "amal-site-version-v1";
      var VERSIONS = [
        {
          id: "live",
          name: "Сейчас (live)",
          when: "актуальная",
          best: true,
          verdict: "Лучше оставить как основную — всё свежее.",
          notes: ["Искра в чате", "Blockbust Hard→Mega", "Bed Wars easy-ссылка", "QR 22 кода", "оповещения друзей"],
          open: "./",
        },
        {
          id: "iskra-v1",
          name: "С Искрой + сложностями Blockbust",
          when: "сен 2026 · 5efce1e",
          best: true,
          verdict: "Хорошая «рабочая» точка: Искра + все сложности Blockbust без лёгкого.",
          notes: ["Искра /патруль /проверка", "Hard Extra Extra Hard Mega", "позор только если банят Амаля"],
          open: "friends.html?v=9&stay=1&code=amal-star-friends",
        },
        {
          id: "blockbust-mega",
          name: "Blockbust · до упрощения имён",
          when: "сен 2026 · c202f56",
          best: false,
          verdict: "Ок, если нужны анимации чистки — но имена режимов уже снова на live.",
          notes: ["особые фигуры", "анимации чистки", "смена темы"],
          open: "blockbust/?v=26&diff=mega",
        },
        {
          id: "qr-22",
          name: "QR-листок 22 кода",
          when: "сен 2026 · 2b0a73a",
          best: true,
          verdict: "Оставить для школы: 4 адми + 18 друзей.",
          notes: ["print-qr-22 / print-qr-20", "звезда-админы"],
          open: "print-qr-22.html",
        },
        {
          id: "emo-v3",
          name: "Робот Эмо v3",
          when: "раньше · dec6342",
          best: false,
          verdict: "Оставить как отдельную игру, не как основу сайта.",
          notes: ["игры внутри страницы", "микрофон", "режим Ира"],
          open: "emo-friend/?v=3",
        },
        {
          id: "pre-iskra",
          name: "До Искры",
          when: "до патруля",
          best: false,
          verdict: "Только если нужно сравнить «как было без Искры».",
          notes: ["чат друзей без /искра", "баны без истории Искры"],
          open: "friends.html?v=8&stay=1&code=amal-star-friends",
        },
      ];

      function getActive() {
        try {
          return localStorage.getItem(KEY) || "live";
        } catch (_) {
          return "live";
        }
      }
      function setActive(id) {
        try {
          localStorage.setItem(KEY, id);
        } catch (_) {}
        render();
      }

      function render() {
        var cur = getActive();
        var curV = VERSIONS.find(function (v) { return v.id === cur; }) || VERSIONS[0];
        document.getElementById("active").textContent =
          "Сейчас выбрано: " + curV.name + (curV.best ? " · рекомендуется" : "");
        var list = document.getElementById("list");
        list.innerHTML = "";
        VERSIONS.forEach(function (v) {
          var card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            "<h2>" +
            v.name +
            "</h2><div class='when'>" +
            v.when +
            "</div><div class='verdict" +
            (v.best ? "" : " warn") +
            "'>" +
            v.verdict +
            "</div><ul>" +
            v.notes.map(function (n) { return "<li>" + n + "</li>"; }).join("") +
            "</ul>";
          var row = document.createElement("div");
          row.className = "row";
          var pick = document.createElement("button");
          pick.type = "button";
          pick.textContent = cur === v.id ? "✓ Выбрано" : "Сделать текущей";
          if (cur === v.id) pick.className = "on";
          pick.onclick = function () { setActive(v.id); };
          var open = document.createElement("a");
          open.className = "btn ghost";
          open.href = v.open;
          open.textContent = "Открыть";
          row.appendChild(pick);
          row.appendChild(open);
          card.appendChild(row);
          list.appendChild(card);
        });
      }
      render();
    })();
  </script>
</body>
</html>
