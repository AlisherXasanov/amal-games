<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🧩 Blockbust · для друзей</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0d6e5f" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mint: #14b8a6;
      --deep: #0f766e;
      --ink: #042f2e;
      --gold: #f0b429;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; color: var(--ink);
      font-family: Nunito, system-ui, sans-serif;
      background:
        radial-gradient(900px 480px at 12% -8%, #5eead4, transparent),
        radial-gradient(700px 400px at 100% 0%, #fde68a88, transparent),
        linear-gradient(180deg, #99f6e4, #0d9488 50%, #115e59);
      display: flex; align-items: center; justify-content: center;
      padding: 20px 16px;
    }
    .card {
      width: min(440px, 100%);
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #fff;
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: 0 18px 50px #042f2e55;
      text-align: center;
    }
    .ico { font-size: 3rem; line-height: 1; margin-bottom: 8px; }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 7vw, 2.6rem);
      font-weight: 900;
      color: var(--deep);
    }
    .tag {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      font-weight: 900;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    p {
      margin: 0 0 18px;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.45;
      color: #334155;
    }
    .play {
      display: block;
      width: 100%;
      text-decoration: none;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      color: #422006;
      font: 900 18px Nunito, sans-serif;
      padding: 16px 18px;
      border-radius: 18px;
      border: 3px solid #fff;
      box-shadow: 0 8px 0 #b45309;
      margin-bottom: 10px;
    }
    .play:active { transform: translateY(3px); box-shadow: 0 5px 0 #b45309; }
    .hint {
      margin: 14px 0 0;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">🧩</div>
    <div class="tag">только Blockbust · лёгкий режим</div>
    <h1>Blockbust</h1>
    <p>Одна игра для друга: ставь блоки, чисти линии. Проще фигуры и немного монет на старт. Без остальных игр.</p>
    <a class="play" id="go" href="./blockbust/?v=23&amp;easy=1">Играть сейчас</a>
    <p class="hint">Ссылку можно скопировать из браузера и отправить.</p>
  </div>
  <script>
    (function () {
      try {
        localStorage.setItem("amal-blockbust-easy-v1", "1");
      } catch (_) {}
      var a = document.getElementById("go");
      if (a) a.href = "./blockbust/?v=23&easy=1&from=share";
    })();
  </script>
</body>
</html>
