<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Портал-петля · 2D | Игры Амаля</title>
  <meta name="theme-color" content="#0ea5e9" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#020617;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 0%,#0c4a6e,#020617 68%)}
    canvas{display:block;width:min(1100px,100%);height:auto;max-height:100%;touch-action:none;border-radius:6px;cursor:crosshair}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:12px 14px;border-radius:14px;background:rgba(2,6,23,.92);border:2px solid #38bdf8;font:800 13px/1.45 system-ui;max-width:min(380px,92vw);pointer-events:none}
    #hud .b{color:#7dd3fc}#hud .o{color:#fb923c}
    #toast{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(2,6,23,.96);border:2px solid #38bdf8;font:900 16px system-ui;display:none;text-align:center;max-width:90vw}
    #hint{position:fixed;bottom:14%;left:50%;transform:translateX(-50%);z-index:25;padding:10px 14px;border-radius:12px;background:rgba(2,6,23,.92);border:1px solid #38bdf8;font:700 14px system-ui;display:none;white-space:nowrap}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#0369a1;color:#fff;text-decoration:none;font:800 12px system-ui}
    #gun{position:fixed;top:10px;right:10px;z-index:20;padding:10px 12px;border-radius:12px;background:rgba(2,6,23,.92);border:2px solid #64748b;font:800 12px system-ui}
    #gun.blue{border-color:#38bdf8;color:#7dd3fc}
    #gun.orange{border-color:#fb923c;color:#fdba74}
    #btns{position:fixed;bottom:12px;right:12px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    #btns button{padding:10px 12px;border:0;border-radius:12px;font:800 12px system-ui;cursor:pointer;color:#fff}
    #btn-blue{background:#0284c7}#btn-orange{background:#ea580c}#btn-jump{background:#4f46e5}#btn-reset{background:#64748b}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(56,189,248,.35);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(56,189,248,.5);pointer-events:none}
    @media(pointer:coarse){#pad{display:block}.back{bottom:140px}#btns{bottom:150px}canvas{cursor:default}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud">
    <b>🌀 Портал-петля</b> · ур. <span id="lvl">1</span>/8<br />
    Как Portal, но 2D: <span class="b">синий</span> + <span class="o">оранжевый</span> портал.<br />
    <span style="opacity:.8;font-size:12px">WASD · клик — портал · 1/2 цвет · зайди в портал = выйдешь из другого</span>
  </div>
  <div id="gun" class="blue">пушка: СИНИЙ</div>
  <div id="hint"></div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <div id="pad"><div id="pad-knob"></div></div>
  <div id="btns">
    <button type="button" id="btn-blue">1 синий</button>
    <button type="button" id="btn-orange">2 оранж</button>
    <button type="button" id="btn-jump">прыг</button>
    <button type="button" id="btn-reset">сброс</button>
  </div>
  <script src="./game.js?v=1"></script>
</body>
</html>
