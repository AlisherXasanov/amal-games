<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Компьютер Amal — рабочий стол</title>
  <meta name="description" content="Рабочий стол Windows 7: новые игры, сапёр, подсказки и пожелания Амалю." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="./style.css?v=4" />
</head>
<body>
  <div id="welcome" class="welcome" hidden>
    <div class="welcome-win">
      <div class="welcome-title">🖥️ Компьютер Amal</div>
      <p class="welcome-lede">Подсказки — только сейчас. Потом закроешь и играешь.</p>
      <ul class="welcome-list" id="welcome-list"></ul>
      <div class="welcome-actions">
        <button type="button" class="welcome-go" id="welcome-go">▶ Начать играть</button>
        <button type="button" class="welcome-out" id="welcome-out">✕ Закрыть</button>
      </div>
    </div>
  </div>

  <div id="desktop" class="desktop">
    <header class="taskbar" id="taskbar">
      <button type="button" class="start-btn" id="btn-start" aria-expanded="false">⊞ Пуск</button>
      <div class="task-apps" id="task-apps"></div>
      <a class="task-exit" href="../" id="task-exit" title="Выйти в каталог">← Выйти</a>
      <div class="task-clock" id="clock">12:00</div>
    </header>

    <div id="icons" class="icons" aria-label="Рабочий стол"></div>
    <div id="windows" class="windows"></div>

    <div id="start-menu" class="start-menu" hidden>
      <div class="start-banner">Windows 7</div>
      <div class="start-items" id="start-items"></div>
    </div>
  </div>

  <script src="../shared/amal-owner-powers.js?v=21"></script>
  <script src="./game.js?v=4"></script>
  <script src="../shared/amal-hub.js?v=66"></script>
  <script src="../shared/amal-world-character.js?v=11"></script>
</body>
</html>
