<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>😂 Мемы · Амаль</title>
  <meta name="theme-color" content="#229ed9" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <script>
    (function () {
      var q = "";
      try { q = location.search; } catch (_) {}
      var fromSite = /[?&]from=(phone|tablet|friends|desktop)/.test(q);
      if (/[?&]lock=1/.test(q) && !fromSite) {
        document.documentElement.classList.add("qr-lock");
      } else {
        try { sessionStorage.removeItem("amal-meme-qr-lock"); } catch (_) {}
      }
      document.addEventListener("DOMContentLoaded", function () {
        if (document.documentElement.classList.contains("qr-lock")) {
          document.body.classList.add("qr-lock");
        }
      });
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; font-family: "Segoe UI", system-ui, sans-serif;
      background: #0e1621; color: #fff; display: flex; flex-direction: column;
      max-width: 520px; margin: 0 auto; width: 100%;
    }
    .tg-top {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
      background: #17212b; border-bottom: 1px solid rgba(255,255,255,.06);
      position: sticky; top: 0; z-index: 10;
    }
    .tg-top a.back { color: #6ab2f2; text-decoration: none; font: 700 15px inherit; }
    .tg-top a.qr-link { margin-left: auto; color: #fde68a; font: 800 12px inherit; text-decoration: none; }
    .ver { font: 800 10px inherit; color: #34d399; background: rgba(52,211,153,.15); padding: 3px 8px; border-radius: 999px; }
    .tg-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      display: grid; place-items: center; font-size: 22px;
    }
    .tg-info h1 { font-size: 16px; font-weight: 800; }
    .tg-info p { font-size: 12px; color: #8ba0b5; font-weight: 600; }
    .explain {
      padding: 10px 14px; background: #1a2634;
      font: 700 13px/1.45 inherit; color: #cbd5e1;
    }
    .name-row { display: flex; gap: 8px; padding: 8px 12px; background: #17212b; }
    .name-row input {
      flex: 1; border: 0; border-radius: 12px; padding: 10px 12px;
      background: #242f3d; color: #fff; font: 600 14px inherit;
    }
    .channel-note { text-align: center; padding: 8px 16px; font: 700 12px/1.4 inherit; color: #6ab2f2; }
    .feed {
      flex: 1; overflow-y: auto; padding: 12px 10px 160px;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 30h60M30 0v60' stroke='%23ffffff08'/%3E%3C/svg%3E");
    }
    .post-wrap { clear: both; margin-bottom: 12px; }
    .msg { max-width: 88%; margin-bottom: 4px; }
    .msg.me { float: right; }
    .msg.them { float: left; }
    .bubble {
      padding: 10px 12px; border-radius: 14px;
      font: 600 14px/1.45 inherit; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .msg.them .bubble { background: #182533; border-top-left-radius: 4px; }
    .msg.me .bubble { background: #2b5278; border-top-right-radius: 4px; }
    .bubble.news { background: linear-gradient(135deg, #422006, #713f12) !important; border: 1px solid rgba(251,191,36,.35); }
    .bubble.news .news-tag { font-size: 11px; color: #fde68a; margin-bottom: 4px; }
    .sticker { font-size: 64px; line-height: 1; padding: 4px 8px; background: transparent !important; box-shadow: none !important; }
    .meme-card {
      background: #1e2c3a; border-radius: 12px; overflow: hidden;
      max-width: 260px; border: 1px solid rgba(255,255,255,.08);
    }
    .meme-card .pic { min-height: 100px; display: grid; place-items: center; font-size: 48px; padding: 16px; }
    .meme-card .cap { padding: 8px 10px 10px; font: 800 13px/1.35 inherit; color: #e8edf2; white-space: pre-wrap; }
    .anim-card {
      background: #1e2c3a; border-radius: 12px; overflow: hidden;
      max-width: 280px; border: 1px solid rgba(255,255,255,.08);
    }
    .anim-card canvas { display: block; width: 100%; aspect-ratio: 4/3; background: #bae6fd; }
    .anim-card .cap { padding: 8px 10px 4px; font: 800 13px/1.35 inherit; color: #e8edf2; }
    .anim-card a.watch {
      display: block; text-align: center; padding: 8px; margin: 0 8px 8px;
      border-radius: 10px; background: #2b5278; color: #fff; font: 800 12px inherit; text-decoration: none;
    }
    .video-card {
      background: #1e2c3a; border-radius: 12px; overflow: hidden;
      max-width: 280px; border: 1px solid rgba(255,255,255,.08);
    }
    .video-card .pic {
      min-height: 88px; display: grid; place-items: center; font-size: 42px;
      background: linear-gradient(135deg, #0c4a6e, #1e3a5f);
    }
    .video-card .cap { padding: 8px 10px 10px; font: 800 13px/1.35 inherit; color: #e8edf2; }
    .video-card a.watch {
      display: block; text-align: center; padding: 8px; margin: 0 8px 8px;
      border-radius: 10px; background: #229ed9; color: #fff; font: 800 12px inherit; text-decoration: none;
    }
    .meta { font-size: 10px; color: #6d7f92; margin-top: 3px; clear: both; padding: 0 4px 4px; }
    .composer {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: #17212b; border-top: 1px solid rgba(255,255,255,.06);
    }
    .composer-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .composer-tools button {
      border: 0; border-radius: 10px; padding: 8px 10px;
      background: #242f3d; color: #fff; font: 700 12px inherit; cursor: pointer;
    }
    .composer-tools button.news-btn { background: #422006; color: #fde68a; }
    .composer-row { display: flex; gap: 6px; align-items: center; }
    .composer input {
      flex: 1; border: 0; border-radius: 20px; padding: 10px 14px;
      background: #242f3d; color: #fff; font: 600 14px inherit;
    }
    .composer .send {
      border: 0; border-radius: 50%; width: 40px; height: 40px;
      background: #2b5278; color: #fff; font-size: 18px; cursor: pointer;
    }
    .sticker-bar {
      display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; max-height: 110px; overflow-y: auto;
    }
    .sticker-bar.open { display: flex; }
    .sticker-bar button { border: 0; border-radius: 10px; padding: 6px 8px; background: #242f3d; font-size: 28px; cursor: pointer; }
    .empty-feed {
      text-align: center; padding: 40px 20px; color: #8ba0b5;
      font: 700 14px/1.5 inherit;
    }
    .empty-feed span { font-size: 48px; display: block; margin-bottom: 12px; }
    html.qr-lock .back-link,
    html.qr-lock .print-qr-link,
    body.qr-lock .back-link,
    body.qr-lock .print-qr-link,
    body.qr-lock .explain-exit { display: none !important; }
    html.qr-lock .explain-qr,
    body.qr-lock .explain-qr { display: block !important; }
    .explain-qr { display: none; }
    .exit-games {
      display: none; position: fixed; left: 12px; right: 12px; bottom: calc(118px + env(safe-area-inset-bottom));
      z-index: 9; text-align: center;
    }
    .exit-games a {
      display: inline-block; padding: 12px 20px; border-radius: 999px;
      background: linear-gradient(135deg, #0d6e5f, #047857); color: #fff;
      font: 800 15px inherit; text-decoration: none; box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    html.qr-lock .exit-games,
    body.qr-lock .exit-games { display: none !important; }
    html:not(.qr-lock) .exit-games,
    body:not(.qr-lock) .exit-games { display: block; }
  </style>
</head>
<body>
  <header class="tg-top">
    <a class="back back-link" href="./?stay=1" data-meme-back>← Игры</a>
    <div class="tg-avatar">😂</div>
    <div class="tg-info">
      <h1>Мемы и новости</h1>
      <p>дома · с семьёй и друзьями</p>
    </div>
    <span class="ver">v11</span>
    <a class="qr-link cal-link" href="kind-calendar.html">📅</a>
    <a class="qr-link" href="anim-master.html" title="Кадр — мастер анимаций">🎬</a>
    <a class="qr-link print-qr-link" href="qr-memes.html?print=1">🖨️</a>
  </header>

  <p class="explain explain-exit">💬 <strong>Как Telegram</strong> — кидай мемы, новости и <strong>видео</strong> друзьям. Наши ролики или ссылку.</p>
  <p class="explain explain-qr">📷 <strong>С QR-листка</strong> — только мемы. Кнопки «назад» нет специально. В игры — через сайт на телефоне (не этот QR).</p>

  <div class="name-row">
    <input id="nick" maxlength="16" placeholder="Как тебя зовут?" />
  </div>

  <p class="channel-note" id="net-note">…</p>

  <main class="feed" id="feed"></main>

  <div class="exit-games" id="exit-games">
    <a href="./phone.html?v=2&stay=1" id="exit-games-btn" data-meme-back>🏠 Выйти в игры</a>
  </div>

  <div class="composer">
    <div class="sticker-bar" id="sticker-bar"></div>
    <div class="composer-tools">
      <button type="button" id="btn-stickers">😄 Стикер</button>
      <button type="button" id="btn-news" class="news-btn">📰 Новость</button>
      <button type="button" id="btn-meme">🖼 Мем</button>
      <button type="button" id="btn-anim">🎬 Аним</button>
      <button type="button" id="btn-video">📺 Видео</button>
    </div>
    <div class="composer-row">
      <input type="text" id="msg-input" placeholder="Написать…" maxlength="200" />
      <button type="button" class="send" id="btn-send">➤</button>
    </div>
  </div>

  <script src="./shared/amal-device.js?v=3"></script>
  <script src="./shared/amal-meme-back.js?v=3"></script>
  <script src="./shared/amal-chat-config.js?v=1"></script>
  <script src="./shared/anim-master-ai.js?v=4"></script>
  <script src="./shared/anim-master-scenes-extra.js?v=1"></script>
  <script src="./shared/amal-meme-net.js?v=8"></script>
  <script>
    (function () {
      var feed = document.getElementById("feed");
      var bar = document.getElementById("sticker-bar");
      var myNick = AmalMemeNet.getNick();

      document.getElementById("nick").value = myNick;
      document.getElementById("nick").oninput = function () {
        AmalMemeNet.setNick(this.value);
        myNick = AmalMemeNet.getNick();
      };

      AmalMemeNet.stickers.forEach(function (s) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = s;
        b.onclick = function () {
          if (!ensureNick()) return;
          AmalMemeNet.sendSticker(s);
          bar.classList.remove("open");
        };
        bar.appendChild(b);
      });

      function ensureNick() {
        var n = document.getElementById("nick").value.trim();
        if (!n) { alert("Напиши имя вверху!"); document.getElementById("nick").focus(); return false; }
        AmalMemeNet.setNick(n);
        myNick = n;
        return true;
      }

      function renderPost(p) {
        var wrap = document.createElement("div");
        wrap.className = "post-wrap";
        var msg = document.createElement("div");
        msg.className = "msg " + (p.name === myNick ? "me" : "them");
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        if (p.type === "sticker") {
          bubble.className += " sticker";
          bubble.textContent = p.emoji;
        } else if (p.type === "meme") {
          var card = document.createElement("div");
          card.className = "meme-card";
          card.innerHTML = '<div class="pic" style="background:' + (p.bg || "#334155") + '">' + (p.emoji || "😂") + '</div><div class="cap">' + AmalMemeNet.esc(p.cap || "") + "</div>";
          bubble.appendChild(card);
        } else if (p.type === "anim") {
          var ac = document.createElement("div");
          ac.className = "anim-card";
          var mini = document.createElement("canvas");
          mini.width = 240;
          mini.height = 180;
          ac.appendChild(mini);
          var capEl = document.createElement("div");
          capEl.className = "cap";
          capEl.textContent = p.title || "🎬 Анимация";
          ac.appendChild(capEl);
          if (p.cap) {
            var sub = document.createElement("div");
            sub.className = "cap";
            sub.style.fontWeight = "600";
            sub.style.opacity = "0.85";
            sub.textContent = p.cap;
            ac.appendChild(sub);
          }
          var watch = document.createElement("a");
          watch.className = "watch";
          watch.href = p.href || "anim-master.html";
          watch.textContent = "▶ Смотреть";
          ac.appendChild(watch);
          bubble.appendChild(ac);
          setTimeout(function () {
            if (window.AnimMaster) AnimMaster.playPreview(mini);
          }, 30);
        } else if (p.type === "news") {
          bubble.className += " news";
          bubble.innerHTML = '<div class="news-tag">📰 Новость</div>' + AmalMemeNet.esc(p.text);
        } else if (p.type === "video") {
          var vc = document.createElement("div");
          vc.className = "video-card";
          vc.innerHTML =
            '<div class="pic">' + (p.emoji || "📺") + "</div>" +
            '<div class="cap">' + AmalMemeNet.esc(p.title || "Видео") + "</div>";
          var vwatch = document.createElement("a");
          vwatch.className = "watch";
          vwatch.href = p.url || "#";
          vwatch.textContent = "▶ Смотреть";
          vc.appendChild(vwatch);
          bubble.appendChild(vc);
        } else {
          bubble.style.whiteSpace = "pre-wrap";
          bubble.textContent = p.text;
        }
        msg.appendChild(bubble);
        wrap.appendChild(msg);
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = (p.name || "?") + " · " + AmalMemeNet.fmtTime(p.t);
        wrap.appendChild(meta);
        return wrap;
      }

      function renderAll(posts) {
        feed.innerHTML = "";
        if (!posts.length) {
          feed.innerHTML = '<div class="empty-feed"><span>💬</span>Пока пусто.<br>Напиши имя и отправь первым!</div>';
          return;
        }
        posts.forEach(function (p) { feed.appendChild(renderPost(p)); });
        feed.scrollTop = feed.scrollHeight;
      }

      document.getElementById("btn-send").onclick = function () {
        if (!ensureNick()) return;
        var t = document.getElementById("msg-input").value.trim();
        if (t && AmalMemeNet.sendText(t)) document.getElementById("msg-input").value = "";
      };
      document.getElementById("msg-input").onkeydown = function (e) { if (e.key === "Enter") document.getElementById("btn-send").click(); };
      document.getElementById("btn-stickers").onclick = function () { if (ensureNick()) bar.classList.toggle("open"); };
      document.getElementById("btn-news").onclick = function () {
        if (!ensureNick()) return;
        var t = prompt("📰 Какая новость?", "");
        if (t && t.trim()) AmalMemeNet.sendNews(t.trim());
      };
      document.getElementById("btn-meme").onclick = function () {
        if (!ensureNick()) return;
        var cap = prompt("Текст мема:", "");
        if (!cap || !cap.trim()) return;
        var em = ["🐱", "🎮", "🌊", "🐣", "🍕", "🤣", "💀"];
        AmalMemeNet.sendMeme(em[Math.floor(Math.random() * em.length)], cap.trim());
      };
      document.getElementById("btn-anim").onclick = function () {
        if (!ensureNick()) return;
        if (AmalMemeNet.sendAnim("master-v2", "Мульт от Кадра 🎬", "Нажми «Смотреть» — там мастер анимаций!")) {
          alert("🎬 Анимация в ленте! Нажми «Смотреть» на карточке.");
        }
      };
      document.getElementById("btn-video").onclick = function () {
        if (!ensureNick()) return;
        var pick = prompt(
          "📺 Скинуть видео в канал:\n" +
          "1 — ASMR (баттер, слоники)\n" +
          "2 — Кадр · анимации\n" +
          "3 — Желейная хата\n" +
          "4 — Школьная вечеринка\n" +
          "5 — Своя ссылка (вставь URL)\n\n" +
          "Напиши цифру или ссылку:",
          "1"
        );
        if (!pick || !pick.trim()) return;
        pick = pick.trim();
        var catalog = {
          "1": { title: "🧈 ASMR · баттер и лёд", url: "relax-zone/asmr-watch.html", emoji: "🧈" },
          "2": { title: "🎬 Кадр · анимации", url: "anim-master.html", emoji: "🎬" },
          "3": { title: "🏠 Желейная хата", url: "jelly-lab/", emoji: "🏠" },
          "4": { title: "🏫 Школьная вечеринка", url: "school-party/?from=friends", emoji: "🏫" },
        };
        if (catalog[pick]) {
          var c = catalog[pick];
          AmalMemeNet.sendVideo(c.title, c.url, c.emoji);
          return;
        }
        if (/^https?:\/\//i.test(pick)) {
          AmalMemeNet.sendVideo("📺 Видео от " + myNick, pick, "📺");
          return;
        }
        AmalMemeNet.sendVideo("📺 " + pick.slice(0, 80), pick, "📺");
      };

      AmalMemeNet.init();
      AmalMemeNet.onUpdate(renderAll);
      document.getElementById("net-note").textContent = AmalMemeNet.networkNote();
      var locked = document.documentElement.classList.contains("qr-lock") || document.body.classList.contains("qr-lock");
      if (!locked && window.AmalMemeBack) AmalMemeBack.wire();
    })();
  </script>
</body>
</html>
