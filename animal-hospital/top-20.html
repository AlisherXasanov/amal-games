<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>✦ Топ-20 · лучшие приложения</title>
  <meta name="description" content="20 лучших мини-приложений: игры, рисовалка, бит-пad, оракул и ещё." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./top-20.css?v=1" />
</head>
<body>
  <a class="back" href="./index.html">&larr; Больница</a>
  <div class="glow" aria-hidden="true"></div>

  <div id="hub" class="screen">
    <div class="hub-scroll">
      <p class="brand">✦ Топ-20</p>
      <p class="sub">20 лучших мини-приложений. Игры, музыка, рисовалка, оракул — всё в одном месте.</p>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <div id="play" class="screen" hidden>
    <div class="topbar">
      <button type="button" class="btn ghost" id="btnHub">← Меню</button>
      <span id="playTitle">…</span>
      <span id="playStat"></span>
    </div>
    <canvas id="c" width="960" height="540"></canvas>
    <div class="bubble" id="bubble" hidden></div>
    <div class="ui-extra" id="uiExtra"></div>
  </div>

  <div id="win" class="screen overlay" hidden>
    <div class="win-card">
      <p class="brand">✦ Готово</p>
      <p class="sub" id="winText"></p>
      <p class="code" id="winCode"></p>
      <button type="button" class="btn" id="btnWinHub">В меню</button>
    </div>
  </div>

  <script src="./top-20.js?v=1"></script>
</body>
</html>
