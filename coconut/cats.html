<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Котики · смешные и милые — Игры Амаля</title>
  <meta name="theme-color" content="#1a5c4a" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1f2a24;
      --card: #fffdf8;
      --accent: #2d7a55;
      --warm: #e8a87c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Nunito, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 0%, #ffe8c8 0%, transparent 50%),
        radial-gradient(ellipse at 90% 20%, #c8e8d8 0%, transparent 45%),
        var(--bg);
      padding: 18px 16px 40px;
    }
    a.back {
      display: inline-block;
      margin-bottom: 12px;
      color: var(--accent);
      font-weight: 900;
      text-decoration: none;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      margin: 0 0 6px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }
    .lead {
      margin: 0 0 18px;
      font-weight: 800;
      opacity: 0.8;
      max-width: 36rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      max-width: 900px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid rgba(45, 122, 85, 0.18);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(30, 40, 30, 0.06);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .card:hover { border-color: var(--accent); }
    .pic {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 4rem;
      background: linear-gradient(145deg, #fff6e8, #e8f5ee);
    }
    .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .meta {
      padding: 10px 12px 12px;
      font-weight: 800;
      font-size: 13px;
    }
    .meta small {
      display: block;
      margin-top: 2px;
      font-weight: 700;
      opacity: 0.65;
      font-size: 11px;
    }
    .links {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .links a {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
    }
    .links a.alt {
      background: var(--warm);
      color: #2a1a10;
    }
  </style>
</head>
<body>
  <a class="back" href="./">← К кокосу</a>
  <h1>Котики</h1>
  <p class="lead">Смешные и милые — из режима «Скилл» у кокоса. Жми карточку: откроется случайный котик в новой вкладке.</p>

  <div class="grid" id="grid"></div>

  <div class="links">
    <a href="https://cataas.com/cat" target="_blank" rel="noopener">Случайный котик</a>
    <a class="alt" href="https://cataas.com/cat/cute" target="_blank" rel="noopener">Милый котик</a>
    <a href="https://cataas.com/cat/says/meow" target="_blank" rel="noopener">Котик с надписью</a>
    <a class="alt" href="./">🥥 Вернуться к кокосу</a>
  </div>

  <script>
    (function () {
      var items = [
        { t: "Милый", q: "cute", e: "😻" },
        { t: "Смешной", q: "funny", e: "😹" },
        { t: "Пушистый", q: "fluffy", e: "🐱" },
        { t: "Сонный", q: "sleep", e: "😴" },
        { t: "Удивлённый", q: "wow", e: "🙀" },
        { t: "Обнимашки", q: "hug", e: "🤗" },
        { t: "Сытый", q: "food", e: "🍽️" },
        { t: "Игривый", q: "play", e: "🧶" },
      ];
      var grid = document.getElementById("grid");
      items.forEach(function (it, i) {
        var a = document.createElement("a");
        a.className = "card";
        a.href = "https://cataas.com/cat?" + encodeURIComponent(it.q) + "&" + Date.now() + i;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML =
          '<div class="pic"><img alt="" loading="lazy" src="https://cataas.com/cat?' +
          encodeURIComponent(it.q) +
          "&width=400&height=400&" +
          (Date.now() + i) +
          '" onerror="this.remove();this.parentNode.textContent=\'' +
          it.e +
          '\'" /></div>' +
          '<div class="meta">' +
          it.t +
          " котик<small>открыть ещё →</small></div>";
        grid.appendChild(a);
      });
    })();
  </script>
</body>
</html>
