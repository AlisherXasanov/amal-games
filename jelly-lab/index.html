<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Квартира Валеры</title>
  <meta name="theme-color" content="#f5c93a" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=30" />
</head>
<body>
  <div id="boot">
    <a class="to-catalog" href="../">← Каталог</a>
    <h1>Квартира Валеры</h1>
    <p>Жми «Войти». Гуляй как хочешь — мишки сами разговаривают.</p>
    <p class="hint">WASD · клик по мишке — диалог · зажми мышь — смотреть</p>
    <button type="button" id="startBtn">▶ Войти</button>
  </div>

  <div id="hud" hidden>
    <a class="to-catalog in-game" href="../" id="catalogBtn">← Каталог</a>
    <div class="cross" id="cross" hidden></div>
    <div class="quest" id="quest">…</div>
    <div class="speech" id="speech">…</div>
    <div class="place" id="place">Дом</div>
    <div class="inv" id="inv"></div>
    <p class="help">
      <button type="button" class="look-btn" id="lookBtn">👁 Обзор</button>
      Esc
    </p>
  </div>

  <canvas id="c"></canvas>
  <div id="filmFlash" hidden></div>
  <div id="camHud" hidden>● REC</div>

  <div class="modal" id="expModal" hidden>
    <div class="modal-card">
      <h2>Опыты</h2>
      <div id="expList" class="exp-list"></div>
      <button type="button" id="expClose">Закрыть</button>
    </div>
  </div>

  <div class="modal" id="fridgeModal" hidden>
    <div class="modal-card">
      <h2>Холодильник</h2>
      <div class="fridge-in" id="fridgeIn"></div>
      <p id="fridgeExtra"></p>
      <button type="button" id="fridgeClose">Закрыть</button>
    </div>
  </div>

  <div class="modal" id="peepModal" hidden>
    <div class="modal-card peep-card">
      <h2>Глазок</h2>
      <div class="peep-hole" aria-hidden="true"></div>
      <p id="peepView">…</p>
      <button type="button" id="peepClose">Отойти</button>
    </div>
  </div>

  <div class="modal" id="pcModal" hidden>
    <div class="modal-card pc-card">
      <h2>Компьютер Валеры</h2>
      <div class="pc-bezel">
        <div id="pcScreen" class="pc-screen"></div>
      </div>
      <button type="button" id="pcClose" class="big-close">← Выйти (Esc)</button>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script src="../shared/amal-phone-back.js?v=1"></script>
  <script type="module" src="./game.js?v=30"></script>
</body>
</html>
