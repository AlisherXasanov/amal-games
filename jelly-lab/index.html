<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Желейная хата — своя лаборатория</title>
  <meta name="description" content="Своя 3D-лаборатория: мишки Руби и Лимон, робот Тик, опыты, уход и съёмка роликов без рекламы." />
  <meta name="theme-color" content="#f5c93a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
  <div class="app">
    <header class="top">
      <a href="../">← Каталог</a>
      <h1>Желейная хата</h1>
      <p class="tag">свои герои · не чужой YouTube</p>
    </header>

    <div class="stage-wrap">
      <canvas id="c"></canvas>
      <div class="bubble" id="bubble">Жми действие внизу</div>
      <div class="rec" id="rec" hidden>⏺ СЪЁМКА</div>
    </div>

    <p class="who" id="who">В кадре: Руби</p>

    <div class="actions" id="actions">
      <button type="button" data-act="wake">⏰ Разбудить</button>
      <button type="button" data-act="candy">🍬 Конфета</button>
      <button type="button" data-act="enough">😤 Хватит</button>
      <button type="button" data-act="bath">🛁 Ванна</button>
      <button type="button" data-act="pizza">🍕 Пицца</button>
      <button type="button" data-act="water">💧 Опыт: вода</button>
      <button type="button" data-act="throw">🎾 Кинуть мяч</button>
      <button type="button" data-act="squash">🫧 Антистресс</button>
      <button type="button" data-act="limon">💛 Лимон зайти</button>
      <button type="button" data-act="tik">🤖 Тик помочь</button>
      <button type="button" data-act="film" class="film">🎬 Снять ролик</button>
    </div>

    <p class="note">Руби — красный мишка, Лимон — жёлтый (они спорят), Тик — робот с наушниками. Опыты и уход — свои, без рекламы.</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./game.js?v=1"></script>
</body>
</html>
