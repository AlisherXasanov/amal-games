<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Желейная хата — 3D</title>
  <meta name="theme-color" content="#f5c93a" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=5" />
</head>
<body>
  <div class="app">
    <header class="top">
      <a href="../">← Каталог</a>
      <h1>Желейная хата</h1>
    </header>

    <p class="hint">
      Это <b>3D</b>. Кликай мышкой по мишке и предметам.
      Стрелки ‹ › — другая комната. Внизу инвентарь.
    </p>

    <div class="stage">
      <button type="button" class="nav" id="prev">‹</button>
      <div class="view-wrap">
        <canvas id="c"></canvas>
        <div class="label" id="hoverLabel" hidden></div>
        <div class="speech" id="speech">Кликни по красному мишке</div>
        <div class="room-tag" id="roomTag">Спальня</div>
      </div>
      <button type="button" class="nav" id="next">›</button>
    </div>

    <div class="inv-wrap">
      <b>Инвентарь</b>
      <div class="inv" id="inv"></div>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./game.js?v=5"></script>
</body>
</html>
