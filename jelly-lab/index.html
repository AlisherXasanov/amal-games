<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Желейная хата — Валера дома</title>
  <meta name="theme-color" content="#f5c93a" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=13" />
</head>
<body>
  <div id="boot">
    <h1>Желейная хата</h1>
    <p>Клик по вещи — в инвентарь · ручка двери · желтобрюх не спит · ищи пасхалки</p>
    <p class="hint">WASD — ходить · мышь — смотреть · Esc — закрыть окна / курсор</p>
    <button type="button" id="startBtn">▶ Войти в хату</button>
  </div>

  <div id="hud" hidden>
    <div class="cross" id="cross" hidden></div>
    <div class="speech" id="speech">…</div>
    <div class="place" id="place">Хата</div>
    <div class="inv" id="inv"></div>
    <p class="help">Esc — закрыть · клик снаружи окна тоже</p>
  </div>

  <canvas id="c"></canvas>
  <div id="filmFlash" hidden></div>

  <div class="modal" id="fridgeModal" hidden>
    <div class="modal-card">
      <h2>Холодильник</h2>
      <div class="fridge-in" id="fridgeIn"></div>
      <p id="fridgeExtra"></p>
      <button type="button" id="fridgeClose">Закрыть</button>
    </div>
  </div>

  <div class="modal" id="peepModal" hidden>
    <div class="modal-card peep-card">
      <h2>Глазок</h2>
      <div class="peep-hole" aria-hidden="true"></div>
      <p id="peepView">…</p>
      <button type="button" id="peepClose">Отойти</button>
    </div>
  </div>

  <div class="modal" id="pcModal" hidden>
    <div class="modal-card pc-card">
      <h2>Мой компьютер</h2>
      <div class="pc-bezel">
        <div id="pcScreen" class="pc-screen"></div>
      </div>
      <button type="button" id="pcClose" class="big-close">← Выйти с компа (или Esc)</button>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./game.js?v=13"></script>
</body>
</html>
