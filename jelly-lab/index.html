<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Желейная хата — 2D</title>
  <meta name="theme-color" content="#f5c93a" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=4" />
</head>
<body>
  <div class="app">
    <header class="top">
      <a href="../">← Каталог</a>
      <h1>Желейная хата</h1>
    </header>

    <p class="hint">
      Жми на <b>предметы</b> в комнате. Стрелки — в другую комнату.
      Внизу — <b>инвентарь</b> (что подобрал). Руби будет просить конфетку.
    </p>

    <div class="hud">
      <button type="button" class="arrow" id="prev" aria-label="Назад">‹</button>
      <div class="room-frame">
        <div class="room-name" id="roomName">Спальня</div>
        <div class="room" id="room"></div>
        <div class="speech" id="speech">…</div>
      </div>
      <button type="button" class="arrow" id="next" aria-label="Вперёд">›</button>
    </div>

    <div class="inv-wrap">
      <span class="inv-label">Инвентарь</span>
      <div class="inv" id="inv"></div>
    </div>

    <p class="tip" id="tip">Кликни по Руби или по конфете на полке.</p>
  </div>
  <script src="./game.js?v=4" defer></script>
</body>
</html>
