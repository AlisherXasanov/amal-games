<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Мемы…</title>
  <script src="./shared/amal-device.js?v=2"></script>
</head>
<body>
  <p style="font-family:system-ui;text-align:center;padding:2rem">Открываем мемы…</p>
  <script>
    (function () {
      var dev = AmalDevice.detect();
      var hub = dev;
      try {
        if (AmalDevice.friendsAllowed && AmalDevice.friendsAllowed()) {
          hub = "friends";
        }
      } catch (_) {}
      AmalDevice.remember(dev, hub);
      var url = "./meme-channel.html?v=6&stay=1&from=" + encodeURIComponent(hub);
      location.replace(url);
    })();
  </script>
</body>
</html>
