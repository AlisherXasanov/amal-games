<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Тайга · Тайгун 3D | Игры Амаля</title>
  <meta name="theme-color" content="#14532d" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #0f2918; font-family: "Segoe UI", system-ui, sans-serif; color: #ecfdf5; user-select: none; }
    canvas { display: block; touch-action: none; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 40; max-width: min(300px, 78vw);
      padding: 12px 14px; border-radius: 16px;
      background: rgba(6, 24, 14, .92); border: 2px solid #4ade80;
      font: 700 13px/1.45 system-ui;
    }
    #hud b { color: #bbf7d0; font-size: 15px; }
    #hud .big { font-size: 22px; font-weight: 900; color: #fde68a; }
    #treeBox {
      position: fixed; top: 12px; right: 12px; z-index: 40; width: min(280px, 42vw);
      max-height: 58vh; overflow: auto; padding: 12px; border-radius: 14px;
      background: rgba(6, 24, 14, .92); border: 1px solid #86efac;
      font: 700 12px/1.4 system-ui;
    }
    #treeBox h3 { color: #bbf7d0; margin-bottom: 8px; font-size: 13px; }
    #treeBox .up {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      margin: 0 0 6px; padding: 8px 10px; border: 0; border-radius: 10px;
      background: rgba(255,255,255,.08); color: #fff; font: 700 12px system-ui; cursor: pointer; text-align: left;
    }
    #treeBox .up:hover { background: rgba(74,222,128,.25); }
    #treeBox .cost { color: #fde68a; white-space: nowrap; }
    #prompt {
      position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%); z-index: 40;
      padding: 10px 16px; border-radius: 12px; display: none;
      background: rgba(0,0,0,.8); border: 2px solid #4ade80; font: 800 14px system-ui; white-space: nowrap;
    }
    #toast {
      position: fixed; top: 36%; left: 50%; transform: translate(-50%,-50%); z-index: 50;
      padding: 12px 20px; border-radius: 14px; display: none; pointer-events: none;
      background: rgba(10,30,18,.95); border: 2px solid #86efac; font: 900 16px system-ui; text-align: center; max-width: 90vw;
    }
    #tip {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
      padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,.65);
      font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,.15); text-align: center; max-width: 92vw;
    }
    .top-bar { position: fixed; top: auto; bottom: 12px; left: 12px; z-index: 45; display: flex; gap: 8px; }
    .top-bar a, .top-bar button {
      padding: 8px 12px; border-radius: 12px; border: 0; font: 800 12px system-ui;
      cursor: pointer; text-decoration: none; color: #fff; background: linear-gradient(135deg,#16a34a,#15803d);
    }
    #pad {
      position: fixed; bottom: 18px; right: 14px; z-index: 45; display: none;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); touch-action: none;
    }
    #pad-knob {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
      border-radius: 50%; background: rgba(134,239,172,.55); pointer-events: none;
    }
    #act-btns {
      position: fixed; bottom: 150px; right: 22px; z-index: 45; display: none;
    }
    #act-btns button {
      width: 64px; height: 64px; border-radius: 50%; border: 0;
      background: rgba(34,197,94,.6); color: #fff; font: 900 14px system-ui;
    }
    @media (pointer: coarse) {
      #pad, #act-btns { display: block; }
      #treeBox { width: min(240px, 48vw); max-height: 40vh; top: 56px; }
      #tip { display: none; }
      .top-bar { bottom: auto; top: 12px; left: 12px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <b>🌲 Тайга · Тайгун</b><br />
    🪵 <span class="big" id="wood">0</span> · 🫐 <span id="berry">0</span><br />
    ⚡ <span id="speed">1</span> · сбор ×<span id="gather">1</span><br />
    Лагерь: +<span id="camp">0</span>/с
  </div>
  <div id="treeBox">
    <h3>🌳 Дерево прокачки</h3>
    <div id="upList"></div>
  </div>
  <div class="top-bar">
    <a href="../index.html">← Каталог</a>
  </div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="tip">WASD · E собрать у дерева/куста · ПКМ камера · качай дерево справа</div>
  <div id="pad"><div id="pad-knob"></div></div>
  <div id="act-btns"><button type="button" id="btn-e">E</button></div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js?v=1"></script>
</body>
</html>
