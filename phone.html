<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Игры Амаля · телефон</title>
  <meta name="theme-color" content="#0d6e5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./shared/amal-hub-ui.css?v=1" />
  <script src="./shared/amal-device.js?v=1"></script>
</head>
<body>
  <div class="hub" id="hub-root">
    <div id="device-switcher-slot"></div>
    <div class="top">
      <h1>📱 Игры Амаля</h1>
      <p class="device-tag" id="device-tag">Версия для телефона</p>
    </div>

    <nav class="tabs" id="tabs">
      <button type="button" class="tab on" data-tab="home">🏠</button>
      <button type="button" class="tab" data-tab="games">🎮</button>
      <button type="button" class="tab" data-tab="mila">🐣</button>
      <button type="button" class="tab" data-tab="d3">🧊</button>
      <button type="button" class="tab" data-tab="memes">😂</button>
      <button type="button" class="tab" data-tab="chat">💬</button>
    </nav>

    <section class="panel on" id="panel-home">
      <p class="tip">Полные игры · не урезанные. 3D 🔒 — только на ПК.</p>
      <div class="cat-grid">
        <button type="button" class="cat-btn games" data-go="games"><span>🎮</span>Игры для телефона</button>
        <button type="button" class="cat-btn mila" data-go="mila"><span>🐣</span>Милашки</button>
        <button type="button" class="cat-btn d3" data-go="d3"><span>🧊</span>3D 🔒</button>
        <button type="button" class="cat-btn chat" data-go="chat"><span>💬</span>Чат класса</button>
        <a class="cat-btn" href="meme-channel.html?v=2" style="text-decoration:none;color:inherit;background:linear-gradient(145deg,#229ed9,#17212b)"><span>😂</span>Мемы</a>
      </div>
    </section>

    <section class="panel" id="panel-games">
      <input class="search" id="search-games" type="search" placeholder="🔍 Найти игру…" />
      <div class="game-grid" id="list-games"></div>
    </section>

    <section class="panel" id="panel-mila">
      <div class="game-grid" id="list-mila"></div>
    </section>

    <section class="panel" id="panel-d3">
      <p class="tip">🔒 Bed Wars и 3D на телефоне не работают — нужен компьютер.</p>
      <div class="game-grid" id="list-d3"></div>
    </section>

    <section class="panel" id="panel-memes">
      <p class="tip">Канал как в Телеграме — мемы и стикеры от Амаля 😄</p>
      <a class="cat-btn" href="meme-channel.html?v=2" style="display:block;text-align:center;text-decoration:none;color:inherit;padding:16px;border-radius:16px;background:linear-gradient(145deg,#229ed9,#0e1621);font-weight:800">😂 Открыть канал мемов</a>
    </section>

    <section class="panel" id="panel-chat">
      <div id="chat-root"></div>
    </section>

    <div class="bottom-links">
      <a href="./?stay=1">💻 ПК</a>
      <a href="tablet.html?v=1&stay=1">📟 Планшет</a>
      <a href="qr-school.html">QR класс</a>
      <a href="qr-scanner.html">📷 Сканер</a>
    </div>
  </div>

  <script src="./shared/amal-hub-data.js?v=1"></script>
  <script src="./shared/amal-device-switcher.js?v=2"></script>
  <script>
    AmalDevice.setHub("phone");
    AmalDevice.remember("phone", "phone");
    AmalHubUI.init({ from: "phone", d3Playable: false });
    AmalDeviceSwitcher.mount("device-switcher-slot");
  </script>
  <script src="./shared/amal-chat-config.js?v=1"></script>
  <script src="./shared/amal-class-chat.js?v=1"></script>
  <script src="./shared/amal-pwa.js?v=2" defer></script>
</body>
</html>
