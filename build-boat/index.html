<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build a Boat 3D</title>
  <meta name="description" content="3D Build a Boat — построй лодку и плыви!" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a2540; font-family: system-ui, sans-serif; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 14px; line-height: 1.6; }
    #back { position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px; background: rgba(0,0,0,.5); color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
    #build-panel { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
    #build-panel button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; color: #fff; background: #0ea5e9; }
    #build-panel .btn-go { background: #16a34a; }
    #result { position: fixed; inset: 0; display: none; z-index: 20; background: rgba(0,0,0,.85); align-items: center; justify-content: center; flex-direction: column; color: #fff; }
    #result.show { display: flex; }
    #result h1 { font-size: 28px; color: #4ade80; }
    #result button { margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Build a Boat</b><br/>
    Блоки: <span id="blocks">0</span><br/>
    Расстояние: <span id="dist">0</span>м<br/>
    Монеты: <span id="coins">0</span>
  </div>
  <a id="back" href="../">← Каталог</a>
  <div id="build-panel">
    <button id="add-wood">+ Дерево</button>
    <button id="add-metal">+ Металл</button>
    <button id="add-rocket">+ Ракета</button>
    <button id="go" class="btn-go">Плыть!</button>
  </div>
  <div id="result"><h1 id="res-title"></h1><p id="res-text"></p><button id="again">Ещё раз</button></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (function() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0ea5e9);
    scene.fog = new THREE.Fog(0x0ea5e9, 20, 80);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    window.addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    const sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(5, 15, 5); scene.add(sun);
    scene.add(new THREE.AmbientLight(0x406080, 0.4));

    // Water
    const water = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x0284c7, transparent: true, opacity: 0.8 }));
    water.rotation.x = -Math.PI / 2; water.position.y = -0.5; scene.add(water);

    // Boat base
    const boatGroup = new THREE.Group();
    scene.add(boatGroup);
    const hull = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 4), new THREE.MeshLambertMaterial({ color: 0x92400e }));
    hull.position.y = 0; boatGroup.add(hull);

    let boatBlocks = [];
    let blockCount = 0, totalHP = 5, speed = 3, sailing = false, distance = 0, coins = 0;
    let obstacles = [];

    function addBlock(type) {
      if (sailing) return;
      const colors = { wood: 0xd97706, metal: 0x6b7280, rocket: 0xef4444 };
      const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: colors[type] }));
      const row = Math.floor(blockCount / 3);
      const col = blockCount % 3;
      mesh.position.set(-0.8 + col * 0.8, 0.6 + row * 0.8, 0);
      boatGroup.add(mesh);
      boatBlocks.push({ mesh, type });
      blockCount++;
      if (type === "wood") totalHP += 3;
      else if (type === "metal") totalHP += 8;
      else if (type === "rocket") speed += 2;
      document.getElementById("blocks").textContent = blockCount;
    }

    function spawnObstacle() {
      const geo = new THREE.BoxGeometry(1 + Math.random() * 2, 1.5, 1 + Math.random() * 2);
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0x4a4a4a }));
      mesh.position.set((Math.random() - 0.5) * 10, 0, boatGroup.position.z - 30 - Math.random() * 20);
      scene.add(mesh);
      obstacles.push(mesh);
    }

    function startSail() {
      if (sailing || blockCount === 0) return;
      sailing = true;
      distance = 0;
      obstacles.forEach((o) => scene.remove(o));
      obstacles = [];
      for (let i = 0; i < 15; i++) spawnObstacle();
    }

    function endRun() {
      sailing = false;
      const earned = Math.floor(distance * 2);
      coins += earned;
      document.getElementById("coins").textContent = coins;
      document.getElementById("res-title").textContent = `Проплыл ${Math.floor(distance)}м!`;
      document.getElementById("res-text").textContent = `Заработано: ${earned} монет`;
      document.getElementById("result").classList.add("show");
    }

    document.getElementById("add-wood").addEventListener("click", () => addBlock("wood"));
    document.getElementById("add-metal").addEventListener("click", () => addBlock("metal"));
    document.getElementById("add-rocket").addEventListener("click", () => addBlock("rocket"));
    document.getElementById("go").addEventListener("click", startSail);
    document.getElementById("again").addEventListener("click", () => {
      document.getElementById("result").classList.remove("show");
      // Reset boat
      boatBlocks.forEach((b) => boatGroup.remove(b.mesh));
      boatBlocks = []; blockCount = 0; totalHP = 5; speed = 3;
      boatGroup.position.set(0, 0, 0);
      document.getElementById("blocks").textContent = 0;
    });

    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.code] = true);
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (sailing) {
        // Move forward
        boatGroup.position.z -= speed * dt;
        distance += speed * dt;
        document.getElementById("dist").textContent = Math.floor(distance);

        // Steer
        if (keys["KeyA"] || keys["ArrowLeft"]) boatGroup.position.x -= 4 * dt;
        if (keys["KeyD"] || keys["ArrowRight"]) boatGroup.position.x += 4 * dt;
        boatGroup.position.x = Math.max(-6, Math.min(6, boatGroup.position.x));

        // Bob
        boatGroup.position.y = Math.sin(now * 0.003) * 0.15;
        boatGroup.rotation.z = Math.sin(now * 0.002) * 0.03;

        // Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          if (o.position.z > boatGroup.position.z + 10) { scene.remove(o); obstacles.splice(i, 1); continue; }
          const dx = Math.abs(o.position.x - boatGroup.position.x);
          const dz = Math.abs(o.position.z - boatGroup.position.z);
          if (dx < 1.5 && dz < 1.5) {
            totalHP -= 3;
            scene.remove(o); obstacles.splice(i, 1);
            if (totalHP <= 0) { endRun(); return; }
          }
        }

        // Spawn more
        if (obstacles.length < 10) spawnObstacle();

        // Water scroll illusion
        water.position.z = boatGroup.position.z;
      }

      // Camera
      camera.position.lerp(
        new THREE.Vector3(boatGroup.position.x, 5.5, boatGroup.position.z + 12),
        0.1
      );
      camera.lookAt(boatGroup.position.x, boatGroup.position.y + 1, boatGroup.position.z);

      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-hub.js" defer></script>
</body>
</html>
