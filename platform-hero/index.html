<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Прыг-Герой · Kenney 2D | Игры Амаля</title>
  <meta name="theme-color" content="#3b82f6" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,sans-serif;color:#e2e8f0;user-select:none;-webkit-user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1e3a5f,#0b1220 70%)}
    canvas{display:block;width:100%;height:100%;max-width:1100px;max-height:100%;image-rendering:pixelated;touch-action:none;background:#87ceeb}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:10px 12px;border-radius:14px;background:rgba(8,15,30,.88);border:2px solid #60a5fa;font:800 13px/1.35 system-ui;pointer-events:none}
    #hud .big{font-size:20px;color:#fde68a}
    #toast{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(10,20,40,.95);border:2px solid #93c5fd;font:900 16px system-ui;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font:800 12px system-ui}
    #credits{position:fixed;bottom:12px;right:12px;z-index:20;font:600 10px system-ui;opacity:.55;max-width:36vw;text-align:right}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(96,165,250,.55);pointer-events:none}
    #btn-jump{position:fixed;bottom:28px;right:22px;z-index:25;display:none;width:74px;height:74px;border-radius:50%;border:0;background:rgba(37,99,235,.72);color:#fff;font:900 13px system-ui}
    #btn-ai{position:fixed;top:12px;right:12px;z-index:40;padding:10px 12px;border-radius:14px;border:2px solid #93c5fd;background:rgba(30,58,138,.92);color:#fff;font:900 12px system-ui;cursor:pointer}
    #btn-restart{position:fixed;top:56px;right:12px;z-index:40;padding:8px 12px;border-radius:12px;border:2px solid #fda4af;background:rgba(127,29,29,.92);color:#fff;font:800 12px system-ui;cursor:pointer}
    #ai-panel{position:fixed;top:12px;right:12px;z-index:45;width:min(280px,86vw);display:none;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:rgba(10,20,40,.96);border:2px solid #93c5fd;box-shadow:0 12px 40px rgba(0,0,0,.45)}
    #ai-panel.open{display:flex}
    #ai-screen{height:96px;border-radius:12px;background:linear-gradient(180deg,#0f172a,#1e3a5f);border:3px solid #64748b;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font:900 28px system-ui}
    #ai-name{position:absolute;left:8px;bottom:6px;font:800 11px system-ui;color:#bfdbfe}
    #ai-log{height:110px;overflow:auto;font:600 12px/1.35 system-ui;padding:6px;border-radius:10px;background:rgba(0,0,0,.35)}
    #ai-log .me{color:#93c5fd;margin:0 0 6px}
    #ai-log .bot{color:#fde68a;margin:0 0 6px}
    #ai-row{display:flex;gap:6px}
    #ai-input{flex:1;padding:8px;border-radius:10px;border:1px solid #3b82f6;background:#0f172a;color:#fff;font:600 13px system-ui}
    #ai-send,#ai-close{padding:8px 10px;border:0;border-radius:10px;background:#2563eb;color:#fff;font:800 12px system-ui;cursor:pointer}
    #ai-close{background:#475569}
    #ai-quick{display:flex;flex-wrap:wrap;gap:4px}
    #ai-quick button{padding:5px 8px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#dbeafe;font:700 11px system-ui;cursor:pointer}
    @media(pointer:coarse){#pad,#btn-jump{display:block}#credits{display:none}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud"><b>🦸 Прыг-Герой</b><br />💰 <span class="big" id="coins">0</span> · ур. <span id="lvl">1</span>/<span id="lvlt">8</span> · ❤️ <span id="hp">3</span><br />двойной прыжок · боссы</div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <div id="credits">Kenney New Platformer Pack · CC0</div>
  <button type="button" id="btn-ai">💬 Ишка</button>
  <button type="button" id="btn-restart">↻ Рестарт</button>
  <div id="ai-panel">
    <div id="ai-screen">🧠<div id="ai-name">Ишка · помощница уровней</div></div>
    <div id="ai-log"></div>
    <div id="ai-quick">
      <button type="button" data-q="как пройти">как пройти</button>
      <button type="button" data-q="почему слизь">почему слизь</button>
      <button type="button" data-q="босс">босс</button>
      <button type="button" data-q="дома">дома</button>
    </div>
    <div id="ai-row">
      <input id="ai-input" type="text" placeholder="Спроси Ишку…" maxlength="120" />
      <button type="button" id="ai-send">▶</button>
      <button type="button" id="ai-close">✕</button>
    </div>
  </div>
  <div id="pad"><div id="pad-knob"></div></div>
  <button type="button" id="btn-jump">прыг</button>
  <script src="./game.js?v=2"></script>
</body>
</html>
