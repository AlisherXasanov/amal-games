<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Прыг-Герой · Kenney 2D | Игры Амаля</title>
  <meta name="theme-color" content="#3b82f6" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#0b1220;font-family:"Segoe UI",system-ui,sans-serif;color:#e2e8f0;user-select:none;-webkit-user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1e3a5f,#0b1220 70%)}
    canvas{display:block;width:100%;height:100%;max-width:1100px;max-height:100%;image-rendering:pixelated;touch-action:none;background:#87ceeb}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:10px 12px;border-radius:14px;background:rgba(8,15,30,.88);border:2px solid #60a5fa;font:800 13px/1.35 system-ui;pointer-events:none}
    #hud .big{font-size:20px;color:#fde68a}
    #toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(10,20,40,.95);border:2px solid #93c5fd;font:900 16px system-ui;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font:800 12px system-ui}
    #credits{position:fixed;bottom:12px;right:12px;z-index:20;font:600 10px system-ui;opacity:.55;max-width:40vw;text-align:right}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(96,165,250,.55);pointer-events:none}
    #btn-jump{position:fixed;bottom:28px;right:22px;z-index:25;display:none;width:78px;height:78px;border-radius:50%;border:0;background:rgba(37,99,235,.72);color:#fff;font:900 15px system-ui;box-shadow:0 6px 0 rgba(0,0,0,.25)}
    @media(pointer:coarse){#pad,#btn-jump{display:block}#credits{display:none}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud"><b>🦸 Прыг-Герой</b><br />💰 <span class="big" id="coins">0</span> · ур. <span id="lvl">1</span>/<span id="lvlt">5</span> · ❤️ <span id="hp">3</span></div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <div id="credits">Kenney New Platformer Pack · CC0</div>
  <div id="pad"><div id="pad-knob"></div></div>
  <button type="button" id="btn-jump">прыг</button>
  <script src="./game.js?v=1"></script>
</body>
</html>
