<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Нить сна</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=6" />
</head>
<body>
  <a class="portal-back" href="../">&larr; Все игры</a>

  <div id="app">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>

    <div id="hud" class="hud hidden">
      <span id="stitches">Нити: 0/5</span>
      <span id="msg">Ты управляешь · стрелки / WASD / клик</span>
      <button type="button" id="menu-btn" class="menu-btn">Меню</button>
    </div>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1 id="title">Нить сна</h1>
        <p id="blurb">
          <strong>Ты ходишь сам</strong> — стрелки внизу, WASD или клик по карте.<br />
          Собери фиолетовые нити, потом коснись зелёного <strong>УТРО</strong>.<br />
          От тени — кнопка <strong>РЫВОК</strong>.
        </p>
        <button type="button" id="start-btn" class="btn big">НАЧАТЬ</button>
        <p class="alt">Админ-силы хозяина · кнопка <strong>Меню</strong> в игре</p>
      </div>
    </div>

    <div id="controls" class="controls hidden">
      <div class="pad">
        <button type="button" data-dir="up">↑</button>
        <div class="row">
          <button type="button" data-dir="left">←</button>
          <button type="button" data-dir="down">↓</button>
          <button type="button" data-dir="right">→</button>
        </div>
      </div>
      <button type="button" id="dash-btn" class="dash-btn">РЫВОК</button>
    </div>
  </div>

  <script src="../shared/amal-owner-powers.js?v=21"></script>
  <script src="./game.js?v=6"></script>
  <script src="../shared/amal-hub.js?v=66"></script>
  <script src="../shared/amal-world-character.js?v=28"></script>
</body>
</html>
