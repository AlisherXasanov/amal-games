<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Мозг в колбе · Ишка | Игры Амаля</title>
  <meta name="theme-color" content="#6d28d9" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#12081f;font-family:system-ui,sans-serif;color:#ede9fe;user-select:none;-webkit-user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 15%,#2e1065,#12081f 70%)}
    canvas{display:block;width:100%;height:100%;max-width:1100px;max-height:100%;image-rendering:pixelated;touch-action:none;background:#1a1030}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:10px 12px;border-radius:14px;background:rgba(20,8,40,.9);border:2px solid #a78bfa;font:800 13px/1.35 system-ui;pointer-events:none}
    #hud .big{font-size:18px;color:#f0abfc}
    #toast{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(30,10,50,.95);border:2px solid #c4b5fd;font:900 15px system-ui;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#7c3aed;color:#fff;text-decoration:none;font:800 12px system-ui}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(167,139,250,.55);pointer-events:none}
    #btn-jump{position:fixed;bottom:108px;right:18px;z-index:25;display:none;width:66px;height:66px;border-radius:50%;border:0;background:rgba(124,58,237,.75);color:#fff;font:900 12px system-ui}
    #btn-e{position:fixed;bottom:28px;right:18px;z-index:25;display:none;width:66px;height:66px;border-radius:50%;border:0;background:rgba(236,72,153,.75);color:#fff;font:900 13px system-ui}
    #btn-ai{position:fixed;top:12px;right:12px;z-index:40;padding:10px 12px;border-radius:14px;border:2px solid #f0abfc;background:rgba(88,28,135,.92);color:#fff;font:900 12px system-ui;cursor:pointer}
    #btn-restart{position:fixed;top:56px;right:12px;z-index:40;padding:8px 12px;border-radius:12px;border:2px solid #fda4af;background:rgba(127,29,29,.9);color:#fff;font:800 12px system-ui;cursor:pointer;display:none}
    #ai-panel{position:fixed;top:12px;right:12px;z-index:45;width:min(280px,86vw);display:none;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:rgba(24,10,48,.96);border:2px solid #c4b5fd;box-shadow:0 12px 40px rgba(0,0,0,.45)}
    #ai-panel.open{display:flex}
    #ai-screen{height:110px;border-radius:12px;background:linear-gradient(180deg,#1e1b4b,#312e81);border:3px solid #64748b;position:relative;overflow:hidden}
    #ai-screen canvas{width:100%!important;height:100%!important;max-width:none;image-rendering:auto}
    #ai-name{position:absolute;left:8px;bottom:6px;font:800 11px system-ui;color:#f5d0fe;text-shadow:0 1px 2px #000}
    #ai-log{height:120px;overflow:auto;font:600 12px/1.35 system-ui;padding:6px;border-radius:10px;background:rgba(0,0,0,.35)}
    #ai-log .me{color:#93c5fd;margin:0 0 6px}
    #ai-log .bot{color:#f9a8d4;margin:0 0 6px}
    #ai-row{display:flex;gap:6px}
    #ai-input{flex:1;padding:8px;border-radius:10px;border:1px solid #7c3aed;background:#1e1035;color:#fff;font:600 13px system-ui}
    #ai-send,#ai-close,#ai-mic{padding:8px 10px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font:800 12px system-ui;cursor:pointer}
    #ai-mic{background:#db2777}
    #ai-close{background:#475569}
    #ai-quick{display:flex;flex-wrap:wrap;gap:4px}
    #ai-quick button{padding:5px 8px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#e9d5ff;font:700 11px system-ui;cursor:pointer}
    @media(pointer:coarse){#pad,#btn-jump,#btn-e{display:block}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud"><b>🧪 Мозг в колбе</b><br />ур. <span class="big" id="lvl">1</span>/<span id="lvlt">8</span> · ❤️ <span id="hp">3</span> · прыжков <span id="jumps">2</span><br /><span id="carry">колба на столе</span></div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <button type="button" id="btn-ai">💬 Ишка</button>
  <button type="button" id="btn-restart">↻ Рестарт</button>
  <div id="ai-panel" aria-label="Чат с Ишкой">
    <div id="ai-screen"><canvas id="ai-face" width="260" height="110"></canvas><div id="ai-name">Ишка · мозг в колбе</div></div>
    <div id="ai-log"></div>
    <div id="ai-quick">
      <button type="button" data-q="привет">привет</button>
      <button type="button" data-q="что дома делать">дома</button>
      <button type="button" data-q="как пройти">как пройти</button>
      <button type="button" data-q="кто ты">кто ты</button>
    </div>
    <div id="ai-row">
      <input id="ai-input" type="text" placeholder="Спроси Ишку…" maxlength="120" />
      <button type="button" id="ai-send">▶</button>
      <button type="button" id="ai-mic" title="Микрофон">🎤</button>
      <button type="button" id="ai-close">✕</button>
    </div>
  </div>
  <div id="pad"><div id="pad-knob"></div></div>
  <button type="button" id="btn-jump">прыг</button>
  <button type="button" id="btn-e">E</button>
  <script src="./game.js?v=2"></script>
</body>
</html>
