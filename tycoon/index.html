<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Tycoon 3D</title>
  <meta name="description" content="3D Tycoon — строй свою пиццерию и зарабатывай!" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 14px; line-height: 1.6; }
    #shop { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #shop button { padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; color: #fff; background: #16a34a; }
    #shop button:disabled { opacity: .4; }
    #back { position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px; background: rgba(0,0,0,.5); color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Pizza Tycoon</b><br/>
    Деньги: $<span id="money">0</span><br/>
    Пиццы/сек: <span id="pps">0</span><br/>
    Уровень: <span id="level">1</span>
  </div>
  <a id="back" href="../">← Каталог</a>
  <div id="shop">
    <button id="b-table">Стол ($5)</button>
    <button id="b-oven">Печь ($25)</button>
    <button id="b-worker">Работник ($100)</button>
    <button id="b-delivery">Доставка ($200)</button>
    <button id="b-advert">Реклама ($500)</button>
    <button id="b-expand">Расширить ($1000)</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script>
  (function() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 10, 16);
    camera.lookAt(0, 1, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 18,
      pitch: 0.5,
      minDist: 8,
      maxDist: 40,
    });
    window.addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(8, 15, 8); scene.add(sun);
    scene.add(new THREE.AmbientLight(0x606080, 0.5));

    // Ground
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshLambertMaterial({ color: 0x4ade80 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    // Building base
    const building = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 4), new THREE.MeshLambertMaterial({ color: 0xfbbf24 }));
    building.position.set(0, 1, 0); building.castShadow = true; scene.add(building);
    // Roof
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.5, 1.5, 4), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
    roof.position.set(0, 2.75, 0); roof.rotation.y = Math.PI / 4; scene.add(roof);

    let money = 5, pps = 1, level = 1;
    let tables = 0, ovens = 0, workers = 0, deliveries = 0, adverts = 0, expansions = 0;
    const objects3d = [];

    function addTable() {
      // Низкий стол, не столб
      const top = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 0.12, 1.0),
        new THREE.MeshLambertMaterial({ color: 0xd6a35a })
      );
      top.position.set(-4 + (tables % 5) * 1.6, 0.55, 3 + Math.floor(tables / 5) * 1.4);
      top.castShadow = true;
      scene.add(top);
      objects3d.push(top);
      for (const [ox, oz] of [[-0.55, -0.35], [0.55, -0.35], [-0.55, 0.35], [0.55, 0.35]]) {
        const leg = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.05, 0.5, 6),
          new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
        );
        leg.position.set(top.position.x + ox, 0.25, top.position.z + oz);
        scene.add(leg);
        objects3d.push(leg);
      }
    }
    function addOven() {
      // Широкая низкая печь, не столб
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.7, 0.9),
        new THREE.MeshLambertMaterial({ color: 0x6b7280 })
      );
      body.position.set(-3 + (ovens % 4) * 1.5, 0.35, -4 - Math.floor(ovens / 4) * 1.4);
      body.castShadow = true;
      scene.add(body);
      objects3d.push(body);
      const door = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.35, 0.08),
        new THREE.MeshLambertMaterial({ color: 0xf97316 })
      );
      door.position.set(body.position.x, 0.4, body.position.z + 0.48);
      scene.add(door);
      objects3d.push(door);
    }
    function addWorker() {
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 0.8, 4, 8), new THREE.MeshLambertMaterial({ color: 0x3b82f6 }));
      m.position.set(3 + (workers % 3) * 1.2, 0.65, -2 - Math.floor(workers / 3) * 1.2);
      m.castShadow = true; scene.add(m); objects3d.push(m);
    }
    function addDelivery() {
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xfb923c }));
      m.position.set(-5 + deliveries * 2, 0.4, 5);
      m.castShadow = true; scene.add(m); objects3d.push(m);
    }

    function updateUI() {
      document.getElementById("money").textContent = Math.floor(money);
      document.getElementById("pps").textContent = pps.toFixed(1);
      document.getElementById("level").textContent = level;
      document.getElementById("b-table").disabled = money < 5;
      document.getElementById("b-oven").disabled = money < 25;
      document.getElementById("b-worker").disabled = money < 100;
      document.getElementById("b-delivery").disabled = money < 200;
      document.getElementById("b-advert").disabled = money < 500;
      document.getElementById("b-expand").disabled = money < 1000;
    }

    document.getElementById("b-table").addEventListener("click", () => {
      if (money >= 5) { money -= 5; tables++; pps += 0.3; addTable(); updateUI(); }
    });
    document.getElementById("b-oven").addEventListener("click", () => {
      if (money >= 25) { money -= 25; ovens++; pps += 0.8; addOven(); updateUI(); }
    });
    document.getElementById("b-worker").addEventListener("click", () => {
      if (money >= 100) { money -= 100; workers++; pps += 1.5; addWorker(); updateUI(); }
    });
    document.getElementById("b-delivery").addEventListener("click", () => {
      if (money >= 200) { money -= 200; deliveries++; pps += 3; addDelivery(); updateUI(); }
    });
    document.getElementById("b-advert").addEventListener("click", () => {
      if (money >= 500) { money -= 500; adverts++; pps *= 1.3; updateUI(); }
    });
    document.getElementById("b-expand").addEventListener("click", () => {
      if (money >= 1000) {
        money -= 1000; expansions++; level++; pps *= 1.5;
        building.scale.x += 0.3; building.scale.z += 0.3;
        roof.scale.x += 0.3; roof.scale.z += 0.3;
        updateUI();
      }
    });

    updateUI();
    // Стартовый стол уже куплен визуально — игрок сразу видит дешёвый предмет
    addTable();
    tables = 1;

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      money += pps * dt;
      if (Math.floor(now / 500) % 2 === 0) updateUI();

      // Animate workers bobbing
      objects3d.forEach((o, i) => { o.position.y += Math.sin(now * 0.003 + i) * 0.001; });

      orbit.lookAt(0, 1, 0);
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-hub.js" defer></script>
</body>
</html>
