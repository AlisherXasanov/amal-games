<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Укрытие — Hideout</title>
  <meta name="description" content="Прятки: 10 карт, 5 этажей в доме, 10 прячущихся и 2 искателя." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=11" />
</head>
<body>
  <a class="portal-back" href="../">&larr; Все игры</a>

  <div id="app">
    <div class="screen" id="screen">
      <canvas id="gameCanvas" width="960" height="640"></canvas>

      <div class="hud" id="hud" hidden>
        <div class="hud-row" id="hudInfo"></div>
        <button type="button" class="btn-menu" id="btnMenu">В меню</button>
      </div>
      <div class="toast" id="toast"></div>

      <div class="touch" id="touch" hidden>
        <div class="pad left" id="stick"></div>
        <div class="pad right" id="actBtn">E<br>действие</div>
      </div>

      <div class="panel menu" id="menu">
        <h1>Укрытие</h1>
        <p class="sub">Выбери роль. Потом выберешь карту.</p>
        <div class="roles">
          <button type="button" class="btn seeker" data-role="seeker">Искатель</button>
          <button type="button" class="btn hider" data-role="hider">Прячущийся</button>
        </div>
        <p class="hints">
          10 прячущихся · 2 искателя · 10 карт<br>
          Пойманный становится искателем.<br>
          Во время пряток искатели ничего не видят.<br>
          Искатель может пропустить ожидание (E / Пробел / кнопка).
        </p>
      </div>

      <div class="panel maps" id="mapSelect" hidden>
        <h1>Карты</h1>
        <p class="sub">Выбери место для пряток</p>
        <div class="map-grid" id="mapGrid"></div>
        <button type="button" class="btn ghost" id="btnBackRole">← Назад</button>
      </div>

      <div id="endPanel" class="panel" hidden style="display:none" aria-hidden="true"></div>
    </div>
  </div>

  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="./game.js?v=15"></script>
  <script src="../shared/amal-hub.js?v=49"></script>
  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="../shared/amal-hub.js?v=49"></script>
  <script src="../shared/amal-3d-wip-lock.js?v=2" data-guard="1"></script>
</body>
</html>
