<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Укрытие — Hideout</title>
  <meta name="description" content="Прятки в доме на 5 этажах: 10 прячущихся, 2 искателя, лестницы и много вещей." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=5" />
</head>
<body>
  <a class="portal-back" href="../">&larr; Все игры</a>

  <div id="app">
    <div class="screen" id="screen">
      <canvas id="gameCanvas" width="960" height="640"></canvas>

      <div class="hud" id="hud" hidden></div>
      <div class="toast" id="toast"></div>

      <div class="touch" id="touch" hidden>
        <div class="pad left" id="stick"></div>
        <div class="pad right" id="actBtn">E<br>действие</div>
      </div>

      <div class="panel menu" id="menu">
        <h1>Укрытие</h1>
        <p class="sub">5 этажей с одинаковым полом. 10 прячущихся и 2 искателя. Лестница переносит на другой этаж.</p>
        <div class="roles">
          <button type="button" class="btn seeker" id="btnSeeker" data-role="seeker">Искатель</button>
          <button type="button" class="btn hider" id="btnHider" data-role="hider">Прячущийся</button>
        </div>
        <p class="hints">
          <b>Прячущийся:</b> E у вещи → спрячься → стой тихо. На лестнице E — другой этаж.<br>
          <b>Искатель:</b> обыщи все этажи, E — проверить вблизи.<br>
          WASD — ходить.
        </p>
      </div>

      <div id="endPanel" class="panel" hidden style="display:none" aria-hidden="true"></div>
    </div>
  </div>

  <script src="./game.js?v=8"></script>
</body>
</html>
