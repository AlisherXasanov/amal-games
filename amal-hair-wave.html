<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🌬️ Волосы волной · Амаль</title>
  <meta name="theme-color" content="#7dd3fc" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(165deg, #0c4a6e, #0369a1 45%, #fef3c7);
      color: #0f172a; display: flex; flex-direction: column; align-items: center;
      padding: 12px; padding-top: max(12px, env(safe-area-inset-top));
      max-width: 560px; margin: 0 auto;
    }
    a.back { align-self: flex-start; color: #e0f2fe; font: 700 14px inherit; text-decoration: none; margin-bottom: 8px; }
    h1 { font-size: 1.35rem; font-weight: 900; color: #fff; text-align: center; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #bae6fd; font-weight: 700; text-align: center; margin-bottom: 12px; line-height: 1.4; }
    .tv {
      width: 100%; background: #0f172a; border-radius: 20px; overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.35); border: 3px solid rgba(255,255,255,.15);
    }
    canvas { display: block; width: 100%; aspect-ratio: 4/3; background: #bae6fd; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #17212b; justify-content: center; }
    .bar button, .bar a.btn {
      border: 0; border-radius: 999px; padding: 12px 18px;
      font: 800 14px inherit; cursor: pointer; text-decoration: none; display: inline-block;
    }
    .bar .play { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
    .bar .share { background: linear-gradient(135deg, #229ed9, #7c3aed); color: #fff; }
    .bar .ghost { background: #334155; color: #e2e8f0; }
    .note { margin-top: 12px; font-size: 13px; color: #e0f2fe; font-weight: 600; text-align: center; line-height: 1.45; }
    .nick { width: 100%; margin-top: 10px; border: 0; border-radius: 12px; padding: 10px 12px; font: 600 14px inherit; }
  </style>
</head>
<body>
  <a class="back" href="meme-channel.html?v=9&stay=1">← Мемы</a>
  <h1>🌬️ Волосы волной</h1>
  <p class="sub">Самодельная анимация · волосы развеваются · нарисовано кодом</p>

  <div class="tv">
    <canvas id="stage" width="480" height="360"></canvas>
    <div class="bar">
      <button type="button" class="play" id="btn-play">▶ Смотреть</button>
      <button type="button" class="share" id="btn-share">📤 Скинуть в мемы</button>
      <a class="btn ghost" href="create-lab/animate.html">✏️ Своя анимация</a>
    </div>
  </div>

  <input class="nick" id="nick" maxlength="16" placeholder="Как тебя зовут? (для мемов)" />

  <p class="note">Нажми «Скинуть в мемы» — анимация появится в канале. Друзья увидят и смогут нажать «Смотреть».</p>

  <script src="./shared/amal-hair-wave.js?v=1"></script>
  <script src="./shared/amal-chat-config.js?v=1"></script>
  <script src="./shared/amal-meme-net.js?v=6"></script>
  <script>
    (function () {
      var stage = document.getElementById("stage");
      var stopFn = null;
      var nickEl = document.getElementById("nick");

      if (AmalMemeNet.getNick()) nickEl.value = AmalMemeNet.getNick();
      nickEl.oninput = function () { AmalMemeNet.setNick(this.value); };

      function start() {
        if (stopFn) stopFn();
        stopFn = AmalHairWave.play(stage, { mini: false });
        document.getElementById("btn-play").textContent = "▶ Идёт…";
      }

      document.getElementById("btn-play").onclick = start;

      document.getElementById("btn-share").onclick = function () {
        var n = nickEl.value.trim();
        if (!n) { alert("Напиши имя — чтобы в мемах было видно, кто скинул!"); nickEl.focus(); return; }
        AmalMemeNet.setNick(n);
        AmalMemeNet.init();
        if (AmalMemeNet.sendAnim(AmalHairWave.ANIM_ID, AmalHairWave.TITLE, AmalHairWave.CAP)) {
          alert("📤 Скинул в мемы! Открой канал мемов — там твоя анимация.");
        }
      };

      AmalMemeNet.init();
      start();
    })();
  </script>
</body>
</html>
