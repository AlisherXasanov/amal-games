<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Шарик и кольца | Игры Амаля</title>
  <meta name="theme-color" content="#0ea5e9" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0c4a6e; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
    }
    #hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: flex-start;
      pointer-events: none;
    }
    .pill {
      background: rgba(15,23,42,.88); border: 2px solid #38bdf8; border-radius: 14px;
      padding: 8px 12px; font: 800 13px system-ui; pointer-events: auto;
    }
    #shop {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      pointer-events: auto;
    }
    #shop button {
      border: 0; border-radius: 14px; padding: 10px 12px; font: 800 12px system-ui;
      background: linear-gradient(135deg,#f59e0b,#ef4444); color: #fff; cursor: pointer;
      box-shadow: 0 4px 0 #7f1d1d; min-height: 44px;
    }
    #shop button.blue { background: linear-gradient(135deg,#38bdf8,#2563eb); box-shadow: 0 4px 0 #1e3a8a; }
    #shop button.green { background: linear-gradient(135deg,#4ade80,#16a34a); box-shadow: 0 4px 0 #14532d; }
    #toast {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,0,0,.85); border: 2px solid #fde68a; border-radius: 14px;
      padding: 12px 18px; font: 900 16px system-ui; display: none; text-align: center; max-width: 90vw;
    }
    .back {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      padding: 8px 12px; border-radius: 12px; background: #22c55e; color: #fff;
      text-decoration: none; font: 800 12px system-ui; pointer-events: auto;
    }
    #tip {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      font: 700 11px system-ui; opacity: .85; text-align: center; width: 92%;
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← Каталог</a>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="pill">🎯 Ур. <span id="lvl">1</span>/20</div>
      <div class="pill">🪙 <span id="coins">0</span></div>
      <div class="pill">⚡ <span id="spd">1</span> · 🕳 <span id="hole">1</span></div>
    </div>
    <div id="toast"></div>
    <div id="tip">Тап / пробел — прыжок · пройди в дыру кольца · не врежься в обод</div>
    <div id="shop">
      <button type="button" class="blue" id="upSpd">⚡ Скорость</button>
      <button type="button" class="green" id="upHole">🕳 Дыра шире</button>
      <button type="button" id="upBounce">🔼 Прыжок</button>
    </div>
  </div>
  <script src="./game.js?v=1"></script>
</body>
</html>
