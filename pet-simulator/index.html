<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Simulator 3D</title>
  <meta name="description" content="3D Pet Simulator — собирай питомцев, открывай яйца!" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0f0f23; font-family: system-ui, sans-serif; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 14px; line-height: 1.6; }
    #back { position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px; background: rgba(0,0,0,.5); color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
    #actions { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
    #actions button { padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; color: #fff; }
    .btn-egg { background: #8b5cf6; }
    .btn-sell { background: #ef4444; }
    .btn-coin { background: #fbbf24; color: #000; }
    #admin-shop {
      position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: none; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 96vw;
      padding: 8px; border-radius: 12px; background: rgba(120, 53, 15, .88); border: 1px solid rgba(251, 191, 36, .55);
    }
    #admin-shop.show { display: flex; }
    #admin-shop .label { width: 100%; text-align: center; color: #fde68a; font: 800 11px/1 system-ui, sans-serif; margin-bottom: 2px; }
    #admin-shop button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; color: #111; background: linear-gradient(135deg, #fde68a, #f59e0b); font-weight: 800; }
    #admin-shop button:disabled { opacity: .45; }
    #admin-shop button.owned { background: linear-gradient(135deg, #86efac, #22c55e); }
    #hatch-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 20; background: rgba(0,0,0,.85); color: #fff; padding: 24px 32px; border-radius: 12px; text-align: center; display: none; font-size: 18px; }
    #pets-bar { position: fixed; top: 60px; left: 12px; z-index: 10; color: #fff; font-size: 11px; max-height: 200px; overflow: auto; }
    #pets-bar div { padding: 2px 0; }
    .rarity-common { color: #a3a3a3; }
    .rarity-rare { color: #60a5fa; }
    .rarity-epic { color: #a78bfa; }
    .rarity-legendary { color: #fbbf24; }
  </style>
</head>
<body>
  <div id="ui">
    <b>Pet Simulator</b><br/>
    Монеты: <span id="coins">0</span><br/>
    Питомцы: <span id="pet-count">0</span>
    <div id="admin-tag" style="display:none;margin-top:4px;color:#fde68a;font-weight:800">👑 Админ · эксклюзив в магазине</div>
  </div>
  <a id="back" href="../">← Каталог</a>
  <div id="pets-bar"></div>
  <div id="admin-shop">
    <div class="label">👑 Только админ · вещи, не команды</div>
    <button id="ex-egg" type="button">Радужное легендарное яйцо ($0)</button>
    <button id="ex-pedestal" type="button">Золотой пьедестал ($0)</button>
    <button id="ex-crownpet" type="button">Корона-питомец ($0)</button>
  </div>
  <div id="actions">
    <button class="btn-coin" id="btn-farm">Фармить монеты</button>
    <button class="btn-egg" id="btn-egg">Открыть яйцо (100)</button>
    <button class="btn-sell" id="btn-sell">Продать худшего</button>
  </div>
  <div id="hatch-popup" id="popup"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script>
  (function() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x7dd3fc);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 5.5, 11);
    camera.lookAt(0, 1, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 12,
      pitch: 0.4,
      minDist: 5,
      maxDist: 28,
    });
    window.addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    scene.add(new THREE.DirectionalLight(0xffffff, 1).copy(Object.assign(new THREE.DirectionalLight(0xffffff, 1), {})));
    const sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(5, 10, 5); scene.add(sun);
    scene.add(new THREE.AmbientLight(0x808090, 0.5));

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshLambertMaterial({ color: 0x4ade80 }));
    ground.rotation.x = -Math.PI / 2; scene.add(ground);

    // Egg in center
    const eggGeo = new THREE.SphereGeometry(1, 16, 16);
    eggGeo.scale(1, 1.4, 1);
    const egg = new THREE.Mesh(eggGeo, new THREE.MeshLambertMaterial({ color: 0xd8b4fe }));
    egg.position.set(0, 1.4, 0); scene.add(egg);

    const PETS = [
      { name: "Кот", rarity: "common", color: 0xa3a3a3, value: 10 },
      { name: "Собака", rarity: "common", color: 0x92400e, value: 10 },
      { name: "Кролик", rarity: "common", color: 0xfecaca, value: 12 },
      { name: "Лиса", rarity: "rare", color: 0xf97316, value: 30 },
      { name: "Панда", rarity: "rare", color: 0x1f2937, value: 35 },
      { name: "Дракон", rarity: "epic", color: 0x7c3aed, value: 80 },
      { name: "Единорог", rarity: "epic", color: 0xf9a8d4, value: 90 },
      { name: "Феникс", rarity: "legendary", color: 0xfbbf24, value: 200 },
      { name: "Тёмный Дракон", rarity: "legendary", color: 0x1f1f1f, value: 300 },
    ];

    const RARITY_CHANCE = { common: 0.55, rare: 0.3, epic: 0.12, legendary: 0.03 };

    let coins = 50, pets = [], petMeshes = [];
    const exclusiveOwned = { egg: false, pedestal: false, crownpet: false };
    const exclusiveMeshes = [];

    function isAdmin() {
      try {
        if (window.__AMAL_OWNER__ === true || window.__AMAL_GOD__ === true) return true;
        if (window.AmalPowers && typeof AmalPowers.isOwner === "function" && AmalPowers.isOwner()) return true;
        if (window.AmalHub && typeof AmalHub.isGameAdmin === "function" && AmalHub.isGameAdmin("pet-simulator")) return true;
        if (window.AmalHub && typeof AmalHub.isOwner === "function" && AmalHub.isOwner()) return true;
      } catch (_) {}
      return false;
    }

    function trackExclusive(mesh) {
      scene.add(mesh);
      exclusiveMeshes.push(mesh);
      return mesh;
    }

    function placeRainbowEgg() {
      const geo = new THREE.SphereGeometry(0.85, 16, 16);
      geo.scale(1, 1.35, 1);
      const display = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xf472b6, emissive: 0x7c3aed }));
      display.position.set(-6, 1.2, -4);
      trackExclusive(display);
      const colors = [0xef4444, 0xf59e0b, 0x22c55e, 0x3b82f6, 0xa855f7];
      for (let i = 0; i < 5; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55 + i * 0.08, 0.04, 6, 16), new THREE.MeshLambertMaterial({ color: colors[i] }));
        ring.rotation.x = Math.PI / 2;
        ring.position.set(-6, 0.35 + i * 0.12, -4);
        trackExclusive(ring);
      }
    }

    function placePedestal() {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 0.3, 10), new THREE.MeshLambertMaterial({ color: 0xd97706 }));
      base.position.set(6, 0.15, -4);
      trackExclusive(base);
      const column = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 1.4, 10), new THREE.MeshLambertMaterial({ color: 0xfbbf24 }));
      column.position.set(6, 1.0, -4);
      trackExclusive(column);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.55, 0.2, 10), new THREE.MeshLambertMaterial({ color: 0xfde68a }));
      top.position.set(6, 1.8, -4);
      trackExclusive(top);
    }

    function placeCrownPet() {
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12), new THREE.MeshLambertMaterial({ color: 0xfbbf24, emissive: 0xb45309 }));
      body.position.set(0, 0.55, 7);
      trackExclusive(body);
      for (let i = 0; i < 5; i++) {
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 5), new THREE.MeshLambertMaterial({ color: i % 2 ? 0xfde68a : 0xf59e0b }));
        const a = (i / 5) * Math.PI * 2;
        spike.position.set(Math.cos(a) * 0.35, 1.05, 7 + Math.sin(a) * 0.35);
        trackExclusive(spike);
      }
      const gem = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), new THREE.MeshLambertMaterial({ color: 0x22d3ee, emissive: 0x0e7490 }));
      gem.position.set(0, 1.0, 7);
      trackExclusive(gem);
    }

    const exclusiveDefs = {
      egg: { id: "ex-egg", place: placeRainbowEgg },
      pedestal: { id: "ex-pedestal", place: placePedestal },
      crownpet: { id: "ex-crownpet", place: placeCrownPet },
    };

    function claimExclusive(key) {
      if (!isAdmin() || exclusiveOwned[key]) return;
      exclusiveOwned[key] = true;
      exclusiveDefs[key].place();
      syncAdminShop();
    }

    function syncAdminShop() {
      const admin = isAdmin();
      document.getElementById("admin-shop").classList.toggle("show", admin);
      document.getElementById("admin-tag").style.display = admin ? "block" : "none";
      if (!admin) return;
      Object.keys(exclusiveDefs).forEach((key) => {
        const btn = document.getElementById(exclusiveDefs[key].id);
        if (!btn) return;
        btn.disabled = !!exclusiveOwned[key];
        btn.classList.toggle("owned", !!exclusiveOwned[key]);
        if (exclusiveOwned[key] && !btn.dataset.ownedLabel) {
          btn.dataset.ownedLabel = "1";
          btn.textContent = btn.textContent.replace(/\s*\(\$0\)/, "") + " вњ“";
        }
      });
    }

    function rollPet() {
      const r = Math.random();
      let rarity;
      if (r < RARITY_CHANCE.legendary) rarity = "legendary";
      else if (r < RARITY_CHANCE.legendary + RARITY_CHANCE.epic) rarity = "epic";
      else if (r < RARITY_CHANCE.legendary + RARITY_CHANCE.epic + RARITY_CHANCE.rare) rarity = "rare";
      else rarity = "common";
      const pool = PETS.filter((p) => p.rarity === rarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function addPetMesh(pet) {
      const geo = new THREE.SphereGeometry(0.4, 8, 8);
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: pet.color }));
      const angle = Math.random() * Math.PI * 2;
      const dist = 3 + Math.random() * 4;
      mesh.position.set(Math.cos(angle) * dist, 0.4, Math.sin(angle) * dist);
      scene.add(mesh);
      petMeshes.push(mesh);
    }

    function updateUI() {
      document.getElementById("coins").textContent = Math.floor(coins);
      document.getElementById("pet-count").textContent = pets.length;
      document.getElementById("btn-egg").disabled = coins < 100;
      const bar = document.getElementById("pets-bar");
      bar.innerHTML = pets.slice(-10).reverse().map((p) => `<div class="rarity-${p.rarity}">${p.name} (${p.rarity})</div>`).join("");
    }

    document.getElementById("btn-farm").addEventListener("click", () => {
      const bonus = pets.reduce((s, p) => s + p.value * 0.1, 1);
      coins += bonus;
      updateUI();
    });

    document.getElementById("btn-egg").addEventListener("click", () => {
      if (coins < 100) return;
      coins -= 100;
      const pet = rollPet();
      pets.push(pet);
      addPetMesh(pet);
      const popup = document.getElementById("hatch-popup");
      popup.innerHTML = `<span class="rarity-${pet.rarity}" style="font-size:24px">${pet.name}!</span><br/><small>${pet.rarity}</small>`;
      popup.style.display = "block";
      setTimeout(() => popup.style.display = "none", 1800);
      // Egg animation
      egg.scale.set(1.3, 0.8, 1.3);
      setTimeout(() => egg.scale.set(1, 1, 1), 200);
      updateUI();
    });

    document.getElementById("btn-sell").addEventListener("click", () => {
      if (!pets.length) return;
      pets.sort((a, b) => a.value - b.value);
      const sold = pets.shift();
      coins += sold.value;
      if (petMeshes.length) { scene.remove(petMeshes.shift()); }
      updateUI();
    });

    updateUI();

    Object.keys(exclusiveDefs).forEach((key) => {
      document.getElementById(exclusiveDefs[key].id).addEventListener("click", () => claimExclusive(key));
    });
    window.addEventListener("amal-owner-changed", () => syncAdminShop());
    window.addEventListener("amal-powers-applied", () => syncAdminShop());
    syncAdminShop();
    setTimeout(syncAdminShop, 200);
    setTimeout(syncAdminShop, 1000);

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      // Pets bounce
      petMeshes.forEach((m, i) => { m.position.y = 0.4 + Math.sin(now * 0.003 + i) * 0.15; });
      // Egg float
      egg.position.y = 1.4 + Math.sin(now * 0.002) * 0.1;
      egg.rotation.y += 0.005;
      exclusiveMeshes.forEach((o, i) => {
        if (o.isLight) return;
        if (o.rotation) o.rotation.y += 0.006 + (i % 3) * 0.001;
      });
      orbit.lookAt(0, 1, 0);
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="../shared/amal-hub.js?v=49"></script>
  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="../shared/amal-hub.js?v=49"></script>
  <script src="../shared/amal-3d-wip-lock.js?v=2" data-guard="1"></script>
</body>
</html>
