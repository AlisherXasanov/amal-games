<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>▶ Смотрим вместе · мульты Амаля</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#7c3aed" />
  <script src="../shared/amal-owner-session.js?v=2"></script>
  <script>
    if (window.AmalOwnerSession && AmalOwnerSession.admitLikeQrScanned) AmalOwnerSession.admitLikeQrScanned();
  </script>
  <style>
    :root { --bg:#1e1b4b; --card:rgba(255,255,255,.08); --accent:#fbbf24; --ink:#f8fafc; --mute:#c4b5fd; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink);
      background: radial-gradient(700px 360px at 10% 0%, #4c1d95, transparent 55%),
        linear-gradient(165deg, #0f172a, #312e81);
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 14px 16px 8px;
    }
    a.back {
      color: var(--mute); text-decoration: none; font-weight: 700; font-size: 13px;
      border: 1px solid rgba(255,255,255,.15); padding: 8px 12px; border-radius: 999px;
    }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 900; }
    main { max-width: 560px; margin: 0 auto; padding: 0 14px 28px; }
    .tip {
      background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 13px;
      color: var(--mute); line-height: 1.45; margin-bottom: 12px;
    }
    .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .modes button {
      border: 0; border-radius: 999px; padding: 10px 14px; font: 800 13px inherit;
      cursor: pointer; background: rgba(255,255,255,.12); color: #fff;
    }
    .modes button.on { background: linear-gradient(135deg,#fbbf24,#f472b6); color: #111; }
    .nick-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .nick-row input {
      flex: 1; border-radius: 12px; border: 1px solid rgba(255,255,255,.2);
      padding: 10px 12px; background: rgba(0,0,0,.25); color: #fff; font: 700 14px inherit;
    }
    .nick-row button, .tv-bar button, .shelf button.go {
      border: 0; border-radius: 12px; padding: 10px 14px; font: 800 13px inherit;
      cursor: pointer; background: var(--accent); color: #111;
    }
    .online { font-size: 12px; font-weight: 700; color: var(--mute); margin-bottom: 10px; }
    .tv {
      background: #000; border-radius: 18px; overflow: hidden;
      border: 3px solid rgba(251,191,36,.45); margin-bottom: 10px;
    }
    .stage {
      aspect-ratio: 16/9; display: grid; place-items: center; padding: 16px;
      background: linear-gradient(160deg, #312e81, #0f172a); text-align: center;
    }
    .stage .big { font-size: 48px; margin-bottom: 8px; }
    .stage h2 { margin: 0 0 6px; font-size: 1.15rem; }
    .stage p { margin: 0; color: var(--mute); font-size: 13px; font-weight: 600; line-height: 1.4; }
    .line-box {
      min-height: 3.2em; margin-top: 12px; font: 800 15px/1.4 inherit; color: #fde68a;
    }
    .tv-bar {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: rgba(15,23,42,.95);
    }
    .shelf { display: grid; gap: 8px; }
    .shelf .card {
      display: flex; gap: 12px; align-items: center; text-align: left;
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px;
      background: var(--card); color: inherit; cursor: pointer; width: 100%;
      font: inherit;
    }
    .shelf .card.on { border-color: #fbbf24; background: rgba(251,191,36,.12); }
    .shelf .card .ico { font-size: 28px; }
    .shelf .card strong { display: block; font-size: 14px; }
    .shelf .card small { color: var(--mute); font-weight: 600; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,.95); border: 1px solid rgba(255,255,255,.15);
      padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
      opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; z-index: 20;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../friends.html?v=6&stay=1">← Друзья</a>
    <h1>▶ Смотрим вместе</h1>
    <a class="back" href="../mult-studio/">Полка</a>
  </header>

  <main>
    <p class="tip">
      Это <strong>твой кинотеатр друзей</strong>: свои мульты (Полка Валеры / Валера), не чужой YouTube.
      Можно <strong>одному</strong> или <strong>вместе</strong> — ведущий выбирает выпуск, у всех на экране то же.
    </p>

    <div class="nick-row">
      <input id="nick" maxlength="16" placeholder="Твоё имя" />
      <button type="button" id="btn-nick">Сохранить</button>
    </div>
    <div class="online" id="online">🟡 Напиши имя</div>

    <div class="modes">
      <button type="button" class="on" data-mode="solo">👤 Один</button>
      <button type="button" data-mode="party">⭐ Вместе</button>
    </div>

    <div class="tv">
      <div class="stage" id="stage">
        <div class="big">🎬</div>
        <h2 id="title">Выбери мульт ниже</h2>
        <p id="blurb">Свои короткие выпуски — как у ютуберов, но наши.</p>
        <div class="line-box" id="line">—</div>
      </div>
      <div class="tv-bar">
        <button type="button" id="btn-play">▶ Смотреть</button>
        <button type="button" id="btn-host" hidden>📣 Я ведущий</button>
        <span id="status" style="font:700 12px inherit;color:#a5b4fc;align-self:center">готов</span>
      </div>
    </div>

    <div class="shelf" id="shelf"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="../owner-cheats.js"></script>
  <script src="../shared/amal-device.js?v=8"></script>
  <script src="../shared/amal-friends-net.js?v=6"></script>
  <script src="./watch.js?v=1"></script>
</body>
</html>
