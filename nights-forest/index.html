<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>99 Ночей в лесу — черновик</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#0a1208;font-family:Segoe UI,system-ui,sans-serif;color:#fff}
    #hud{position:fixed;top:10px;left:10px;z-index:20;max-width:min(380px,78vw);text-shadow:0 1px 3px #000;font-size:13px;line-height:1.5}
    #hud b{font-size:17px;display:block;margin-bottom:2px}
    #hud .hi{color:#fde68a}
    #phase{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.12);margin-left:4px}
    #draft{position:fixed;top:10px;right:10px;z-index:20;font-size:11px;opacity:.8;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px}
    #toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:40;background:rgba(20,10,8,.9);padding:10px 16px;border-radius:12px;font:800 14px/1.3 system-ui;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;border:1px solid #f97316}
    #toast.show{opacity:1}
    #prompt{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:20;font:800 13px/1 system-ui;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;display:none}
    #panel{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:96vw}
    #panel button{padding:10px 12px;border:0;border-radius:12px;font:800 12px/1.15 system-ui;cursor:pointer;color:#14532d;background:linear-gradient(135deg,#a3e635,#65a30d)}
    #panel button.off{opacity:.4}
    #panel button.warm{background:linear-gradient(135deg,#fdba74,#ea580c);color:#fff}
    #panel button.blue{background:linear-gradient(135deg,#93c5fd,#2563eb);color:#fff}
    #panel button.pur{background:linear-gradient(135deg,#d8b4fe,#7c3aed);color:#fff}
    #panel button.wood{background:linear-gradient(135deg,#fde68a,#b45309);color:#1c1917}
    #tut{position:fixed;inset:0;z-index:60;background:rgba(6,12,6,.75);display:flex;align-items:center;justify-content:center;padding:16px}
    #tut .box{width:min(420px,94vw);background:linear-gradient(160deg,#1a2e14,#0d160c);border:1px solid rgba(163,230,53,.35);border-radius:16px;padding:18px 16px}
    #tut h2{font-size:18px;margin-bottom:8px;color:#bef264}
    #tut p{font-size:14px;line-height:1.5;margin-bottom:14px}
    #tut .row{display:flex;gap:8px;justify-content:flex-end}
    #tut button{border:0;border-radius:10px;padding:10px 14px;font:800 13px/1 system-ui;cursor:pointer}
    #tut .next{background:linear-gradient(135deg,#a3e635,#65a30d);color:#14532d}
    #tut .skip{background:rgba(255,255,255,.1);color:#cbd5e1}
    #stepDots{display:flex;gap:6px;margin-bottom:10px}
    #stepDots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
    #stepDots span.on{background:#a3e635}
  </style>
</head>
<body>
  <div id="hud">
    <b>99 Ночей в лесу</b>
    Ночь: <span class="hi" id="night">0</span> / 99 · Дрова: <span class="hi" id="wood">0</span><br/>
    Фаза: <span id="phase">день</span> · Тепло: <span id="warm">ок</span><br/>
    Биом: <span id="biome">лагерь</span>
  </div>
  <div id="draft">черновик · не на сайте</div>
  <a id="btnMenu" href="../_private/" style="position:fixed;top:42px;right:10px;z-index:50;padding:8px 12px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font:800 12px/1 system-ui;text-decoration:none">Меню игр</a>
  <div id="toast"></div>
  <div id="prompt"></div>
  <div id="panel">
    <button type="button" id="btnLantern" class="blue">Фонарь</button>
    <button type="button" id="btnAxe" class="wood">Топор</button>
    <button type="button" id="btnFire" class="warm">Костёр+</button>
    <button type="button" id="btnSignal" class="pur">Сигнал</button>
    <button type="button" id="btnWall">Стена (2)</button>
  </div>
  <div id="tut">
    <div class="box">
      <div id="stepDots"></div>
      <h2 id="tutTitle"></h2>
      <p id="tutText"></p>
      <div class="row">
        <button type="button" class="skip" id="tutSkip">Пропустить</button>
        <button type="button" class="next" id="tutNext">Далее</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script src="../shared/amal-walk-player.js?v=3"></script>
  <script src="../shared/amal-draft-owner.js?v=2"></script>
  <script>
  (function () {
    if (!THREE.CapsuleGeometry) {
      THREE.CapsuleGeometry = function (r, len, c, seg) {
        return new THREE.CylinderGeometry(r, r, (len || 1) + r * 2, seg || 8);
      };
    }

    const CAMP = { x: 0, z: 0 };
    const DAY_LEN = 32;
    const NIGHT_LEN = 24;
    const WALL_COST = 2;
    const MAP = 140;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a878);
    scene.fog = new THREE.Fog(0x87a878, 55, 150);
    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 260);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 14, pitch: 0.48, lookOffsetY: 1.3, minDist: 5, maxDist: 36,
      hintText: "Камера: ПКМ · колёсико"
    });
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const amb = new THREE.AmbientLight(0xb8c9a8, 0.55);
    scene.add(amb);
    const sun = new THREE.DirectionalLight(0xfff4d6, 1.05);
    sun.position.set(28, 40, 18);
    sun.castShadow = true;
    scene.add(sun);
    const fireLight = new THREE.PointLight(0xff8a3d, 1.6, 30, 1.3);
    fireLight.position.set(CAMP.x, 1.8, CAMP.z);
    scene.add(fireLight);
    const lanternLight = new THREE.PointLight(0xffe08a, 0, 18, 1.5);
    scene.add(lanternLight);

    function mesh(geo, mat, x, y, z, parent) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      (parent || scene).add(m);
      return m;
    }
    function box(w, h, d, color, x, y, z, parent) {
      return mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }), x, y, z, parent);
    }

    // Biome ground patches
    const BIOMES = [
      { id: "forest", name: "лес", color: 0x3d5c2e, x: 0, z: 0, r: 55 },
      { id: "snow", name: "снег", color: 0xdce6ef, x: 55, z: -40, r: 38 },
      { id: "swamp", name: "болото", color: 0x3a4a28, x: -50, z: 35, r: 36 },
      { id: "wastes", name: "пустошь", color: 0x6b5a45, x: 35, z: 55, r: 34 }
    ];
    BIOMES.forEach((b) => {
      const g = mesh(
        new THREE.CircleGeometry(b.r, 40),
        new THREE.MeshLambertMaterial({ color: b.color }),
        b.x, 0.02, b.z
      );
      g.rotation.x = -Math.PI / 2;
    });
    // base ground under everything
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP * 1.4, MAP * 1.4),
      new THREE.MeshLambertMaterial({ color: 0x2f4a22 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    // Camp clearing + fire
    const clearing = mesh(
      new THREE.CircleGeometry(8, 32),
      new THREE.MeshLambertMaterial({ color: 0x5a7a3a }),
      CAMP.x, 0.04, CAMP.z
    );
    clearing.rotation.x = -Math.PI / 2;
    box(0.9, 0.5, 0.9, 0x3f2a1a, 0, 0.35, 0);
    const flame = mesh(
      new THREE.ConeGeometry(0.45, 1.1, 8),
      new THREE.MeshLambertMaterial({ color: 0xff6a1a, emissive: 0xff4500, emissiveIntensity: 0.55 }),
      0, 1.1, 0
    );
    // logs
    box(1.6, 0.25, 0.28, 0x5d4037, 0.2, 0.25, 0.4);
    box(1.4, 0.25, 0.28, 0x4e342e, -0.2, 0.25, -0.35);

    // Biome props
    function tree(x, z, snowy) {
      box(0.45, 2.8, 0.45, 0x6d4c41, x, 1.5, z);
      if (snowy) {
        mesh(new THREE.ConeGeometry(1.35, 2.6, 8), new THREE.MeshLambertMaterial({ color: 0xe8f0e8 }), x, 3.4, z);
      } else {
        mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshLambertMaterial({ color: 0x2e7d32 }), x, 3.3, z);
      }
    }
    function rock(x, z, c) {
      mesh(new THREE.DodecahedronGeometry(0.7 + Math.random() * 0.5, 0), new THREE.MeshLambertMaterial({ color: c || 0x78909c }), x, 0.5, z);
    }
    function reed(x, z) {
      box(0.12, 1.4, 0.12, 0x556b2f, x, 0.7, z);
      box(0.12, 1.1, 0.12, 0x6b8e23, x + 0.25, 0.55, z + 0.1);
    }

    const trees = [];
    for (let i = 0; i < 42; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 12 + Math.random() * 48;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      if (Math.hypot(x, z) < 10) continue;
      tree(x, z, false);
      trees.push({ x: x, z: z, wood: 1 + (Math.random() > 0.6 ? 1 : 0) });
    }
    // snow pines
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 8 + Math.random() * 26;
      const x = 55 + Math.cos(a) * r;
      const z = -40 + Math.sin(a) * r;
      tree(x, z, true);
      trees.push({ x: x, z: z, wood: 1 });
      if (i % 3 === 0) rock(x + 2, z - 1, 0xb0bec5);
    }
    // swamp
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 6 + Math.random() * 24;
      const x = -50 + Math.cos(a) * r;
      const z = 35 + Math.sin(a) * r;
      reed(x, z);
      if (i % 2 === 0) {
        box(0.5, 1.6, 0.5, 0x4e342e, x + 1, 0.9, z);
        mesh(new THREE.SphereGeometry(1.1, 8, 8), new THREE.MeshLambertMaterial({ color: 0x33691e }), x + 1, 2.2, z);
        trees.push({ x: x + 1, z: z, wood: 1 });
      }
    }
    const puddle = mesh(
      new THREE.CircleGeometry(6, 24),
      new THREE.MeshLambertMaterial({ color: 0x2e4a3a, transparent: true, opacity: 0.85 }),
      -50, 0.06, 35
    );
    puddle.rotation.x = -Math.PI / 2;
    // wastes
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 5 + Math.random() * 24;
      rock(35 + Math.cos(a) * r, 55 + Math.sin(a) * r, 0x8d7b68);
    }
    box(2.2, 0.4, 0.5, 0x5d4037, 38, 0.3, 50);
    box(0.5, 0.4, 2.5, 0x4e342e, 42, 0.3, 58);

    function makeWolf() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.28, 0.85, 4, 8),
        new THREE.MeshLambertMaterial({ color: 0x4a5568 })
      );
      body.rotation.z = Math.PI / 2;
      body.position.y = 0.55;
      body.castShadow = true;
      g.add(body);
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 0.32, 0.42),
        new THREE.MeshLambertMaterial({ color: 0x374151 })
      );
      head.position.set(0, 0.7, 0.65);
      g.add(head);
      const snout = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.16, 0.28),
        new THREE.MeshLambertMaterial({ color: 0x1f2937 })
      );
      snout.position.set(0, 0.58, 0.95);
      g.add(snout);
      [[-0.22, -0.35], [0.22, -0.35], [-0.22, 0.35], [0.22, 0.35]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(
          new THREE.CapsuleGeometry(0.07, 0.35, 3, 6),
          new THREE.MeshLambertMaterial({ color: 0x2d3748 })
        );
        leg.position.set(x, 0.28, z);
        g.add(leg);
      });
      const tail = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.06, 0.35, 3, 6),
        new THREE.MeshLambertMaterial({ color: 0x4a5568 })
      );
      tail.position.set(0, 0.65, -0.7);
      tail.rotation.x = 0.5;
      g.add(tail);
      return g;
    }

    const player = AmalWalkPlayer.create(scene, THREE, { humanoid: true, x: 2, z: 3, speed: 8.5, jump: 8 });
    AmalDraftOwner.attachPlayer(player);
    AmalDraftOwner.badge();

    let wood = 0;
    let nightCount = 0;
    let phaseTime = 0;
    let isNight = false;
    let dead = false;
    let toastT = 0;
    let lanternOn = false;
    let axeBoost = 0;
    let warmBoost = 0;
    let signalT = 0;
    let campWarm = 1;
    const wolves = [];
    const walls = [];
    let chopCd = 0;

    function toast(msg, t) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      toastT = t != null ? t : 2;
    }
    function biomeAt(x, z) {
      let best = BIOMES[0], bd = 1e9;
      BIOMES.forEach((b) => {
        const d = Math.hypot(x - b.x, z - b.z);
        if (d < b.r && d < bd) { best = b; bd = d; }
      });
      if (Math.hypot(x - CAMP.x, z - CAMP.z) < 9) return { id: "camp", name: "лагерь" };
      return best;
    }
    function refreshHud() {
      document.getElementById("night").textContent = nightCount;
      document.getElementById("wood").textContent = wood;
      document.getElementById("phase").textContent = isNight ? "ночь" : "день";
      document.getElementById("phase").style.background = isNight ? "rgba(79,70,229,.45)" : "rgba(255,255,255,.12)";
      const nearFire = Math.hypot(player.mesh.position.x, player.mesh.position.z) < 7;
      document.getElementById("warm").textContent = warmBoost > 0 || nearFire ? "тепло" : (isNight ? "холодно" : "ок");
      document.getElementById("biome").textContent = biomeAt(player.mesh.position.x, player.mesh.position.z).name;
      document.getElementById("btnWall").disabled = wood < WALL_COST;
      document.getElementById("btnWall").classList.toggle("off", wood < WALL_COST);
    }

    function setDayNight(night) {
      isNight = night;
      if (night) {
        scene.background.set(0x0b1220);
        scene.fog.color.set(0x0b1220);
        scene.fog.near = 25;
        scene.fog.far = 90;
        amb.intensity = 0.18;
        sun.intensity = 0.12;
        fireLight.intensity = 2.2;
        nightCount = Math.min(99, nightCount + 1);
        toast("Ночь " + nightCount + " / 99", 2);
        spawnWolves();
        if (nightCount >= 99) toast("Ты пережил 99 ночей!", 4);
      } else {
        scene.background.set(0x87a878);
        scene.fog.color.set(0x87a878);
        scene.fog.near = 55;
        scene.fog.far = 150;
        amb.intensity = 0.55;
        sun.intensity = 1.05;
        fireLight.intensity = 1.4;
        clearWolves();
        toast("Рассвет", 1.4);
      }
      refreshHud();
    }

    function spawnWolves() {
      clearWolves();
      const n = 2 + Math.min(3, Math.floor(nightCount / 15));
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 28 + Math.random() * 35;
        const w = makeWolf();
        w.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        scene.add(w);
        wolves.push({ mesh: w, attackCd: 0, scared: 0 });
      }
    }
    function clearWolves() {
      wolves.forEach((w) => scene.remove(w.mesh));
      wolves.length = 0;
    }

    function nearTree() {
      const p = player.mesh.position;
      let best = null, bd = 2.6;
      trees.forEach((t) => {
        const d = Math.hypot(p.x - t.x, p.z - t.z);
        if (d < bd) { best = t; bd = d; }
      });
      return best;
    }

    function chopWood() {
      if (chopCd > 0 || dead) return;
      const t = nearTree();
      if (!t) { toast("Подойди к дереву", 1.2); return; }
      chopCd = axeBoost > 0 ? 0.35 : 0.85;
      const gain = axeBoost > 0 ? Math.max(1, t.wood) : 1;
      wood += gain;
      toast("+" + gain + " дрова", 1);
      refreshHud();
    }

    function placeWall() {
      if (wood < WALL_COST || dead) return;
      wood -= WALL_COST;
      const dir = { x: -Math.sin(orbit.state.yaw), z: -Math.cos(orbit.state.yaw) };
      const x = player.mesh.position.x + dir.x * 2.2;
      const z = player.mesh.position.z + dir.z * 2.2;
      const w = box(2.4, 2.2, 0.35, 0x8d6e63, x, 1.1, z);
      w.rotation.y = Math.atan2(dir.x, dir.z);
      walls.push({ mesh: w, x: x, z: z });
      toast("Стена построена", 1.2);
      refreshHud();
    }

    function hurtPlayer(dmg) {
      if (AmalDraftOwner.isOwner() || !AmalDraftOwner.canDie()) return;
      if (dead) return;
      // simple one-hit death like survival nights
      dead = true;
      toast("Волки догнали… Ночь сброшена у костра", 2.8);
      setTimeout(() => {
        player.mesh.position.set(2, 0, 3);
        dead = false;
        clearWolves();
        if (isNight) spawnWolves();
        refreshHud();
      }, 2000);
    }

    function toggleLantern() {
      lanternOn = !lanternOn;
      lanternLight.intensity = lanternOn ? 1.8 : 0;
      document.getElementById("btnLantern").classList.toggle("off", !lanternOn);
      toast(lanternOn ? "Фонарь включён" : "Фонарь выключен", 1.1);
    }
    function useAxe() {
      axeBoost = 18;
      toast("Топор: рубка быстрее 18с", 1.5);
    }
    function useFireBoost() {
      if (Math.hypot(player.mesh.position.x, player.mesh.position.z) > 9) {
        toast("Нужно у костра", 1.3);
        return;
      }
      warmBoost = 20;
      campWarm = 1.6;
      fireLight.intensity = isNight ? 3.2 : 2.2;
      toast("Костёр+: тепло и лечение", 1.5);
      // heal sense — owner already immortal; for mortal just clear cold fear via toast
    }
    function useSignal() {
      signalT = 5;
      wolves.forEach((w) => { w.scared = 5; });
      toast("Сигнал! Волки отступают", 1.6);
    }

    document.getElementById("btnLantern").onclick = toggleLantern;
    document.getElementById("btnAxe").onclick = useAxe;
    document.getElementById("btnFire").onclick = useFireBoost;
    document.getElementById("btnSignal").onclick = useSignal;
    document.getElementById("btnWall").onclick = placeWall;

    addEventListener("keydown", (e) => {
      if (e.code === "KeyE" && !e.repeat) chopWood();
      if (e.code === "KeyF" && !e.repeat) placeWall();
      if (e.code === "Digit1") toggleLantern();
      if (e.code === "Digit2") useAxe();
      if (e.code === "Digit3") useFireBoost();
      if (e.code === "Digit4") useSignal();
    });

    // Tutorial
    const TUT = [
      { t: "Выживание 99 ночей", p: "Большая карта с биомами: лес, снег, болото и пустошь. День сменяется ночью — счётчик идёт к 99." },
      { t: "Костёр и дрова", p: "Лагерь в центре — относительно безопасно. E у дерева — дрова. Кнопка «Стена» (или F) строит укрытие за 2 дрова." },
      { t: "Способности", p: "Фонарь — свет ночью. Топор — быстрее рубить. Костёр+ — тепло у костра. Сигнал — кратко пугает волков." },
      { t: "Волки", p: "Волки появляются только ночью (вытянутые, не цилиндры). Хозяин урона не получает. Обычный игрок — берегись!" }
    ];
    let tutI = 0;
    const dots = document.getElementById("stepDots");
    function showTut() {
      TUT.forEach((_, i) => {
        let s = dots.children[i];
        if (!s) { s = document.createElement("span"); dots.appendChild(s); }
        s.className = i === tutI ? "on" : "";
      });
      document.getElementById("tutTitle").textContent = TUT[tutI].t;
      document.getElementById("tutText").textContent = TUT[tutI].p;
      document.getElementById("tutNext").textContent = tutI >= TUT.length - 1 ? "Играть" : "Далее";
    }
    function closeTut() { document.getElementById("tut").style.display = "none"; }
    document.getElementById("tutNext").onclick = () => {
      if (tutI >= TUT.length - 1) closeTut();
      else { tutI++; showTut(); }
    };
    document.getElementById("tutSkip").onclick = closeTut;
    showTut();
    refreshHud();

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (toastT > 0) {
        toastT -= dt;
        if (toastT <= 0) document.getElementById("toast").classList.remove("show");
      }
      chopCd = Math.max(0, chopCd - dt);
      axeBoost = Math.max(0, axeBoost - dt);
      warmBoost = Math.max(0, warmBoost - dt);
      signalT = Math.max(0, signalT - dt);
      if (warmBoost <= 0 && campWarm > 1) {
        campWarm = 1;
        fireLight.intensity = isNight ? 2.2 : 1.4;
      }

      phaseTime += dt;
      const cycle = isNight ? NIGHT_LEN : DAY_LEN;
      if (phaseTime >= cycle) {
        phaseTime = 0;
        setDayNight(!isNight);
      }

      if (!dead) {
        player.update(dt, orbit.state.yaw, { minX: -MAP * 0.55, maxX: MAP * 0.55, minZ: -MAP * 0.55, maxZ: MAP * 0.55 });
      }
      const pos = player.mesh.position;
      orbit.follow(pos);

      lanternLight.position.set(pos.x, pos.y + 1.6, pos.z);
      flame.scale.y = 1 + Math.sin(now * 0.01) * 0.12;
      flame.rotation.y += dt * 2;

      // wolves AI
      wolves.forEach((w) => {
        w.scared = Math.max(0, w.scared - dt);
        w.attackCd = Math.max(0, w.attackCd - dt);
        const dx = pos.x - w.mesh.position.x;
        const dz = pos.z - w.mesh.position.z;
        const dist = Math.hypot(dx, dz);
        const nearCamp = Math.hypot(w.mesh.position.x, w.mesh.position.z) < 7.5;
        const playerAtCamp = Math.hypot(pos.x, pos.z) < 7;

        // wall block: slow if wall between roughly
        let blocked = false;
        walls.forEach((wall) => {
          if (Math.hypot(w.mesh.position.x - wall.x, w.mesh.position.z - wall.z) < 1.8) blocked = true;
        });

        if (w.scared > 0 || signalT > 0) {
          const L = dist || 1;
          w.mesh.position.x -= (dx / L) * 7 * dt;
          w.mesh.position.z -= (dz / L) * 7 * dt;
          w.mesh.rotation.y = Math.atan2(-dx, -dz);
          return;
        }

        if (AmalDraftOwner.isOwner()) {
          // never damage; keep distance / circle
          if (dist < 2.2) {
            const L = dist || 1;
            w.mesh.position.x -= (dx / L) * 5 * dt;
            w.mesh.position.z -= (dz / L) * 5 * dt;
          } else if (dist < 16 && !nearCamp) {
            w.mesh.rotation.y = Math.atan2(dx, dz);
          }
          return;
        }

        const avoidCamp = nearCamp && playerAtCamp;
        if (!avoidCamp && dist > 1.5 && !blocked) {
          const spd = lanternOn && dist < 12 ? 2.4 : 4.2;
          const L = dist || 1;
          w.mesh.position.x += (dx / L) * spd * dt;
          w.mesh.position.z += (dz / L) * spd * dt;
          w.mesh.rotation.y = Math.atan2(dx, dz);
        } else if (avoidCamp) {
          // linger at edge of camp
          const L = Math.hypot(w.mesh.position.x, w.mesh.position.z) || 1;
          w.mesh.position.x = (w.mesh.position.x / L) * 9;
          w.mesh.position.z = (w.mesh.position.z / L) * 9;
        }

        if (dist < 1.6 && w.attackCd <= 0 && !(playerAtCamp && warmBoost > 0)) {
          w.attackCd = 1.2;
          if (!(playerAtCamp && Math.hypot(pos.x, pos.z) < 5)) hurtPlayer(100);
        }
      });

      const t = nearTree();
      const prompt = document.getElementById("prompt");
      if (t) {
        prompt.style.display = "block";
        prompt.textContent = "E — рубить дрова" + (axeBoost > 0 ? " (топор!)" : "");
      } else prompt.style.display = "none";

      if ((now / 400 | 0) % 2 === 0) refreshHud();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  })();
  </script>
