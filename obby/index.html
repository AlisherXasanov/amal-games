<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obby — 3D полоса препятствий</title>
  <meta name="description" content="3D Obby — прыгай по платформам, доберись до финиша!" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 14px; }
    #ui h2 { font-size: 18px; margin-bottom: 4px; }
    #death { position: fixed; inset: 0; display: none; z-index: 20; background: rgba(0,0,0,.7); align-items: center; justify-content: center; flex-direction: column; color: #fff; }
    #death.show { display: flex; }
    #death button { margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
    #win { position: fixed; inset: 0; display: none; z-index: 20; background: rgba(0,0,0,.8); align-items: center; justify-content: center; flex-direction: column; color: #fff; }
    #win.show { display: flex; }
    #win h1 { font-size: 36px; color: #6ee7b7; }
    #win button { margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #6ee7b7; color: #000; cursor: pointer; }
    #controls { position: fixed; bottom: 12px; left: 12px; color: #fff; text-shadow: 1px 1px 2px #000; font-size: 12px; z-index: 10; }
    #back { position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px; background: rgba(0,0,0,.5); color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
    #mobile-btns { position: fixed; bottom: 16px; right: 16px; z-index: 10; display: none; gap: 8px; }
    #mobile-btns button { width: 52px; height: 52px; border-radius: 50%; border: none; background: rgba(255,255,255,.3); color: #fff; font-size: 22px; backdrop-filter: blur(4px); }
    @media (pointer: coarse) { #mobile-btns { display: flex; } }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Obby</h2>
    <div>Уровень: <span id="lvl">1</span> / <span id="lvl-total">3</span></div>
    <div>Падения: <span id="deaths">0</span></div>
  </div>
  <a id="back" href="../">← Каталог</a>
  <div id="controls">WASD — ход · Пробел — прыжок · ПКМ — крутить камеру · Q/E</div>
  <div id="mobile-btns">
    <button id="m-left">←</button>
    <button id="m-jump">↑</button>
    <button id="m-right">→</button>
  </div>
  <div id="death"><h2>Упал!</h2><button id="retry">Попробовать снова</button></div>
  <div id="win"><h1>Победа!</h1><p>Ты прошёл все уровни!</p><button id="replay">Играть заново</button></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script>
  (function() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 11,
      pitch: 0.42,
      lookOffsetY: 1.3,
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(10, 20, 10);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x404060, 0.6));

    const LEVELS = [
      // Level 1 — easy
      [
        { x: 0, y: 0, z: 0, w: 3, h: 0.5, d: 3, color: 0x4ade80 },
        { x: 4, y: 0, z: 0, w: 2, h: 0.5, d: 2, color: 0x4ade80 },
        { x: 8, y: 1, z: 0, w: 2, h: 0.5, d: 2, color: 0x4ade80 },
        { x: 12, y: 2, z: 0, w: 2, h: 0.5, d: 2, color: 0x4ade80 },
        { x: 12, y: 2, z: -4, w: 2, h: 0.5, d: 2, color: 0x4ade80 },
        { x: 16, y: 3, z: -4, w: 2, h: 0.5, d: 2, color: 0x4ade80 },
        { x: 20, y: 3, z: -4, w: 3, h: 0.5, d: 3, color: 0xfbbf24, finish: true },
      ],
      // Level 2 — medium
      [
        { x: 0, y: 0, z: 0, w: 3, h: 0.5, d: 3, color: 0x60a5fa },
        { x: 4, y: 1, z: 0, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 7, y: 2.5, z: 0, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 7, y: 4, z: -3, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 10, y: 5, z: -3, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 13, y: 5, z: -3, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 13, y: 6, z: 0, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 16, y: 7, z: 0, w: 1.5, h: 0.5, d: 1.5, color: 0x60a5fa },
        { x: 19, y: 7, z: 0, w: 3, h: 0.5, d: 3, color: 0xfbbf24, finish: true },
      ],
      // Level 3 — hard
      [
        { x: 0, y: 0, z: 0, w: 3, h: 0.5, d: 3, color: 0xf472b6 },
        { x: 4, y: 1.5, z: 0, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 7, y: 3, z: 1, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 7, y: 5, z: -2, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 10, y: 6, z: -2, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 10, y: 7.5, z: 1, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 13, y: 9, z: 1, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 13, y: 10, z: -2, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 16, y: 11, z: -2, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 19, y: 12, z: 0, w: 1, h: 0.5, d: 1, color: 0xf472b6 },
        { x: 22, y: 12, z: 0, w: 3, h: 0.5, d: 3, color: 0xfbbf24, finish: true },
      ],
    ];

    let currentLevel = 0;
    let deaths = 0;
    let platforms = [];
    let finishPlatform = null;

    const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.castShadow = true;
    scene.add(player);

    let vx = 0, vy = 0, vz = 0;
    let onGround = false;
    const GRAVITY = -25;
    const JUMP = 10;
    const SPEED = 7;

    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.code] = true);
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    // Mobile
    let mLeft = false, mRight = false, mJump = false;
    const ml = document.getElementById("m-left");
    const mr = document.getElementById("m-right");
    const mj = document.getElementById("m-jump");
    ml.addEventListener("touchstart", () => mLeft = true);
    ml.addEventListener("touchend", () => mLeft = false);
    mr.addEventListener("touchstart", () => mRight = true);
    mr.addEventListener("touchend", () => mRight = false);
    mj.addEventListener("touchstart", () => { mJump = true; setTimeout(() => mJump = false, 100); });

    function loadLevel(idx) {
      platforms.forEach((p) => scene.remove(p));
      platforms = [];
      finishPlatform = null;

      const lvl = LEVELS[idx];
      lvl.forEach((pl) => {
        const geo = new THREE.BoxGeometry(pl.w, pl.h, pl.d);
        const mat = new THREE.MeshLambertMaterial({ color: pl.color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(pl.x, pl.y, pl.z);
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        mesh.userData = { w: pl.w, h: pl.h, d: pl.d, finish: !!pl.finish };
        scene.add(mesh);
        platforms.push(mesh);
        if (pl.finish) finishPlatform = mesh;
      });

      // Reset player
      const start = lvl[0];
      player.position.set(start.x, start.y + 1.5, start.z);
      vx = vy = vz = 0;

      document.getElementById("lvl").textContent = idx + 1;
    }

    function checkCollision() {
      const px = player.position.x, py = player.position.y, pz = player.position.z;
      const pw = 0.4, ph = 0.8;

      onGround = false;
      for (const p of platforms) {
        const d = p.userData;
        const bx = p.position.x, by = p.position.y, bz = p.position.z;
        const hw = d.w / 2, hh = d.h / 2, hd = d.d / 2;

        if (px + pw > bx - hw && px - pw < bx + hw &&
            pz + pw > bz - hd && pz - pw < bz + hd) {
          // Above platform
          if (py - ph <= by + hh && py - ph > by - hh && vy <= 0) {
            player.position.y = by + hh + ph;
            vy = 0;
            onGround = true;

            if (p.userData.finish) {
              nextLevel();
            }
          }
        }
      }
    }

    function nextLevel() {
      currentLevel++;
      if (currentLevel >= LEVELS.length) {
        document.getElementById("win").classList.add("show");
      } else {
        loadLevel(currentLevel);
      }
    }

    function die() {
      deaths++;
      document.getElementById("deaths").textContent = deaths;
      loadLevel(currentLevel);
    }

    document.getElementById("retry").addEventListener("click", () => {
      document.getElementById("death").classList.remove("show");
      loadLevel(currentLevel);
    });

    document.getElementById("replay").addEventListener("click", () => {
      document.getElementById("win").classList.remove("show");
      currentLevel = 0;
      deaths = 0;
      document.getElementById("deaths").textContent = 0;
      loadLevel(0);
    });

    document.getElementById("lvl-total").textContent = LEVELS.length;
    loadLevel(0);

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Input
      let moveX = 0, moveZ = 0;
      if (keys["KeyW"] || keys["ArrowUp"]) moveZ = -1;
      if (keys["KeyS"] || keys["ArrowDown"]) moveZ = 1;
      if (keys["KeyA"] || keys["ArrowLeft"] || mLeft) moveX = -1;
      if (keys["KeyD"] || keys["ArrowRight"] || mRight) moveX = 1;

      if ((keys["Space"] || mJump) && onGround) {
        vy = JUMP;
        onGround = false;
      }

      vx = moveX * SPEED;
      vz = moveZ * SPEED;
      vy += GRAVITY * dt;

      player.position.x += vx * dt;
      player.position.y += vy * dt;
      player.position.z += vz * dt;

      checkCollision();

      // Fall death
      if (player.position.y < -10) {
        die();
      }

      orbit.follow(player.position);

      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-hub.js" defer></script>
</body>
</html>
