<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Obby — 3D паркур | Amal Games</title>
  <meta name="description" content="Нормальный 3D-паркур: чекпоинты, лазеры, камера от третьего лица." />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; background: #0b1220; font-family: system-ui, sans-serif; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff;
      text-shadow: 0 2px 8px #000; font-size: 14px; line-height: 1.45;
      padding: 10px 12px; border-radius: 14px;
      background: rgba(8,12,24,.55); border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
    }
    #ui h2 { font-size: 17px; margin-bottom: 2px; }
    #toast {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      z-index: 15; padding: 10px 18px; border-radius: 12px;
      background: rgba(0,0,0,.72); color: #7dffa8; font-weight: 800;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #win {
      position: fixed; inset: 0; display: none; z-index: 20;
      background: rgba(0,0,0,.82); align-items: center; justify-content: center;
      flex-direction: column; color: #fff;
    }
    #win.show { display: flex; }
    #win h1 { font-size: 34px; color: #6ee7b7; }
    #win button {
      margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none;
      border-radius: 10px; background: #6ee7b7; color: #000; cursor: pointer; font-weight: 800;
    }
    #controls {
      position: fixed; bottom: 12px; left: 12px; color: #e2e8f0;
      text-shadow: 0 1px 4px #000; font-size: 12px; z-index: 10; max-width: 55vw;
      padding: 8px 10px; border-radius: 12px; background: rgba(8,12,24,.5);
    }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px;
      background: rgba(0,0,0,.55); color: #fff; text-decoration: none;
      border-radius: 10px; font-size: 13px; font-weight: 700;
    }
    #mobile-btns {
      position: fixed; bottom: 16px; right: 16px; z-index: 10; display: none; gap: 8px;
    }
    #mobile-btns button {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.28); color: #fff; font-size: 22px;
    }
    @media (pointer: coarse) { #mobile-btns { display: flex; } }
    #admin-shop {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: none; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 96vw;
      padding: 8px; border-radius: 12px; background: rgba(120, 53, 15, .88); border: 1px solid rgba(251, 191, 36, .55);
    }
    #admin-shop.show { display: flex; }
    #admin-shop .label { width: 100%; text-align: center; color: #fde68a; font: 800 11px/1 system-ui, sans-serif; margin-bottom: 2px; }
    #admin-shop button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; color: #111; background: linear-gradient(135deg, #fde68a, #f59e0b); font-weight: 800; }
    #admin-shop button:disabled { opacity: .45; }
    #admin-shop button.owned { background: linear-gradient(135deg, #86efac, #22c55e); }
    #amal-world-root,#amal-world-canvas,#amal-world-dock{display:none!important}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <h2>Obby · 3D паркур</h2>
    <div>Чекпоинт: <span id="cp">старт</span></div>
    <div>Прогресс: <span id="prog">0</span>%</div>
    <div>Смерти: <span id="deaths">0</span></div>
    <div id="admin-tag" style="display:none;margin-top:4px;color:#fde68a;font-weight:800">👑 Админ · эксклюзив</div>
  </div>
  <div id="toast"></div>
  <a id="back" href="../">← Каталог</a>
  <div id="admin-shop">
    <div class="label">👑 Только админ · вещи</div>
    <button id="ex-orb" type="button">Золотая сфера ($0)</button>
    <button id="ex-rainbow" type="button">VIP-радуга ($0)</button>
    <button id="ex-crown" type="button">Статуя короны ($0)</button>
  </div>
  <div id="controls">W — вперёд · Пробел — прыжок · ПКМ — камера · Shift — вниз (полёт)</div>
  <div id="mobile-btns">
    <button type="button" id="m-left">←</button>
    <button type="button" id="m-jump">↑</button>
    <button type="button" id="m-fwd">▲</button>
    <button type="button" id="m-right">→</button>
  </div>
  <div id="win">
    <h1>Финиш!</h1>
    <p>Ты прошёл 3D-паркур.</p>
    <button type="button" id="replay">С начала</button>
  </div>

  <script type="module" src="./main.js?v=1"></script>
  <script src="../shared/amal-owner-powers.js?v=23"></script>
  <script src="../shared/amal-hub.js?v=68"></script>
  <script src="../shared/amal-3d-wip-lock.js?v=2" data-guard="1"></script>
</body>
</html>
