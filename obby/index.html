<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Obby — длинный лазерный паркур</title>
  <meta name="description" content="Один длинный 3D-паркур: чекпоинты, лазеры, камера крутится — бежишь куда смотришь." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1040; font-family: system-ui, sans-serif; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff;
      text-shadow: 1px 1px 3px #000; font-size: 14px; line-height: 1.5;
    }
    #ui h2 { font-size: 18px; margin-bottom: 2px; }
    #toast {
      position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
      z-index: 15; padding: 10px 18px; border-radius: 10px;
      background: rgba(0,0,0,.7); color: #7dffa8; font-weight: 700;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #win {
      position: fixed; inset: 0; display: none; z-index: 20;
      background: rgba(0,0,0,.82); align-items: center; justify-content: center;
      flex-direction: column; color: #fff;
    }
    #win.show { display: flex; }
    #win h1 { font-size: 34px; color: #6ee7b7; }
    #win button, #again-hint button {
      margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none;
      border-radius: 8px; background: #6ee7b7; color: #000; cursor: pointer;
    }
    #controls {
      position: fixed; bottom: 12px; left: 12px; color: #fff;
      text-shadow: 1px 1px 2px #000; font-size: 12px; z-index: 10; max-width: 55vw;
    }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px;
      background: rgba(0,0,0,.5); color: #fff; text-decoration: none;
      border-radius: 6px; font-size: 13px;
    }
    #mobile-btns {
      position: fixed; bottom: 16px; right: 16px; z-index: 10; display: none; gap: 8px;
    }
    #mobile-btns button {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.28); color: #fff; font-size: 22px;
    }
    @media (pointer: coarse) { #mobile-btns { display: flex; } }
    #admin-shop {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: none; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 96vw;
      padding: 8px; border-radius: 12px; background: rgba(120, 53, 15, .88); border: 1px solid rgba(251, 191, 36, .55);
    }
    #admin-shop.show { display: flex; }
    #admin-shop .label { width: 100%; text-align: center; color: #fde68a; font: 800 11px/1 system-ui, sans-serif; margin-bottom: 2px; }
    #admin-shop button { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; color: #111; background: linear-gradient(135deg, #fde68a, #f59e0b); font-weight: 800; }
    #admin-shop button:disabled { opacity: .45; }
    #admin-shop button.owned { background: linear-gradient(135deg, #86efac, #22c55e); }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Obby · Лазерный паркур</h2>
    <div>Чекпоинт: <span id="cp">старт</span></div>
    <div>Прогресс: <span id="prog">0</span>%</div>
    <div>Смерти: <span id="deaths">0</span></div>
    <div id="admin-tag" style="display:none;margin-top:4px;color:#fde68a;font-weight:800">👑 Админ · эксклюзив в магазине</div>
  </div>
  <div id="toast"></div>
  <a id="back" href="../">← Каталог</a>
  <div id="admin-shop">
    <div class="label">👑 Только админ · вещи, не команды</div>
    <button id="ex-orb" type="button">Золотая сфера чекпоинта ($0)</button>
    <button id="ex-rainbow" type="button">VIP-радуга площадка ($0)</button>
    <button id="ex-crown" type="button">Статуя короны ($0)</button>
  </div>
  <div id="controls">W — вперёд по камере · Пробел прыжок/полёт↑ · Shift полёт↓ · ПКМ камера · админ ⚡</div>
  <div id="mobile-btns">
    <button type="button" id="m-left">←</button>
    <button type="button" id="m-jump">↑</button>
    <button type="button" id="m-fwd">▲</button>
    <button type="button" id="m-right">→</button>
  </div>
  <div id="win">
    <h1>Финиш!</h1>
    <p>Ты прошёл весь длинный паркур без телепортов между уровнями.</p>
    <button type="button" id="replay">С начала</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script>
  (function () {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1040);
    scene.fog = new THREE.Fog(0x1a1040, 45, 160);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 6.5,
      pitch: 0.34,
      yaw: Math.PI, // вперёд по трассе (+Z)
      lookOffsetY: 1.15,
      minDist: 3.5,
      maxDist: 22,
      bootstrap: false,
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(12, 28, 8);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x5060a0, 0.55));

    // ——— длинная лёгкая трасса: разные формы платформ ———
    const platforms = [];
    const lasers = [];
    const checkpoints = [];
    let activeCp = 0;
    let deaths = 0;
    let finished = false;
    let FINISH_Z = 280;

    function addShape(opts) {
      const {
        x, y, z,
        w = 3, h = 0.4, d = 3,
        color = 0x60a5fa,
        shape = "box", // box | cylinder | sphere | cone | torus | beam | diamond
        rotX = 0, rotZ = 0, rotY = 0,
      } = opts;

      let geo;
      if (shape === "cylinder") {
        geo = new THREE.CylinderGeometry(Math.max(w, d) / 2, Math.max(w, d) / 2, h, 20);
      } else if (shape === "sphere") {
        geo = new THREE.SphereGeometry(Math.max(w, d) / 2, 16, 12);
      } else if (shape === "cone") {
        geo = new THREE.ConeGeometry(Math.max(w, d) / 2, h * 2.2, 16);
      } else if (shape === "torus") {
        geo = new THREE.TorusGeometry(Math.max(w, d) / 2.4, h * 0.7, 10, 24);
      } else if (shape === "diamond") {
        geo = new THREE.OctahedronGeometry(Math.max(w, d) / 2, 0);
      } else if (shape === "beam") {
        geo = new THREE.BoxGeometry(w, h, d);
      } else {
        geo = new THREE.BoxGeometry(w, h, d);
      }

      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color }));
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotX, rotY, rotZ);
      if (shape === "torus") mesh.rotation.x = Math.PI / 2;
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      // AABB для коллизии (чуть щедрее для лёгкости)
      const bw = shape === "sphere" || shape === "diamond" ? Math.max(w, d) * 0.95 : w;
      const bh = shape === "sphere" ? Math.max(w, d) * 0.7 : shape === "torus" ? h * 1.6 : h;
      const bd = shape === "sphere" || shape === "diamond" ? Math.max(w, d) * 0.95 : d;
      mesh.userData = { w: bw * 1.05, h: Math.max(bh, 0.35), d: bd * 1.05, shape };
      scene.add(mesh);
      platforms.push(mesh);
      return mesh;
    }

    function addPlatform(x, y, z, w, h, d, color) {
      return addShape({ x, y, z, w, h, d, color, shape: "box" });
    }

    function addCheckpoint(x, y, z, name) {
      const pad = addShape({ x, y, z, w: 4, h: 0.45, d: 4, color: 0x22d3ee, shape: "cylinder" });
      const flag = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 2.2, 0.15),
        new THREE.MeshLambertMaterial({ color: 0xfbbf24 })
      );
      flag.position.set(x + 1.4, y + 1.3, z);
      scene.add(flag);
      const banner = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.55),
        new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide })
      );
      banner.position.set(x + 0.9, y + 2.0, z);
      scene.add(banner);
      checkpoints.push({ x, y: y + 1.4, z, name, unlocked: false, pad });
    }

    function addLaser(opts) {
      const {
        x, y, z, len = 4, axis = "x",
        mode = "static",
        color = 0xff2255,
        speed = 1,
        amp = 2,
        period = 1.2,
        phase = 0,
      } = opts;
      const geo =
        axis === "x"
          ? new THREE.BoxGeometry(len, 0.12, 0.12)
          : new THREE.BoxGeometry(0.12, 0.12, len);
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.92,
      });
      const beam = new THREE.Mesh(geo, mat);
      beam.position.set(x, y, z);
      scene.add(beam);
      const glow = new THREE.PointLight(color, 0.55, 6);
      glow.position.copy(beam.position);
      scene.add(glow);
      lasers.push({
        beam, glow, base: { x, y, z }, len, axis, mode, speed, amp, period, phase, color, active: true,
      });
    }

    // === СТАРТ ===
    addShape({ x: 0, y: 0, z: 0, w: 8, h: 0.5, d: 8, color: 0x4ade80, shape: "cylinder" });
    addCheckpoint(0, 0, 0, "Старт");

    // Admin-only visual props (NOT in platforms[] — no parkour collision)
    const exclusiveOwned = { orb: false, rainbow: false, crown: false };
    const exclusiveMeshes = [];

    function isAdmin() {
      try {
        if (window.__AMAL_OWNER__ === true || window.__AMAL_GOD__ === true || window.__AMAL_LEGEND__) return true;
        if (window.AmalPowers && typeof AmalPowers.isOwner === "function" && AmalPowers.isOwner()) return true;
        if (window.AmalHub && typeof AmalHub.isGameAdmin === "function" && AmalHub.isGameAdmin("obby")) return true;
        if (window.AmalHub && typeof AmalHub.isOwner === "function" && AmalHub.isOwner()) return true;
      } catch (_) {}
      return false;
    }

    function trackExclusive(mesh) {
      scene.add(mesh);
      exclusiveMeshes.push(mesh);
      return mesh;
    }

    function placeOrb() {
      // Side of start pad — decorative only
      const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 16, 16),
        new THREE.MeshLambertMaterial({ color: 0xfbbf24, emissive: 0xb45309, transparent: true, opacity: 0.92 })
      );
      orb.position.set(-5.8, 1.6, -1.5);
      trackExclusive(orb);
      const glow = new THREE.PointLight(0xfbbf24, 1.2, 8);
      glow.position.set(-5.8, 1.8, -1.5);
      trackExclusive(glow);
    }

    function placeRainbowPad() {
      const colors = [0xef4444, 0xf59e0b, 0x22c55e, 0x3b82f6, 0xa855f7];
      for (let i = 0; i < 5; i++) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.7 + i * 0.18, 0.06, 6, 20),
          new THREE.MeshLambertMaterial({ color: colors[i] })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.set(5.8, 0.12 + i * 0.02, -1.5);
        trackExclusive(ring);
      }
    }

    function placeCrownStatue() {
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.65, 0.35, 10),
        new THREE.MeshLambertMaterial({ color: 0x78716c })
      );
      base.position.set(-5.8, 0.2, 2.5);
      trackExclusive(base);
      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.45, 0.2, 8),
        new THREE.MeshLambertMaterial({ color: 0xfbbf24 })
      );
      band.position.set(-5.8, 0.7, 2.5);
      trackExclusive(band);
      for (let i = 0; i < 5; i++) {
        const spike = new THREE.Mesh(
          new THREE.ConeGeometry(0.1, 0.4, 5),
          new THREE.MeshLambertMaterial({ color: i % 2 ? 0xfde68a : 0xf59e0b })
        );
        const a = (i / 5) * Math.PI * 2;
        spike.position.set(-5.8 + Math.cos(a) * 0.28, 1.05, 2.5 + Math.sin(a) * 0.28);
        trackExclusive(spike);
      }
    }

    const exclusiveDefs = {
      orb: { id: "ex-orb", place: placeOrb },
      rainbow: { id: "ex-rainbow", place: placeRainbowPad },
      crown: { id: "ex-crown", place: placeCrownStatue },
    };

    function claimExclusive(key) {
      if (!isAdmin() || exclusiveOwned[key]) return;
      exclusiveOwned[key] = true;
      exclusiveDefs[key].place();
      syncAdminShop();
    }

    function syncAdminShop() {
      const admin = isAdmin();
      const shop = document.getElementById("admin-shop");
      const tag = document.getElementById("admin-tag");
      if (shop) shop.classList.toggle("show", admin);
      if (tag) tag.style.display = admin ? "block" : "none";
      if (!admin) return;
      Object.keys(exclusiveDefs).forEach((key) => {
        const btn = document.getElementById(exclusiveDefs[key].id);
        if (!btn) return;
        btn.disabled = !!exclusiveOwned[key];
        btn.classList.toggle("owned", !!exclusiveOwned[key]);
        if (exclusiveOwned[key] && !btn.dataset.ownedLabel) {
          btn.dataset.ownedLabel = "1";
          btn.textContent = btn.textContent.replace(/\s*\(\$0\)/, "") + " ✓";
        }
      });
    }

    // Секция 1 — кубы + диски, почти ровно
    let z = 8;
    for (let i = 0; i < 8; i++) {
      const shapes = ["box", "cylinder", "box", "cylinder"];
      addShape({
        x: (i % 2 ? 0.5 : -0.5),
        y: i * 0.12,
        z: z,
        w: 3.6, h: 0.4, d: 3.4,
        color: 0x60a5fa,
        shape: shapes[i % shapes.length],
      });
      z += 3.8;
    }
    addCheckpoint(0, 1.0, z, "Чек 1");
    z += 6;

    // Секция 2 — сферы и «блинчики», редкий мягкий лазер
    for (let i = 0; i < 9; i++) {
      addShape({
        x: (i % 3 - 1) * 0.7,
        y: 1.1 + i * 0.1,
        z: z,
        w: 3.2, h: 0.45, d: 3.2,
        color: i % 2 ? 0xa78bfa : 0xc4b5fd,
        shape: i % 2 ? "sphere" : "cylinder",
      });
      if (i === 3 || i === 7) {
        addLaser({
          x: 0, y: 2.6 + i * 0.1, z, len: 3.5, axis: "x",
          mode: "blink", period: 3.0, phase: i, color: 0xff5588,
        });
      }
      z += 3.6;
    }
    addCheckpoint(0, 2.0, z, "Чек 2");
    z += 6;

    // Секция 3 — длинные балки (beam) как мостики
    for (let i = 0; i < 7; i++) {
      addShape({
        x: 0, y: 2.1, z: z,
        w: 2.2, h: 0.35, d: 5.5,
        color: 0x34d399,
        shape: "beam",
      });
      if (i % 3 === 1) {
        addLaser({
          x: 0, y: 3.3, z, len: 4, axis: "x",
          mode: "sweep", speed: 0.4, amp: 0.8, phase: i, color: 0xff3355,
        });
      }
      z += 5.2;
    }
    addCheckpoint(0, 2.2, z, "Чек 3");
    z += 6;

    // Секция 4 — кольца (torus) + конусы-пьедесталы
    for (let i = 0; i < 8; i++) {
      if (i % 2 === 0) {
        addShape({
          x: (i % 4 < 2 ? -0.6 : 0.6), y: 2.3 + i * 0.12, z,
          w: 3.8, h: 0.35, d: 3.8, color: 0xf472b6, shape: "torus",
        });
      } else {
        addShape({
          x: 0, y: 2.0 + i * 0.12, z,
          w: 2.8, h: 0.9, d: 2.8, color: 0xfb7185, shape: "cone",
        });
        // плоская шапка на конусе
        addShape({
          x: 0, y: 2.7 + i * 0.12, z,
          w: 2.6, h: 0.3, d: 2.6, color: 0xfda4af, shape: "cylinder",
        });
      }
      z += 4.0;
    }
    addCheckpoint(0, 3.2, z, "Чек 4");
    z += 6;

    // Секция 5 — ромбы (diamond) и широкие плиты
    for (let i = 0; i < 8; i++) {
      addShape({
        x: (i % 2 ? 1.0 : -1.0) * 0.5,
        y: 3.2 + i * 0.15,
        z,
        w: 3.0, h: 1.2, d: 3.0,
        color: 0x38bdf8,
        shape: i % 2 ? "diamond" : "box",
      });
      z += 3.7;
    }
    addCheckpoint(0, 4.2, z, "Чек 5");
    z += 6;

    // Секция 6 — чередование всего, очень широко, почти без лазеров
    const mix = ["box", "cylinder", "sphere", "torus", "beam", "diamond"];
    for (let i = 0; i < 12; i++) {
      const sh = mix[i % mix.length];
      addShape({
        x: Math.sin(i * 0.7) * 0.8,
        y: 4.3 + i * 0.1,
        z,
        w: sh === "beam" ? 2.4 : 3.4,
        h: sh === "beam" ? 0.35 : 0.45,
        d: sh === "beam" ? 4.8 : 3.4,
        color: [0x818cf8, 0xa78bfa, 0x67e8f9, 0x86efac, 0xfcd34d, 0xf9a8d4][i % 6],
        shape: sh,
      });
      if (i === 5) {
        addLaser({
          x: 0, y: 5.6, z, len: 3.2, axis: "x",
          mode: "blink", period: 3.2, phase: 0, color: 0xff6644,
        });
      }
      z += sh === "beam" ? 4.6 : 3.8;
    }
    addCheckpoint(0, 5.4, z, "Чек 6");
    z += 6;

    // Секция 7 — широкий коридор из цилиндров + лёгкий финал
    addShape({ x: 0, y: 5.4, z: z, w: 5, h: 0.4, d: 12, color: 0x7dd3fc, shape: "box" });
    z += 8;
    for (let i = 0; i < 6; i++) {
      addShape({
        x: (i % 2 ? 1.2 : -1.2) * 0.4,
        y: 5.5 + i * 0.08,
        z,
        w: 3.5, h: 0.4, d: 3.5,
        color: 0xc084fc,
        shape: "cylinder",
      });
      z += 3.5;
    }

    // Финиш
    FINISH_Z = z + 2;
    addShape({ x: 0, y: 6.0, z: FINISH_Z, w: 9, h: 0.55, d: 9, color: 0xfbbf24, shape: "cylinder" });
    const finishRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.0, 0.14, 8, 28),
      new THREE.MeshBasicMaterial({ color: 0xfde68a })
    );
    finishRing.position.set(0, 8.0, FINISH_Z);
    finishRing.rotation.x = Math.PI / 2;
    scene.add(finishRing);

    // Игрок
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(0.75, 1.5, 0.75),
      new THREE.MeshLambertMaterial({ color: 0x3b82f6 })
    );
    player.castShadow = true;
    scene.add(player);

    // Невидимый пол только для хозяина (другие его не видят и не имеют)
    const safetyFloor = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 0.25, 3.2),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.0,
        depthWrite: false,
      })
    );
    safetyFloor.visible = false;
    scene.add(safetyFloor);

    let vx = 0, vy = 0, vz = 0;
    let onGround = false;
    const GRAVITY = -26;
    const JUMP = 12;
    let moveSpeed = 9.5;

    const admin = {
      god: false,
      fly: false,
      floor: false,
      speed: false,
    };

    function isSiteOwner() {
      try {
        if (window.__AMAL_OWNER__ || window.__AMAL_GOD__ || window.__AMAL_LEGEND__) return true;
        if (window.AmalPowers && AmalPowers.isOwner && AmalPowers.isOwner()) return true;
        if (window.AmalHub && AmalHub.isOwner && AmalHub.isOwner()) return true;
      } catch (_) {}
      return false;
    }

    function applyOwnerDefaults() {
      if (!isSiteOwner()) return;
      admin.god = true;
      admin.fly = true;
      admin.floor = true;
      admin.speed = true;
      moveSpeed = 13;
      toast("Админ Obby: полёт · ∞ · невидимый пол");
    }

    function handlePower(detail) {
      const type = detail && detail.type;
      if (!type) return;
      if (type === "god" || type === "owner-legend") {
        admin.god = true;
        toast("🛡 Бессмертие");
      }
      if (type === "obby-fly") {
        admin.fly = !admin.fly;
        toast(admin.fly ? "🕊 Полёт ВКЛ" : "Полёт ВЫКЛ");
      }
      if (type === "obby-floor") {
        admin.floor = !admin.floor;
        if (!admin.floor) safetyFloor.visible = false;
        toast(admin.floor ? "⬛ Невидимый пол ВКЛ (только ты)" : "Невидимый пол ВЫКЛ");
      }
      if (type === "speed") {
        admin.speed = true;
        moveSpeed = 13;
        toast("⚡ Супер-бег");
      }
      if (type === "obby-cp") {
        activeCp = Math.min(activeCp + 1, checkpoints.length - 1);
        spawnAtCheckpoint();
        toast("Чек: " + checkpoints[activeCp].name);
      }
      if (type === "obby-finish") {
        player.position.set(0, 8, FINISH_Z);
        vx = vy = vz = 0;
        toast("🏁 Финиш");
      }
      if (type === "max") {
        admin.god = true;
        admin.fly = true;
        admin.floor = true;
        admin.speed = true;
        moveSpeed = 14;
        toast("⚡ ВСЁ НА МАКС");
      }
    }

    window.addEventListener("amal-power", (e) => handlePower(e.detail || {}));
    window.addEventListener("amal-powers-applied", () => {
      applyOwnerDefaults();
      syncAdminShop();
    });
    window.addEventListener("amal-owner-changed", () => {
      applyOwnerDefaults();
      syncAdminShop();
    });
    setTimeout(applyOwnerDefaults, 400);
    Object.keys(exclusiveDefs).forEach((key) => {
      document.getElementById(exclusiveDefs[key].id).addEventListener("click", () => claimExclusive(key));
    });
    syncAdminShop();
    setTimeout(syncAdminShop, 200);
    setTimeout(syncAdminShop, 1000);

    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    let mLeft = false, mRight = false, mFwd = false, mJump = false;
    const bindHold = (id, set) => {
      const el = document.getElementById(id);
      const on = (ev) => { ev.preventDefault(); set(true); };
      const off = (ev) => { ev.preventDefault(); set(false); };
      el.addEventListener("pointerdown", on);
      el.addEventListener("pointerup", off);
      el.addEventListener("pointerleave", off);
      el.addEventListener("pointercancel", off);
    };
    bindHold("m-left", (v) => (mLeft = v));
    bindHold("m-right", (v) => (mRight = v));
    bindHold("m-fwd", (v) => (mFwd = v));
    document.getElementById("m-jump").addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      mJump = true;
      setTimeout(() => (mJump = false), 120);
    });

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function spawnAtCheckpoint() {
      const cp = checkpoints[activeCp];
      player.position.set(cp.x, cp.y, cp.z);
      vx = vy = vz = 0;
      finished = false;
      document.getElementById("win").classList.remove("show");
      updateHud();
    }

    function updateHud() {
      document.getElementById("cp").textContent = checkpoints[activeCp].name;
      document.getElementById("deaths").textContent = String(deaths);
      const startZ = checkpoints[0].z;
      const p = Math.max(0, Math.min(100, Math.round(((player.position.z - startZ) / (FINISH_Z - startZ)) * 100)));
      document.getElementById("prog").textContent = String(p);
    }

    function die(reason) {
      if (finished) return;
      if (admin.god || window.__AMAL_GOD__) {
        // Бессмертие: не умираем от лазеров
        toast("🛡 " + (reason || "блок") + " — бессмертие");
        return;
      }
      deaths++;
      toast(reason || "Ай!");
      spawnAtCheckpoint();
    }

    function updateSafetyFloor() {
      // Только хозяин с включённым полом — маленький невидимый пол под ногами при падении
      const ownerFloor = admin.floor && isSiteOwner();
      if (!ownerFloor) {
        safetyFloor.visible = false;
        return;
      }
      // Появляется, когда падаешь ниже трассы; следует за тобой
      if (player.position.y < 2.5 || vy < -2) {
        safetyFloor.visible = true;
        safetyFloor.position.set(player.position.x, Math.min(player.position.y - 0.9, -0.5), player.position.z);
      }
      if (!safetyFloor.visible) return;

      const pw = 0.35;
      const ph = 0.75;
      const bx = safetyFloor.position.x;
      const by = safetyFloor.position.y;
      const bz = safetyFloor.position.z;
      const hw = 1.6;
      const hh = 0.125;
      const hd = 1.6;
      const px = player.position.x;
      const py = player.position.y;
      const pz = player.position.z;
      if (
        px + pw > bx - hw &&
        px - pw < bx + hw &&
        pz + pw > bz - hd &&
        pz - pw < bz + hd &&
        py - ph <= by + hh + 0.15 &&
        py - ph > by - hh - 0.5 &&
        vy <= 0
      ) {
        player.position.y = by + hh + ph;
        vy = 0;
        onGround = true;
      }
    }

    function checkPlatforms() {
      const px = player.position.x;
      const py = player.position.y;
      const pz = player.position.z;
      const pw = 0.35;
      const ph = 0.75;
      onGround = false;

      for (const p of platforms) {
        const d = p.userData;
        const bx = p.position.x;
        const by = p.position.y;
        const bz = p.position.z;
        const hw = d.w / 2;
        const hh = d.h / 2;
        const hd = d.d / 2;
        if (
          px + pw > bx - hw &&
          px - pw < bx + hw &&
          pz + pw > bz - hd &&
          pz - pw < bz + hd
        ) {
          if (py - ph <= by + hh && py - ph > by - hh - 0.35 && vy <= 0) {
            player.position.y = by + hh + ph;
            vy = 0;
            onGround = true;
          }
        }
      }
    }

    function checkCheckpoints() {
      for (let i = 0; i < checkpoints.length; i++) {
        const cp = checkpoints[i];
        if (i <= activeCp) continue;
        if (Math.hypot(player.position.x - cp.x, player.position.z - cp.z) < 2.2 &&
            Math.abs(player.position.y - cp.y) < 2.5) {
          activeCp = i;
          cp.unlocked = true;
          toast("Чекпоинт: " + cp.name);
          updateHud();
        }
      }
    }

    function updateLasers(t, dt) {
      for (const L of lasers) {
        let x = L.base.x;
        let y = L.base.y;
        let z = L.base.z;
        L.active = true;

        if (L.mode === "sweep") {
          const off = Math.sin(t * L.speed + L.phase) * L.amp;
          if (L.axis === "x") z = L.base.z + off;
          else x = L.base.x + off;
        } else if (L.mode === "blink") {
          const wave = Math.sin(t * ((Math.PI * 2) / L.period) + L.phase);
          const on = wave > 0.35;
          L.active = on;
          L.beam.visible = on;
          L.glow.visible = on;
          L.beam.material.opacity = on ? 0.95 : 0;
        } else if (L.mode === "spin") {
          L.beam.rotation.y += L.speed * dt;
        }

        if (L.mode !== "blink" || L.active) {
          L.beam.position.set(x, y, z);
          L.glow.position.set(x, y, z);
        }

        if (!L.active || !L.beam.visible) continue;
        if (admin.god || window.__AMAL_GOD__) continue;

        const hw = L.axis === "x" ? L.len / 2 : 0.25;
        const hd = L.axis === "z" ? L.len / 2 : 0.25;
        const spinPad = L.mode === "spin" ? L.len / 2 : 0;
        const dx = Math.abs(player.position.x - L.beam.position.x);
        const dy = Math.abs(player.position.y - L.beam.position.y);
        const dz = Math.abs(player.position.z - L.beam.position.z);
        if (L.mode === "spin") {
          if (Math.hypot(dx, dz) < spinPad * 0.75 + 0.2 && dy < 0.75) {
            die("Лазер!");
            return;
          }
        } else if (dx < hw * 0.85 + 0.2 && dy < 0.7 && dz < hd * 0.85 + 0.2) {
          die("Лазер!");
          return;
        }
      }
    }

    document.getElementById("replay").addEventListener("click", () => {
      activeCp = 0;
      deaths = 0;
      spawnAtCheckpoint();
    });

    checkpoints[0].unlocked = true;
    spawnAtCheckpoint();

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const t = now / 1000;

      if (!finished) {
        let wishX = 0;
        let wishZ = 0;
        const yaw = orbit.state.yaw;
        const fwdX = -Math.sin(yaw);
        const fwdZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        if (keys.KeyW || keys.ArrowUp || mFwd) {
          wishX += fwdX;
          wishZ += fwdZ;
        }
        if (keys.KeyS || keys.ArrowDown) {
          wishX -= fwdX;
          wishZ -= fwdZ;
        }
        if (keys.KeyD || keys.ArrowRight || mRight) {
          wishX += rightX;
          wishZ += rightZ;
        }
        if (keys.KeyA || keys.ArrowLeft || mLeft) {
          wishX -= rightX;
          wishZ -= rightZ;
        }

        if (wishX || wishZ) {
          const len = Math.hypot(wishX, wishZ) || 1;
          wishX /= len;
          wishZ /= len;
        }

        const spd = admin.speed ? moveSpeed : 9.5;

        if (admin.fly) {
          // Полёт: Пробел вверх, Shift вниз, без гравитации
          vy = 0;
          if (keys.Space || mJump) vy = 10;
          if (keys.ShiftLeft || keys.ShiftRight || keys.ControlLeft) vy = -10;
          vx = wishX * spd;
          vz = wishZ * spd;
        } else {
          if ((keys.Space || mJump) && onGround) {
            vy = JUMP;
            onGround = false;
          }
          vx = wishX * spd;
          vz = wishZ * spd;
          vy += GRAVITY * dt;
        }

        player.position.x += vx * dt;
        player.position.y += vy * dt;
        player.position.z += vz * dt;

        checkPlatforms();
        updateSafetyFloor();
        checkCheckpoints();
        updateLasers(t, dt);

        if (player.position.y < -8) {
          if (admin.floor && isSiteOwner()) {
            // Невидимый пол ловит падение — не умираешь
            safetyFloor.visible = true;
            safetyFloor.position.set(player.position.x, -1, player.position.z);
            player.position.y = -1 + 0.125 + 0.75;
            vy = 0;
            onGround = true;
          } else if (admin.god) {
            player.position.y = checkpoints[activeCp].y;
            vy = 0;
          } else {
            die("Упал!");
          }
        }

        if (!finished && player.position.z > FINISH_Z - 1.5 && Math.abs(player.position.x) < 3.2) {
          finished = true;
          document.getElementById("win").classList.add("show");
          toast("Финиш!");
        }

        updateHud();
      }

      finishRing.rotation.z += dt * 1.5;
      exclusiveMeshes.forEach((o, i) => {
        if (o.isLight) return;
        if (o.rotation) o.rotation.y += 0.008 + (i % 3) * 0.002;
        if (o.geometry && o.geometry.type === "SphereGeometry") {
          o.position.y = 1.6 + Math.sin(t * 2 + i) * 0.15;
        }
      });
      orbit.follow(player.position);
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-owner-powers.js?v=17"></script>
  <script src="../shared/amal-hub.js?v=28"></script>
