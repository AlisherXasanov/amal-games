<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Obby — длинный лазерный паркур</title>
  <meta name="description" content="Один длинный 3D-паркур: чекпоинты, лазеры, камера крутится — бежишь куда смотришь." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1040; font-family: system-ui, sans-serif; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10; color: #fff;
      text-shadow: 1px 1px 3px #000; font-size: 14px; line-height: 1.5;
    }
    #ui h2 { font-size: 18px; margin-bottom: 2px; }
    #toast {
      position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
      z-index: 15; padding: 10px 18px; border-radius: 10px;
      background: rgba(0,0,0,.7); color: #7dffa8; font-weight: 700;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #win {
      position: fixed; inset: 0; display: none; z-index: 20;
      background: rgba(0,0,0,.82); align-items: center; justify-content: center;
      flex-direction: column; color: #fff;
    }
    #win.show { display: flex; }
    #win h1 { font-size: 34px; color: #6ee7b7; }
    #win button, #again-hint button {
      margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none;
      border-radius: 8px; background: #6ee7b7; color: #000; cursor: pointer;
    }
    #controls {
      position: fixed; bottom: 12px; left: 12px; color: #fff;
      text-shadow: 1px 1px 2px #000; font-size: 12px; z-index: 10; max-width: 55vw;
    }
    #back {
      position: fixed; top: 12px; right: 12px; z-index: 10; padding: 8px 14px;
      background: rgba(0,0,0,.5); color: #fff; text-decoration: none;
      border-radius: 6px; font-size: 13px;
    }
    #mobile-btns {
      position: fixed; bottom: 16px; right: 16px; z-index: 10; display: none; gap: 8px;
    }
    #mobile-btns button {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: rgba(255,255,255,.28); color: #fff; font-size: 22px;
    }
    @media (pointer: coarse) { #mobile-btns { display: flex; } }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Obby · Лазерный паркур</h2>
    <div>Чекпоинт: <span id="cp">старт</span></div>
    <div>Прогресс: <span id="prog">0</span>%</div>
    <div>Смерти: <span id="deaths">0</span></div>
  </div>
  <div id="toast"></div>
  <a id="back" href="../">← Каталог</a>
  <div id="controls">W — вперёд куда смотрит камера · A/D влево-вправо · Пробел прыжок · ПКМ крутить</div>
  <div id="mobile-btns">
    <button type="button" id="m-left">←</button>
    <button type="button" id="m-jump">↑</button>
    <button type="button" id="m-fwd">▲</button>
    <button type="button" id="m-right">→</button>
  </div>
  <div id="win">
    <h1>Финиш!</h1>
    <p>Ты прошёл весь длинный паркур без телепортов между уровнями.</p>
    <button type="button" id="replay">С начала</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script>
  (function () {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1040);
    scene.fog = new THREE.Fog(0x1a1040, 35, 110);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const orbit = AmalOrbitCam.attach(camera, renderer.domElement, {
      distance: 6.5,
      pitch: 0.34,
      yaw: Math.PI, // вперёд по трассе (+Z)
      lookOffsetY: 1.15,
      minDist: 3.5,
      maxDist: 22,
      bootstrap: false,
    });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(12, 28, 8);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x5060a0, 0.55));

    // ——— курс: одна длинная трасса вдоль +Z ———
    const platforms = [];
    const lasers = [];
    const checkpoints = []; // { z, mesh, name, unlocked }
    let activeCp = 0;
    let deaths = 0;
    let finished = false;
    const FINISH_Z = 148;

    function addPlatform(x, y, z, w, h, d, color) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
      );
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      mesh.userData = { w, h, d };
      scene.add(mesh);
      platforms.push(mesh);
      return mesh;
    }

    function addCheckpoint(x, y, z, name) {
      const pad = addPlatform(x, y, z, 3.2, 0.45, 3.2, 0x22d3ee);
      const flag = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 2.2, 0.15),
        new THREE.MeshLambertMaterial({ color: 0xfbbf24 })
      );
      flag.position.set(x + 1.2, y + 1.3, z);
      scene.add(flag);
      const banner = new THREE.Mesh(
        new THREE.PlaneGeometry(0.9, 0.55),
        new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide })
      );
      banner.position.set(x + 0.7, y + 2.0, z);
      scene.add(banner);
      checkpoints.push({ x, y: y + 1.4, z, name, unlocked: false, pad });
    }

    function addLaser(opts) {
      const {
        x, y, z, len = 4, axis = "x", // beam along x or z
        mode = "static", // static | sweep | blink | spin
        color = 0xff2255,
        speed = 1,
        amp = 2,
        period = 1.2,
        phase = 0,
      } = opts;
      const geo =
        axis === "x"
          ? new THREE.BoxGeometry(len, 0.12, 0.12)
          : new THREE.BoxGeometry(0.12, 0.12, len);
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.92,
      });
      const beam = new THREE.Mesh(geo, mat);
      beam.position.set(x, y, z);
      scene.add(beam);
      const glow = new THREE.PointLight(color, 0.55, 6);
      glow.position.copy(beam.position);
      scene.add(glow);
      lasers.push({
        beam,
        glow,
        base: { x, y, z },
        len,
        axis,
        mode,
        speed,
        amp,
        period,
        phase,
        color,
        active: true,
      });
    }

    // Старт
    addPlatform(0, 0, 0, 6, 0.5, 6, 0x4ade80);
    addCheckpoint(0, 0, 0, "Старт");

    // Секция 1 — разминка
    for (let i = 1; i <= 6; i++) {
      addPlatform((i % 2 === 0 ? 1.2 : -1.2), i * 0.35, 6 + i * 3.2, 2.2, 0.4, 2.2, 0x60a5fa);
    }
    addPlatform(0, 2.2, 28, 4, 0.45, 4, 0x818cf8);
    addCheckpoint(0, 2.2, 28, "Чек 1");

    // Секция 2 — узкие плиты + статичные лазеры
    for (let i = 0; i < 8; i++) {
      addPlatform((i % 3) - 1, 2.4 + (i % 2) * 0.4, 33 + i * 2.8, 1.4, 0.35, 1.4, 0xa78bfa);
      if (i % 2 === 1) {
        addLaser({
          x: 0,
          y: 3.5 + (i % 2) * 0.3,
          z: 33 + i * 2.8,
          len: 5,
          axis: "x",
          mode: "blink",
          period: 1.1 + (i % 3) * 0.25,
          phase: i * 0.4,
          color: 0xff3366,
        });
      }
    }
    addPlatform(0, 3.2, 56, 4, 0.45, 4, 0x818cf8);
    addCheckpoint(0, 3.2, 56, "Чек 2");

    // Секция 3 — sweeping лазеры
    for (let i = 0; i < 7; i++) {
      addPlatform(0, 3.4, 61 + i * 3.5, 3.5, 0.4, 2.2, 0x34d399);
      addLaser({
        x: 0,
        y: 4.5,
        z: 61 + i * 3.5,
        len: 6,
        axis: "x",
        mode: "sweep",
        speed: 1.2 + i * 0.15,
        amp: 2.2,
        phase: i * 0.7,
        color: 0xff0044,
      });
    }
    addPlatform(0, 3.8, 88, 4.5, 0.45, 4, 0x818cf8);
    addCheckpoint(0, 3.8, 88, "Чек 3");

    // Секция 4 — спиральные/spin лазеры + высокие прыжки
    for (let i = 0; i < 6; i++) {
      const ang = i * 0.9;
      addPlatform(Math.sin(ang) * 2.5, 4 + i * 0.7, 94 + i * 3.4, 1.8, 0.35, 1.8, 0xf472b6);
      addLaser({
        x: Math.sin(ang) * 2.5,
        y: 5.2 + i * 0.7,
        z: 94 + i * 3.4,
        len: 3.5,
        axis: "x",
        mode: "spin",
        speed: 1.6,
        phase: i,
        color: 0xff66aa,
      });
    }
    addPlatform(0, 7.5, 116, 4, 0.45, 4, 0x818cf8);
    addCheckpoint(0, 7.5, 116, "Чек 4");

    // Секция 5 — коридор лазеров (вертикальные «стены»)
    addPlatform(0, 7.5, 122, 3, 0.4, 8, 0x38bdf8);
    for (let i = 0; i < 5; i++) {
      addLaser({
        x: -1.3 + (i % 2) * 2.6,
        y: 8.4,
        z: 120 + i * 1.6,
        len: 2.6,
        axis: "z",
        mode: i % 2 ? "blink" : "sweep",
        speed: 2,
        amp: 1.4,
        period: 0.85,
        phase: i * 0.5,
        color: 0xff2200,
      });
    }
    for (let i = 0; i < 5; i++) {
      addPlatform((i % 2 ? 1.5 : -1.5), 7.8 + i * 0.25, 130 + i * 2.6, 1.5, 0.35, 1.5, 0xc084fc);
    }

    // Финиш
    addPlatform(0, 8.5, FINISH_Z, 6, 0.5, 6, 0xfbbf24);
    const finishRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.6, 0.12, 8, 24),
      new THREE.MeshBasicMaterial({ color: 0xfde68a })
    );
    finishRing.position.set(0, 10.2, FINISH_Z);
    finishRing.rotation.x = Math.PI / 2;
    scene.add(finishRing);

    // Игрок
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(0.75, 1.5, 0.75),
      new THREE.MeshLambertMaterial({ color: 0x3b82f6 })
    );
    player.castShadow = true;
    scene.add(player);

    let vx = 0, vy = 0, vz = 0;
    let onGround = false;
    const GRAVITY = -28;
    const JUMP = 11;
    const SPEED = 8.5;

    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    let mLeft = false, mRight = false, mFwd = false, mJump = false;
    const bindHold = (id, set) => {
      const el = document.getElementById(id);
      const on = (ev) => { ev.preventDefault(); set(true); };
      const off = (ev) => { ev.preventDefault(); set(false); };
      el.addEventListener("pointerdown", on);
      el.addEventListener("pointerup", off);
      el.addEventListener("pointerleave", off);
      el.addEventListener("pointercancel", off);
    };
    bindHold("m-left", (v) => (mLeft = v));
    bindHold("m-right", (v) => (mRight = v));
    bindHold("m-fwd", (v) => (mFwd = v));
    document.getElementById("m-jump").addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      mJump = true;
      setTimeout(() => (mJump = false), 120);
    });

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function spawnAtCheckpoint() {
      const cp = checkpoints[activeCp];
      player.position.set(cp.x, cp.y, cp.z);
      vx = vy = vz = 0;
      finished = false;
      document.getElementById("win").classList.remove("show");
      updateHud();
    }

    function updateHud() {
      document.getElementById("cp").textContent = checkpoints[activeCp].name;
      document.getElementById("deaths").textContent = String(deaths);
      const startZ = checkpoints[0].z;
      const p = Math.max(0, Math.min(100, Math.round(((player.position.z - startZ) / (FINISH_Z - startZ)) * 100)));
      document.getElementById("prog").textContent = String(p);
    }

    function die(reason) {
      if (finished) return;
      deaths++;
      toast(reason || "Ай!");
      spawnAtCheckpoint();
    }

    function checkPlatforms() {
      const px = player.position.x;
      const py = player.position.y;
      const pz = player.position.z;
      const pw = 0.35;
      const ph = 0.75;
      onGround = false;

      for (const p of platforms) {
        const d = p.userData;
        const bx = p.position.x;
        const by = p.position.y;
        const bz = p.position.z;
        const hw = d.w / 2;
        const hh = d.h / 2;
        const hd = d.d / 2;
        if (
          px + pw > bx - hw &&
          px - pw < bx + hw &&
          pz + pw > bz - hd &&
          pz - pw < bz + hd
        ) {
          if (py - ph <= by + hh && py - ph > by - hh - 0.35 && vy <= 0) {
            player.position.y = by + hh + ph;
            vy = 0;
            onGround = true;
          }
        }
      }
    }

    function checkCheckpoints() {
      for (let i = 0; i < checkpoints.length; i++) {
        const cp = checkpoints[i];
        if (i <= activeCp) continue;
        if (Math.hypot(player.position.x - cp.x, player.position.z - cp.z) < 2.2 &&
            Math.abs(player.position.y - cp.y) < 2.5) {
          activeCp = i;
          cp.unlocked = true;
          toast("Чекпоинт: " + cp.name);
          updateHud();
        }
      }
    }

    function updateLasers(t, dt) {
      for (const L of lasers) {
        let x = L.base.x;
        let y = L.base.y;
        let z = L.base.z;
        L.active = true;

        if (L.mode === "sweep") {
          const off = Math.sin(t * L.speed + L.phase) * L.amp;
          if (L.axis === "x") z = L.base.z + off;
          else x = L.base.x + off;
        } else if (L.mode === "blink") {
          const on = Math.sin(t * ((Math.PI * 2) / L.period) + L.phase) > 0;
          L.active = on;
          L.beam.visible = on;
          L.glow.visible = on;
          L.beam.material.opacity = on ? 0.95 : 0;
        } else if (L.mode === "spin") {
          L.beam.rotation.y += L.speed * dt;
        }

        if (L.mode !== "blink" || L.active) {
          L.beam.position.set(x, y, z);
          L.glow.position.set(x, y, z);
        }

        if (!L.active || !L.beam.visible) continue;

        // AABB vs player
        const hw = L.axis === "x" ? L.len / 2 : 0.25;
        const hd = L.axis === "z" ? L.len / 2 : 0.25;
        // spin: rough circle radius
        const spinPad = L.mode === "spin" ? L.len / 2 : 0;
        const dx = Math.abs(player.position.x - L.beam.position.x);
        const dy = Math.abs(player.position.y - L.beam.position.y);
        const dz = Math.abs(player.position.z - L.beam.position.z);
        if (L.mode === "spin") {
          if (Math.hypot(dx, dz) < spinPad + 0.35 && dy < 1.0) {
            die("Лазер!");
            return;
          }
        } else if (dx < hw + 0.35 && dy < 0.85 && dz < hd + 0.35) {
          die("Лазер!");
          return;
        }
      }
    }

    document.getElementById("replay").addEventListener("click", () => {
      activeCp = 0;
      deaths = 0;
      spawnAtCheckpoint();
    });

    checkpoints[0].unlocked = true;
    spawnAtCheckpoint();

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      const t = now / 1000;

      if (!finished) {
        // Движение относительно камеры: W = куда смотришь
        let wishX = 0;
        let wishZ = 0;
        const yaw = orbit.state.yaw;
        const fwdX = -Math.sin(yaw);
        const fwdZ = -Math.cos(yaw);
        const rightX = Math.cos(yaw);
        const rightZ = -Math.sin(yaw);

        if (keys.KeyW || keys.ArrowUp || mFwd) {
          wishX += fwdX;
          wishZ += fwdZ;
        }
        if (keys.KeyS || keys.ArrowDown) {
          wishX -= fwdX;
          wishZ -= fwdZ;
        }
        if (keys.KeyD || keys.ArrowRight || mRight) {
          wishX += rightX;
          wishZ += rightZ;
        }
        if (keys.KeyA || keys.ArrowLeft || mLeft) {
          wishX -= rightX;
          wishZ -= rightZ;
        }

        if (wishX || wishZ) {
          const len = Math.hypot(wishX, wishZ) || 1;
          wishX /= len;
          wishZ /= len;
        }

        if ((keys.Space || mJump) && onGround) {
          vy = JUMP;
          onGround = false;
        }

        vx = wishX * SPEED;
        vz = wishZ * SPEED;
        vy += GRAVITY * dt;

        player.position.x += vx * dt;
        player.position.y += vy * dt;
        player.position.z += vz * dt;

        checkPlatforms();
        checkCheckpoints();
        updateLasers(t, dt);

        if (player.position.y < -8) die("Упал!");

        if (!finished && player.position.z > FINISH_Z - 1.5 && Math.abs(player.position.x) < 3.2) {
          finished = true;
          document.getElementById("win").classList.add("show");
          toast("Финиш!");
        }

        updateHud();
      }

      finishRing.rotation.z += dt * 1.5;
      orbit.follow(player.position);
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
  <script src="../shared/amal-hub.js" defer></script>
</body>
</html>
