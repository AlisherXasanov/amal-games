<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>2D дом Валеры · Миры Амаля</title>
  <meta name="theme-color" content="#f59e0b" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#1c1408;font-family:system-ui,sans-serif;color:#fff7ed;user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 0%,#78350f,#1c1408 70%)}
    canvas{display:block;width:min(1100px,100%);height:auto;max-height:100%;image-rendering:pixelated;border-radius:8px;touch-action:none}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:12px 14px;border-radius:16px;background:rgba(28,20,8,.94);border:2px solid #fbbf24;font:800 13px/1.45 system-ui;max-width:min(420px,92vw);pointer-events:none}
    #title{position:fixed;top:18%;left:50%;transform:translate(-50%,-50%);z-index:25;padding:10px 16px;border-radius:14px;background:rgba(15,23,42,.92);border:2px solid #fde68a;font:900 16px system-ui;display:none;text-align:center;max-width:90vw}
    #toast{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(28,20,8,.96);border:2px solid #fbbf24;font:900 15px system-ui;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#b45309;color:#fff;text-decoration:none;font:800 12px system-ui}
    #btns{position:fixed;bottom:12px;right:12px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:75vw}
    #btns button{padding:10px 12px;border:0;border-radius:12px;font:800 12px system-ui;cursor:pointer;color:#fff;background:#ea580c}
    #btn-cam{background:#7c3aed}#btn-lab{background:#0284c7}#btn-clips{background:#0f766e}
    #panel{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
    #panel .box{background:#1c1408;border:2px solid #fbbf24;border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
    #panel h2{font:900 16px system-ui;margin-bottom:8px}
    #panel button{margin:4px 4px 0 0;padding:10px 12px;border:0;border-radius:10px;font:800 12px system-ui;cursor:pointer;background:#ea580c;color:#fff}
    #panel .x{background:#64748b}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(251,191,36,.4);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(251,191,36,.5);pointer-events:none}
    #rec{position:fixed;top:12px;right:12px;z-index:22;padding:8px 12px;border-radius:999px;background:#7f1d1d;color:#fecaca;font:900 12px system-ui;display:none}
    @media(pointer:coarse){#pad{display:block}.back{bottom:140px}#btns{bottom:150px}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud">
    <b>🏠 2D дом Валеры</b> · жёлтый друг<br />
    WASD · клик / E — смотреть и брать · камера «снимает» ролик · опыты как у познавателя<br />
    <span id="inv" style="opacity:.9;font-size:12px">в руках: ничего</span>
  </div>
  <div id="title"></div>
  <div id="toast"></div>
  <div id="rec">● ЗАПИСЬ</div>
  <a class="back" href="../index.html">← Миры Амаля</a>
  <div id="pad"><div id="pad-knob"></div></div>
  <div id="btns">
    <button type="button" id="btn-cam">камера</button>
    <button type="button" id="btn-clips">ролики</button>
    <button type="button" id="btn-lab">опыт</button>
    <button type="button" id="btn-use">взаимодействие</button>
  </div>
  <div id="panel"><div class="box" id="panel-body"></div></div>
  <script src="./game.js?v=1"></script>
</body>
</html>
