<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Мульт — короткий рисованный ролик</title>
  <meta name="description" content="Короткий рисованный мульт на сайте. Смотри сразу — без рекламы." />
  <meta name="theme-color" content="#f3e7d3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body>
  <header class="top">
    <a class="back" href="../">← Каталог</a>
    <p class="hint">это не игра · просто мульт · смотри</p>
  </header>

  <main class="wrap">
    <h1>Мульт</h1>
    <p class="sub">Рисованная анимация. Жми «Смотреть» — начинается сразу.</p>

    <div class="tv" aria-label="Рисованный мульт">
      <canvas id="c" width="960" height="540" role="img" aria-label="Анимация: маленький герой идёт к солнцу"></canvas>
      <div class="tv-bar">
        <button type="button" class="go" id="btnPlay">▶ Смотреть</button>
        <button type="button" class="ghost" id="btnAgain" hidden>↻ Ещё раз</button>
        <span class="status" id="status">готов</span>
      </div>
    </div>

    <p class="foot">Нарисовано линиями «от руки». Без рекламы. Без чужих вставок.</p>
  </main>

  <script src="./app.js?v=2" defer></script>
</body>
</html>
