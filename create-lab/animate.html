<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Анимации — Create Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./">Create <span>Lab</span></a>
      <nav class="nav">
        <a href="./">Главная</a>
        <a class="is-active" href="./animate.html">Анимации</a>
        <a href="./game.html">Игры</a>
      </nav>
    </header>

    <p class="eyebrow">Кадр за кадром</p>
    <h1 class="page-title" style="margin-bottom:1rem">Аниматор</h1>

    <div class="workspace">
      <aside class="panel">
        <h3>Кисть</h3>
        <div class="toolbar" style="flex-direction:column;align-items:stretch">
          <button type="button" class="tool-btn is-on" data-tool="pen">Карандаш</button>
          <button type="button" class="tool-btn" data-tool="eraser">Ластик</button>
          <button type="button" class="tool-btn" data-tool="fill">Заливка</button>
          <label class="field"><span>Цвет</span><input type="color" id="color" value="#0d6e5f" /></label>
          <label class="field"><span>Толщина <b id="size-label">6</b></span><input type="range" id="size" min="1" max="48" value="6" /></label>
          <label class="field" style="flex-direction:row;align-items:center;gap:0.5rem">
            <input type="checkbox" id="onion" checked />
            <span style="margin:0">Показать предыдущий кадр</span>
          </label>
        </div>
        <div class="panel ai-stage" style="min-height:auto;padding:0.8rem;margin-top:0.6rem;box-shadow:none">
          <div class="ai-buddy" id="ai-buddy" style="width:140px">
            <div class="rings"></div>
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="ai-body"><div class="ai-face"><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="mouth"></div><span></span></div></div>
          </div>
          <p id="ai-status-text" style="text-align:center;font-size:0.85rem;color:rgba(26,36,32,0.7)">Микрофон: нажал → говори → Стоп. Или пиши ниже.</p>
          <div class="mic-row" style="margin-top:0.35rem">
            <button type="button" class="mic-btn" id="btn-mic" aria-pressed="false" aria-label="Сказать" style="min-width:110px;padding:0.65rem 1rem;font-size:0.92rem">
              <span class="mic-ico">🎤</span>
              <span class="mic-txt">Сказать</span>
            </button>
          </div>
          <p id="mic-label" class="mic-hint-line" data-label-start="Сказать" data-label-stop="СТОП">
            Оранжевая = сказать. Зелёная «СТОП» = выключить.
          </p>
          <form id="text-form" class="chat-form" style="margin-top:0.4rem;width:100%">
            <input type="text" id="text-input" placeholder="Напиши: новый кадр" style="width:100%" />
            <button class="btn primary" type="submit" style="width:100%">Отправить</button>
          </form>
        </div>
      </aside>

      <section class="canvas-wrap">
        <div class="toolbar">
          <input type="text" id="anim-name" placeholder="Название анимации" value="Моя анимация" style="flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:0.55rem 0.75rem;background:#fff" />
          <label class="field" style="margin:0;min-width:110px"><span>FPS</span><input type="number" id="fps" min="1" max="24" value="8" /></label>
          <button type="button" class="btn" id="btn-play">▶ Плей</button>
          <button type="button" class="btn primary" id="btn-save">Сохранить</button>
        </div>
        <canvas id="stage" width="480" height="360" aria-label="Холст анимации"></canvas>
        <div class="toolbar">
          <button type="button" class="btn" id="btn-add">+ Кадр</button>
          <button type="button" class="btn" id="btn-dup">Дублировать</button>
          <button type="button" class="btn" id="btn-del">Удалить кадр</button>
          <button type="button" class="btn ghost" id="btn-clear">Очистить кадр</button>
        </div>
        <div class="frames" id="frames" aria-label="Кадры"></div>
      </section>

      <aside class="panel">
        <h3>Сохранённые</h3>
        <div class="list" id="saved-list"></div>
        <div class="chat-log" id="chat-log" style="margin-top:0.6rem;max-height:140px"></div>
      </aside>
    </div>
  </div>

  <script src="./storage.js"></script>
  <script src="./ai.js?v=2"></script>
  <script src="./animate.js?v=2"></script>
  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="../shared/amal-hub.js?v=55"></script>
  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="../shared/amal-hub.js?v=55"></script>
  <script src="../shared/amal-3d-wip-lock.js?v=2" data-guard="1"></script>
  <script src="../shared/amal-site-faq.js?v=1"></script>
</body>
</html>
