<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Играть — Create Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    .play-shell { max-width: 560px; margin: 0 auto; display: grid; gap: 0.85rem; }
    #c {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      background: #10241f;
      touch-action: none;
      box-shadow: var(--shadow);
    }
    .touch-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      max-width: 220px;
      margin: 0 auto;
    }
    .touch-pad button {
      border: 0;
      border-radius: 14px;
      padding: 0.85rem;
      font-weight: 800;
      background: rgba(255,255,255,0.75);
      cursor: pointer;
    }
    .touch-pad .spacer { visibility: hidden; }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="shell play-shell">
    <header class="topbar">
      <a class="brand" href="./">Create <span>Lab</span></a>
      <nav class="nav">
        <a href="./game.html">Назад</a>
        <a href="./">Главная</a>
      </nav>
    </header>
    <h1 class="page-title" id="title" style="font-size:clamp(1.5rem,4vw,2.2rem)">Игра</h1>
    <p class="lede" id="desc" style="margin:0"></p>
    <div class="toolbar">
      <button type="button" class="btn primary" id="restart">Заново</button>
      <strong id="score">Очки: 0</strong>
    </div>
    <canvas id="c" width="480" height="480"></canvas>
    <p class="lede" id="help" style="margin:0;font-size:0.9rem">Клавиатура: стрелки / WASD. На телефоне — кнопки.</p>
    <div class="touch-pad" id="pad">
      <span class="spacer"></span>
      <button type="button" data-dir="up">▲</button>
      <span class="spacer"></span>
      <button type="button" data-dir="left">◀</button>
      <button type="button" data-dir="down">▼</button>
      <button type="button" data-dir="right">▶</button>
    </div>
  </div>
  <script src="./catalog.js"></script>
  <script src="./storage.js"></script>
  <script src="./play.js?v=3"></script>
  <script src="../shared/amal-owner-powers.js?v=20"></script>
  <script src="../shared/amal-hub.js?v=48"></script>
  <script src="../shared/amal-3d-wip-lock.js?v=2" data-guard="1"></script>
  <script src="../shared/amal-site-faq.js?v=1"></script>
</body>
</html>
