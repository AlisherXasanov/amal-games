<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Amal Studio — как Roblox Studio | Amaya Games</title>
  <meta name="description" content="Amal Studio: заготовки, карта, свойства, кнопка Играть — почти как Roblox Studio, но своё." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --panel2: #2d2d30;
      --border: #3c3c3c;
      --text: #cccccc;
      --muted: #858585;
      --accent: #007acc;
      --accent2: #0e639c;
      --play: #16825d;
      --play-h: #1a9870;
      --danger: #c42b1c;
      --ribbon-h: 42px;
      --side-w: 280px;
      --right-w: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      background: var(--bg); color: var(--text); font-size: 13px;
    }
    .studio { display: grid; grid-template-rows: var(--ribbon-h) 1fr 28px; height: 100dvh; }

    /* Ribbon */
    .ribbon {
      display: flex; align-items: center; gap: 6px; padding: 0 10px;
      background: var(--panel2); border-bottom: 1px solid var(--border);
    }
    .ribbon .logo {
      font-weight: 800; font-size: 14px; color: #fff; margin-right: 10px; white-space: nowrap;
    }
    .ribbon .logo span { color: #4fc3f7; }
    .ribbon a.back {
      color: #9cdcfe; text-decoration: none; font-weight: 700; font-size: 12px; margin-right: 8px;
    }
    .ribbon .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
    .tool-btn {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      min-width: 52px; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px;
      background: transparent; color: var(--text); cursor: pointer; font: 600 10px inherit;
    }
    .tool-btn:hover { background: rgba(255,255,255,.06); }
    .tool-btn.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
    .tool-btn .ico { font-size: 16px; line-height: 1; }
    .ribbon-spacer { flex: 1; }
    .play-btn {
      padding: 8px 18px; border: 0; border-radius: 4px; cursor: pointer;
      font: 800 13px inherit; color: #fff; background: var(--play);
    }
    .play-btn:hover { background: var(--play-h); }
    .play-btn.stop { background: var(--danger); }

    /* Main */
    .main { display: grid; grid-template-columns: var(--side-w) 1fr var(--right-w); min-height: 0; }

    /* Left toolbox */
    .toolbox {
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .toolbox-head {
      padding: 8px 10px; font-weight: 800; font-size: 11px; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--border); letter-spacing: .04em;
    }
    .toolbox-tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
    .toolbox-tabs button {
      flex: 0 0 auto; padding: 7px 8px; border: 0; background: transparent; color: var(--muted);
      font: 700 10px inherit; cursor: pointer; white-space: nowrap;
    }
    .toolbox-tabs button.on { color: #fff; background: var(--panel2); border-bottom: 2px solid var(--accent); }
    .toolbox-list { flex: 1; overflow-y: auto; padding: 6px; }
    .prefab {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px;
      margin-bottom: 4px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--panel2); color: var(--text); cursor: pointer; text-align: left;
      font: 600 12px inherit;
    }
    .prefab:hover { border-color: var(--accent); background: #333337; }
    .prefab.on { border-color: var(--accent); background: #094771; color: #fff; }
    .prefab .thumb {
      width: 32px; height: 32px; border-radius: 4px; background: #444;
      display: grid; place-items: center; font-size: 18px; flex-shrink: 0; overflow: hidden;
    }
    .toolbox-list.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; align-content: start; }
    .prefab.card {
      flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px;
      font-size: 10px; text-align: center;
    }
    .prefab .pname { line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .prefab .price { font-size: 9px; color: #fbbf24; font-weight: 800; }
    .prefab.locked { opacity: 0.65; }
    .prefab .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .prefab .thumb.preview-em { font-size: 28px; background: #1e293b; }
    .prefab.card .thumb { width: 52px; height: 52px; }
    .shop-bar {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      background: #1a1a2e; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .shop-bar b { color: #fbbf24; font-size: 15px; }
    .shop-bar button {
      flex: 1; padding: 5px 8px; border: 0; border-radius: 4px; cursor: pointer;
      font: 800 10px inherit; background: linear-gradient(135deg,#7c3aed,#2563eb); color: #fff;
    }

    /* Viewport */
    .viewport-wrap { position: relative; background: #0d1117; min-width: 0; }
    #studio-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #studio-canvas.select-mode { cursor: default; }
    .vp-label {
      position: absolute; top: 8px; left: 8px; padding: 4px 10px; border-radius: 4px;
      background: rgba(0,0,0,.55); font: 700 11px inherit; color: #aaa; pointer-events: none;
    }
    .vp-hint {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,.65);
      font: 600 11px inherit; color: #ccc; pointer-events: none; white-space: nowrap;
    }

    /* Right panel */
    .right { display: grid; grid-template-rows: 1fr 1fr; min-height: 0; background: var(--panel); border-left: 1px solid var(--border); }
    .panel { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--border); }
    .panel-head {
      padding: 6px 10px; font-weight: 800; font-size: 11px; text-transform: uppercase;
      color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--border);
    }
    .explorer { flex: 1; overflow-y: auto; padding: 4px 0; }
    .exp-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 16px;
      cursor: pointer; font-size: 12px;
    }
    .exp-item:hover { background: rgba(255,255,255,.05); }
    .exp-item.on { background: var(--accent2); color: #fff; }
    .exp-item .ico { opacity: .8; }
    .props { flex: 1; overflow-y: auto; padding: 8px 10px; }
    .prop-row { margin-bottom: 8px; }
    .prop-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .prop-row input, .prop-row select {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 3px;
      background: #3c3c3c; color: #fff; font: inherit;
    }
    .prop-row input[type=color] { height: 32px; padding: 2px; cursor: pointer; }
    .prop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .prop-grid input { width: 100%; }
    .prop-empty { color: var(--muted); font-size: 12px; padding: 12px 4px; }
    .prop-del {
      width: 100%; margin-top: 8px; padding: 7px; border: 0; border-radius: 4px;
      background: var(--danger); color: #fff; font: 700 12px inherit; cursor: pointer;
    }

    /* Status bar */
    .status {
      display: flex; align-items: center; gap: 16px; padding: 0 12px;
      background: var(--accent2); font: 600 11px inherit; color: #fff;
    }
    .status button {
      padding: 3px 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 3px;
      background: transparent; color: #fff; font: inherit; cursor: pointer;
    }
    .status button:hover { background: rgba(255,255,255,.12); }

    #toast {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 50;
      padding: 10px 18px; border-radius: 6px; background: #094771; color: #fff;
      font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 900px) {
      :root { --side-w: 160px; --right-w: 200px; }
      .tool-btn { min-width: 44px; padding: 4px 4px; }
    }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div class="studio">
    <header class="ribbon">
      <a class="back" href="./">← Lab</a>
      <div class="logo">Amal <span>Studio</span></div>
      <div class="sep"></div>
      <button type="button" class="tool-btn on" data-mode="select" title="Выбор">
        <span class="ico">↖</span> Выбор
      </button>
      <button type="button" class="tool-btn" data-mode="move" title="Перемещение">
        <span class="ico">✥</span> Двигать
      </button>
      <button type="button" class="tool-btn" data-mode="rotate" title="Поворот">
        <span class="ico">↻</span> Поворот
      </button>
      <button type="button" class="tool-btn" data-mode="scale" title="Масштаб">
        <span class="ico">⤢</span> Размер
      </button>
      <div class="sep"></div>
      <button type="button" class="tool-btn" id="btn-grid" title="Сетка">
        <span class="ico">#</span> Сетка
      </button>
      <button type="button" class="tool-btn" id="btn-snap" title="Привязка">
        <span class="ico">⊞</span> Snap
      </button>
      <div class="ribbon-spacer"></div>
      <button type="button" class="play-btn" id="btn-play">▶ Играть</button>
    </header>

    <div class="main">
      <aside class="toolbox">
        <div class="toolbox-head">Каталог — своё, не Roblox</div>
        <div class="shop-bar">
          <span>🪙 <b id="shop-coins">500</b></span>
          <button type="button" id="btn-shop-all">Купить ВСЁ</button>
        </div>
        <div class="toolbox-tabs">
          <button type="button" class="on" data-cat="build">Строй</button>
          <button type="button" data-cat="props">Вещи</button>
          <button type="button" data-cat="acc">👒 Acc</button>
          <button type="button" data-cat="nature">🌿</button>
          <button type="button" data-cat="ride">🚗</button>
          <button type="button" data-cat="fun">🎉</button>
          <button type="button" data-cat="tex">🎨</button>
          <button type="button" data-cat="pic">🖼</button>
          <button type="button" data-cat="sound">🔊</button>
          <button type="button" data-cat="game">🎮</button>
        </div>
        <div class="toolbox-list grid" id="prefab-list"></div>
      </aside>

      <div class="viewport-wrap">
        <canvas id="studio-canvas"></canvas>
        <div class="vp-label" id="vp-mode">РЕДАКТОР</div>
        <div class="vp-hint" id="vp-hint">ПКМ камера · Двигать=тащи · Shift+тащи=вверх · Крутить=тащи · Размер=колёсико · Ctrl+D копия</div>
      </div>

      <aside class="right">
        <div class="panel">
          <div class="panel-head">Проводник</div>
          <div class="explorer" id="explorer"></div>
        </div>
        <div class="panel">
          <div class="panel-head">Свойства</div>
          <div class="props" id="props">
            <p class="prop-empty">Выбери объект в сцене</p>
          </div>
        </div>
      </aside>
    </div>

    <footer class="status">
      <span id="status-text">Готово · заготовка не выбрана</span>
      <button type="button" id="btn-save">💾 Сохранить</button>
      <button type="button" id="btn-load">📂 Загрузить</button>
      <button type="button" id="btn-new">🆕 Новый</button>
    </footer>
  </div>
  <div id="toast"></div>

  <script src="../shared/amal-orbit-cam.js?v=1"></script>
  <script src="../shared/amal-walk-player.js?v=1"></script>
  <script type="module" src="./studio3d.js?v=3"></script>
</body>
</html>
