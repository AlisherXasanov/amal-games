<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Lab — создай свою 3D игру | Amal Games</title>
  <meta name="description" content="3D Lab на Amal Games: ставь блоки, пол и персонажей, настраивай силу, сохраняй мир в браузере. Бесплатный конструктор 3D игр." />
  <meta name="keywords" content="3D Lab, Amal Games, создать игру, конструктор игр, браузерная 3D" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://alisherxasanov.github.io/amal-games/create-lab/lab3d.html" />
  <meta property="og:title" content="3D Lab — Amal Games" />
  <meta property="og:description" content="Свой 3D мир в браузере: блоки, персонажи, сила до ×10000." />
  <meta property="og:url" content="https://alisherxasanov.github.io/amal-games/create-lab/lab3d.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2744; }
    .lab-wrap { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
    .lab-top {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
      background: rgba(8,12,24,.92); border-bottom: 1px solid rgba(255,255,255,.12); z-index: 5;
    }
    .lab-top a { color: #93c5fd; font-weight: 800; text-decoration: none; margin-right: 8px; }
    .lab-top h1 { margin: 0; font: 900 18px/1 Nunito,sans-serif; color: #fde68a; flex: 1; }
    .lab-top button, .lab-top select {
      border: 0; border-radius: 10px; padding: 8px 12px; font: 800 12px Nunito,sans-serif; cursor: pointer;
      background: rgba(255,255,255,.1); color: #fff;
    }
    .lab-top button.on { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #111; }
    .lab-top button.save { background: #0d9488; color: #fff; }
    .lab-top label { font: 800 11px Nunito,sans-serif; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
    .lab-top input[type=range] { width: 100px; }
    #lab-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .lab-bot {
      padding: 8px 12px; background: rgba(8,12,24,.92); border-top: 1px solid rgba(255,255,255,.1);
      font: 700 11px/1.4 Nunito,sans-serif; color: #94a3b8;
    }
    .lab-bot b { color: #fde68a; }
    #lab-toast {
      position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 20;
      padding: 10px 16px; border-radius: 12px; background: rgba(0,0,0,.85); color: #fde68a;
      font: 900 13px Nunito,sans-serif; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #lab-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="lab-wrap">
    <header class="lab-top">
      <a href="./">← Lab</a>
      <h1>🧪 3D Lab — твоя игра</h1>
      <button type="button" data-tool="block" class="on">🧱 Блок</button>
      <button type="button" data-tool="guy">🧍 Герой</button>
      <button type="button" data-tool="floor">🟩 Пол</button>
      <button type="button" data-tool="erase">🗑 Стереть</button>
      <select id="lab-color">
        <option value="#facc15">Жёлтый</option>
        <option value="#38bdf8">Синий</option>
        <option value="#f87171">Красный</option>
        <option value="#4ade80">Зелёный</option>
        <option value="#c084fc">Фиолет</option>
        <option value="#fb923c">Оранж</option>
      </select>
      <label>Сила ×<input type="range" id="lab-power" min="1" max="10000" value="1000" step="1" /><span id="lab-power-val">1000</span></label>
      <button type="button" class="save" id="lab-save">💾 Сохранить</button>
      <button type="button" id="lab-load">📂 Загрузить</button>
      <button type="button" id="lab-clear">Очистить</button>
    </header>
    <canvas id="lab-canvas"></canvas>
    <footer class="lab-bot">
      <b>WASD</b> — ходить · <b>Q/E</b> — вверх/вниз камеры · <b>Клик</b> — поставить ·
      <b>Пробел</b> — удар (сила × слайдер) · <b>Без перезарядки</b> · Это твоя лаборатория, не Bed Wars
    </footer>
  </div>
  <div id="lab-toast"></div>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./lab3d.js?v=1"></script>
</body>
</html>
