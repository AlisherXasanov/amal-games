<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Робот Эмо · друг | Игры Амаля</title>
  <meta name="description" content="Говори с Эмо, микрофон, игры прямо здесь — змейка и 3D. Без ухода по ссылкам." />
  <meta name="theme-color" content="#0b1220" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=3" />
</head>
<body>
  <a class="back" href="../friends.html?v=8&stay=1&code=amal-star-friends">← Назад</a>

  <div class="desk">
    <header class="top">
      <div>
        <h1>Робот Эмо</h1>
        <p class="sub" id="modeLabel">друг · болтай · «сделай змейку» / «сделай 3D» здесь</p>
      </div>
      <div class="mood-pill" id="moodPill">😊 спокойный</div>
    </header>

    <div class="stage">
      <div class="robot" id="robot">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="head">
          <div class="face-screen" id="face">
            <canvas id="eyes" width="280" height="160" aria-label="Личико Эмо"></canvas>
          </div>
        </div>
        <div class="body">
          <div class="chest-light" id="chest"></div>
        </div>
        <div class="leg left"></div>
        <div class="leg right"></div>
        <div class="shadow"></div>
      </div>
      <div class="bubble" id="bubble">Привет! Я Эмо. Погладь, поговори или скажи «сделай змейку».</div>
    </div>

    <div class="actions">
      <button type="button" class="act" data-act="pet">Погладить</button>
      <button type="button" class="act" data-act="dance">Танец</button>
      <button type="button" class="act" data-act="game">Сердечки</button>
      <button type="button" class="act" data-act="make">Сделай игру</button>
      <button type="button" class="act" data-act="sleep">Спать</button>
      <button type="button" class="act mic" id="btnMic">Микрофон</button>
    </div>

    <div class="play" id="playPanel" hidden>
      <div class="play-bar">
        <p class="mini-title" id="playTitle">Игра</p>
        <div class="play-bar-right">
          <span>Очки: <b id="playScore">0</b></span>
          <button type="button" id="playClose">Закрыть</button>
        </div>
      </div>
      <canvas id="playCanvas" width="480" height="320"></canvas>
      <div class="play-hint" id="playHint">Стрелки / WASD · микрофон работает</div>
      <div class="touch-pad" id="touchPad" hidden>
        <span></span><button type="button" data-k="up">▲</button><span></span>
        <button type="button" data-k="left">◀</button>
        <button type="button" data-k="down">▼</button>
        <button type="button" data-k="right">▶</button>
      </div>
    </div>

    <div class="chat">
      <div class="log" id="log" aria-live="polite"></div>
      <form id="form" class="composer">
        <input id="input" type="text" autocomplete="off" placeholder="Микрофон или текст: сделай змейку / 3D" maxlength="200" />
        <button type="submit">➤</button>
      </form>
      <p class="hint">Всё здесь: болтай, проверяй микрофон, играй. Ссылок никуда не кидаю.</p>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./game.js?v=3"></script>
</body>
</html>
