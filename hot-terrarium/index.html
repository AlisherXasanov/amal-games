<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Жаркий террариум · жизнь | Игры Амаля</title>
  <meta name="theme-color" content="#c2410c" />
  <script>window.__AMAL_NO_WORLD__ = true;</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:#1c0a00;font-family:system-ui,sans-serif;color:#fff7ed;user-select:none}
    #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 40% 0%,#7c2d12,#1c0a00 70%)}
    canvas{display:block;width:min(1100px,100%);height:auto;max-height:100%;touch-action:none;border-radius:6px;cursor:crosshair;image-rendering:pixelated}
    #hud{position:fixed;top:10px;left:10px;z-index:20;padding:12px 14px;border-radius:14px;background:rgba(28,10,0,.92);border:2px solid #fb923c;font:800 13px/1.45 system-ui;max-width:min(420px,92vw);pointer-events:none}
    .bar{height:10px;border-radius:6px;background:#431407;overflow:hidden;margin:4px 0;border:1px solid #9a3412}
    .bar>i{display:block;height:100%;width:100%;transform-origin:left center}
    #hp>i{background:linear-gradient(90deg,#ef4444,#fbbf24)}
    #arm>i{background:linear-gradient(90deg,#64748b,#22d3ee)}
    #heat>i{background:linear-gradient(90deg,#f97316,#dc2626)}
    #toast{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);z-index:30;padding:12px 16px;border-radius:14px;background:rgba(28,10,0,.96);border:2px solid #fb923c;font:900 15px system-ui;display:none;text-align:center;max-width:90vw}
    .back{position:fixed;bottom:12px;left:12px;z-index:20;padding:8px 12px;border-radius:12px;background:#9a3412;color:#fff;text-decoration:none;font:800 12px system-ui}
    #inv{position:fixed;top:10px;right:10px;z-index:20;padding:10px 12px;border-radius:12px;background:rgba(28,10,0,.92);border:2px solid #fbbf24;font:800 12px system-ui;line-height:1.5}
    #btns{position:fixed;bottom:12px;right:12px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    #btns button{padding:10px 12px;border:0;border-radius:12px;font:800 12px system-ui;cursor:pointer;color:#fff;background:#ea580c}
    #btn-heal{background:#16a34a}#btn-jump{background:#4f46e5}#btn-talk{background:#0284c7}
    #pad{position:fixed;bottom:16px;left:14px;z-index:25;display:none;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(251,146,60,.4);touch-action:none}
    #pad-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(251,146,60,.5);pointer-events:none}
    #char{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 20%,#9a3412,#1c0a00);display:flex;align-items:center;justify-content:center;padding:16px}
    #char .box{background:rgba(28,10,0,.95);border:2px solid #fb923c;border-radius:18px;padding:20px;max-width:420px;width:100%}
    #char h1{font:900 22px system-ui;margin-bottom:8px}
    #char p{opacity:.85;margin-bottom:14px;font:600 13px/1.4 system-ui}
    #char label{display:block;font:800 12px system-ui;margin:10px 0 4px}
    #char input,#char select{width:100%;padding:10px 12px;border-radius:10px;border:2px solid #9a3412;background:#431407;color:#fff7ed;font:700 14px system-ui}
    #skins{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    #skins button{flex:1;min-width:70px;padding:12px 8px;border-radius:12px;border:2px solid #64748b;background:#292524;color:#fff;font:800 12px system-ui;cursor:pointer}
    #skins button.on{border-color:#fbbf24;background:#78350f}
    #char .go{margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;background:#ea580c;color:#fff;font:900 16px system-ui;cursor:pointer}
    #shop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
    #shop .box{background:#1c0a00;border:2px solid #38bdf8;border-radius:16px;padding:16px;max-width:380px;width:100%}
    #shop button{margin:6px 4px 0 0;padding:10px 12px;border:0;border-radius:10px;font:800 12px system-ui;cursor:pointer;background:#0284c7;color:#fff}
    #shop .x{background:#64748b}
    @media(pointer:coarse){#pad{display:block}.back{bottom:140px}#btns{bottom:150px}}
  </style>
</head>
<body>
  <div id="char">
    <div class="box">
      <h1>🏜️ Жаркий террариум</h1>
      <p>Бесконечный мир · дома · сундуки · торговля · боты-помощники. Как жизнь, но чуть иначе.</p>
      <label>Имя</label>
      <input id="name" maxlength="16" placeholder="Амаль" value="Амаль" />
      <label>Год (влияет на сезон мира)</label>
      <input id="year" type="number" min="1900" max="2099" value="2026" />
      <label>Персонаж</label>
      <div id="skins">
        <button type="button" data-skin="beige" class="on">беж</button>
        <button type="button" data-skin="green">зелён</button>
        <button type="button" data-skin="pink">розов</button>
        <button type="button" data-skin="purple">фиол</button>
        <button type="button" data-skin="yellow">жёлт</button>
      </div>
      <button type="button" class="go" id="start">Войти в мир →</button>
    </div>
  </div>
  <div id="shop"><div class="box" id="shop-body"></div></div>
  <div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
  <div id="hud" style="display:none">
    <b>🏜️ <span id="pname">Амаль</span></b> · год <span id="pyear">2026</span> · x <span id="px">0</span><br />
    Бесконечный биом · F говорить · E хил · ЛКМ ломать · ПКМ ставить<br />
    <div>❤️ HP <div class="bar" id="hp"><i id="hp-fill"></i></div></div>
    <div>🤚 Рука <div class="bar" id="arm"><i id="arm-fill"></i></div></div>
    <div>🔥 Жар <div class="bar" id="heat"><i id="heat-fill"></i></div></div>
  </div>
  <div id="inv" style="display:none">🪙<span id="coin-n">0</span> · хил×<span id="heal-n">0</span> · дер×<span id="wood-n">0</span> · пес×<span id="sand-n">0</span> · игр×<span id="toy-n">0</span></div>
  <div id="toast"></div>
  <a class="back" href="../index.html">← Каталог</a>
  <div id="pad"><div id="pad-knob"></div></div>
  <div id="btns" style="display:none">
    <button type="button" id="btn-talk">говорить (F)</button>
    <button type="button" id="btn-heal">хил (E)</button>
    <button type="button" id="btn-jump">прыг</button>
  </div>
  <script src="./game.js?v=3"></script>
</body>
</html>
